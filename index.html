<!--
════════════════════════════════════════════════════════════════════════════
 海港夕煙  Harbor Plume
 單一檔案 WebGPU 作品：臨海工業區的黃昏＋煙流擴散分析（高斯煙流模型）
 設計說明見 DESIGN.md；進度與踩過的坑見 PROGRESS.md。

 目錄（用編輯器搜尋「§」加代號可以跳到該段）
 ───────────────────────────────────────────────────────────────────────────
 §CSS        介面樣式
 §HTML       canvas、介面、錯誤與不支援說明
 §WGSL       著色器模組（每個模組一個 <script type="text/wgsl" id="…">，依檔案順序）
   共用       common（uniform 結構、取樣器、雜湊）、fullscreen（全螢幕三角形）
   大氣       atmo_fn、atmo_lut_fn、lut_trans、lut_ms、sky_lut_map、lut_sky、amb_cube
   場景貼圖   scene_tex（group 1 共用貼圖）
   分析模式   phys_fn（WGSL 版擴散模型）、heat_compute、heat_fn、curtain（剖面簾幕）
   燈光       lights、lightmap_gen、flame
   煙流       noise3d_gen、plume_fn、plume_tau、lightvol
   天空地形   sky_fn、sky、terrain_gen、terrain_fn、lighting、terrain、water
   設施       mesh_io、shadow、mesh
   體積合成   vol_march、vol_temporal、vol_composite
   後製       resolve（MSAA）、bloom_down、bloom_up、fxaa、post_final（AgX 與輸出）
 §J0  設定、查詢參數、畫質等級表
 §J1  數學工具
 §J2  物理模型（JavaScript double 參考實作）
 §J3  GPU 基礎建設：WGSL 前處理、binding 反射、pipeline、uniform buffer
 §J4  render target 與共用資源
 §J5  場景生成：配置、地形（§J5b 程序網格、§J5c 煙流查表、§J5d 熱圖參數）
 §J6  各個 pass
 §J7  相機與輸入
 §J8  介面
 §J9  測試鉤子：?shot、?selftest、?bench、window.__scene
 §J10 主迴圈與啟動
════════════════════════════════════════════════════════════════════════════
-->

<!-- §WGSL ─────────────────────────────────────────────────────────── -->

<script type="text/wgsl" id="common">
// ── common：每幀 uniform、取樣器、小工具 ──
// 注意：uniform struct 只用 vec4f 與 mat4x4f（都對齊 16 bytes），JS 端會解析這個 struct 自動算位移。
struct Frame {
  viewProj: mat4x4f,
  prevViewProj: mat4x4f,
  camPos: vec4f,     // xyz 世界座標（m），w = near
  camRight: vec4f,   // xyz，w = tan(水平視角/2)
  camUp: vec4f,      // xyz，w = tan(垂直視角/2)
  camFwd: vec4f,     // xyz，w 預留
  viewport: vec4f,   // 內部解析度 w, h, 1/w, 1/h
  sunDir: vec4f,     // xyz 指向太陽，w = 太陽高度角（rad）
  sunIllum: vec4f,   // rgb 地面的太陽照度，w = 夜間係數 0..1
  time: vec4f,       // x 模擬時間（s），y 幀序號，z 分析模式係數 0..1，w 預留
  shadowVP: array<mat4x4f, 4>,   // 各 cascade 的光空間矩陣
  shadowSplit: vec4f,            // 各 cascade 的最遠視距（m）
  shadowTexel: vec4f,            // 各 cascade 一個 texel 的世界大小（m）
  shadowPrm: vec4f,              // x cascade 數，y 解析度，z 濾波半徑（texel），w 預留
  shadowDir: vec4f,              // 陰影用的光方向（高度角有下限）
};
// 大氣參數（長度單位：公里）
struct Atmo {
  rayleigh: vec4f,   // rgb 海平面散射係數 [/km]，w = 尺度高 [km]
  mie: vec4f,        // x 散射、y 吸收 [/km]，z 尺度高 [km]，w 相位函數 g
  ozone: vec4f,      // rgb 吸收係數 [/km]
  haze: vec4f,       // 近地霾：x 散射、w 吸收 [/km]，y 尺度高 [km]
  sunE: vec4f,       // rgb 大氣層頂的太陽照度（相對單位），w = 太陽視半徑 [rad]
  misc: vec4f,       // x 地面反照率，y 相機高度 [km]，z 雲量 0..1，w 日面輝度上限
};
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var sLin: sampler;
@group(0) @binding(2) var sRep: sampler;
@group(0) @binding(3) var sNear: sampler; // @nonfiltering
@group(0) @binding(4) var<uniform> A: Atmo;
@group(0) @binding(5) var sShadow: sampler_comparison;
// 煙流（3D 外觀）參數。中心線高度與粗細來自 plumeLUT（JS 的物理模組算好寫入）
struct PlumeU {
  wind: vec4f,             // xy＝下風方向 (x,z) 單位向量，z＝平流風速 [m/s]，w＝往下風畫到多遠 [m]
  src: array<vec4f, 3>,    // xyz＝煙囪口世界座標，w＝混合比例係數（f_peak = w / (σy·σz)）
  prm: vec4f,              // x＝LUT 涵蓋的最遠距離，y＝（未使用；蜿蜒振幅改存在 plumeLUT 第 4 列），z＝水平蜿蜒波長，w＝氣膠霾消光係數（f=1 時）[1/m]
  prm2: vec4f,             // x＝混合層高度（0＝沒有逆溫層），y＝光學深度體積沿光線方向一格的長度，z＝垂直蜿蜒波長，w＝出口半徑
  lv0: vec4f,              // 光空間體積：世界座標 → uvw 的三列（xyz·p + w）
  lv1: vec4f,
  lv2: vec4f,
  obbMin: vec4f,           // 煙流外框（煙流座標：x 下風、y 高度、z 橫風），w＝原點世界 x
  obbMax: vec4f,           // w＝原點世界 z
  flare: vec4f,            // 火炬位置 xyz，w＝強度
  glow: vec4f,             // rgb＝夜間廠區燈光往上照的顏色（照亮煙流底部），w 預留
};
@group(0) @binding(6) var<uniform> PL: PlumeU;
// 擴散模型（分析模式）參數：由 JS 的物理模組算好。WGSL 這邊用 f32 重算濃度，?selftest=1 會和 JS（double）比對
struct HeatU {
  src: array<vec4f, 3>,    // x, z（世界座標）、下洗修正後的煙囪高度、煙囪口風速
  rise: array<vec4f, 3>,   // 過渡段浮升 Δh(x)=min(K·x^e, ΔhF) 的 K、e、ΔhF；w＝排放量 [μg/s]（穿透逆溫層時為 0）
  sig: vec4f,              // σy = a·x·(1+b·x)^(-1/2)，σz = c·x·(1+d·x)^e 的 a、b、c、d
  prm: vec4f,              // x＝σz 的指數 e，y＝混合層高度（0＝無），zw＝下風方向 (x,z)
  grid: vec4f,             // x＝熱圖半寬 [m]，yz＝中心（世界 x,z），w＝門檻濃度 [μg/m³]
  scale: vec4f,            // x,y＝色階下限、上限的 log10(μg/m³)，z＝白煙蒸發的下風距離 [m]，w＝剖面高度 [m]
  mark: vec4f,             // xy＝最大落地濃度位置（世界 x,z），z＝Cmax [μg/m³]，w 預留
  stn: array<vec4f, 6>,    // 虛擬測站位置（世界 x,z）
};
@group(0) @binding(7) var<uniform> HU: HeatU;

const PI: f32 = 3.14159265358979;
const TAU: f32 = 6.28318530717959;
const MAP_HALF: f32 = 12000.0;   // 地形圖涵蓋 ±12 km（要和 JS 的 WORLD.half 一致）
const LM_HALF: f32 = 6000.0;     // 夜間地面光池貼圖涵蓋 ±6 km

fn saturate(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn sat3(x: vec3f) -> vec3f { return clamp(x, vec3f(0.0), vec3f(1.0)); }
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }

// 整數雜湊（PCG 風格）→ [0,1)
fn hashU(x: u32) -> u32 {
  var v = x * 747796405u + 2891336453u;
  let w = ((v >> ((v >> 28u) + 4u)) ^ v) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hash21(p: vec2f) -> f32 {
  let q = vec2u(vec2i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y))) * (1.0 / 4294967296.0);
}
fn hash31(p: vec3f) -> f32 {
  let q = vec3u(vec3i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y ^ hashU(q.z)))) * (1.0 / 4294967296.0);
}
// Interleaved Gradient Noise（Jimenez 2014）：搭配每幀位移，時間累積後接近 blue noise
fn ign(pix: vec2f, frame: f32) -> f32 {
  let p = pix + 5.588238 * (frame % 64.0);
  return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715))));
}
// 從螢幕 uv（左上原點）取得世界空間視線方向（未正規化，沿 camFwd 的分量為 1）
fn viewRay(uv: vec2f) -> vec3f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  return F.camFwd.xyz + F.camRight.xyz * (ndc.x * F.camRight.w) + F.camUp.xyz * (ndc.y * F.camUp.w);
}
// reversed-Z 無限遠投影：深度值 → 沿 camFwd 的線性距離（m）
fn linDepth(d: f32) -> f32 { return F.camPos.w / max(d, 1e-9); }
</script>

<script type="text/wgsl" id="fullscreen">
// ── fullscreen：一個涵蓋整個畫面的三角形 ──
struct FSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> FSOut {
  var o: FSOut;
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
</script>

<script type="text/wgsl" id="atmo_fn">
// ── atmo_fn：大氣介質與查表座標（Hillaire 2020；長度單位公里）。不存取貼圖 ──
const RG: f32 = 6360.0;     // 地球半徑
const RTOP: f32 = 6460.0;   // 大氣頂
// 射線與球（球心在原點）的兩個交點距離；沒有交點回傳 (-1,-1)
fn raySphere(ro: vec3f, rd: vec3f, rad: f32) -> vec2f {
  let b = dot(ro, rd);
  let c = dot(ro, ro) - rad * rad;
  let h = b * b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h);
  return vec2f(-b - s, -b + s);
}
struct Medium { scatR: vec3f, scatM: f32, ext: vec3f };
fn medium(h: f32) -> Medium {
  let dR = exp(-h / A.rayleigh.w);
  let dM = exp(-h / A.mie.z);
  let dH = exp(-h / A.haze.y);
  let dO = max(0.0, 1.0 - abs(h - 25.0) / 15.0);
  var m: Medium;
  m.scatR = A.rayleigh.rgb * dR;
  m.scatM = A.mie.x * dM + A.haze.x * dH;
  m.ext = m.scatR + vec3f(m.scatM + A.mie.y * dM + A.haze.w * dH) + A.ozone.rgb * dO;
  return m;
}
fn phaseR(c: f32) -> f32 { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
fn phaseM(c: f32, g: f32) -> f32 {   // Cornette-Shanks
  let g2 = g * g;
  return 3.0 / (8.0 * PI) * (1.0 - g2) * (1.0 + c * c) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
fn hg(c: f32, g: f32) -> f32 {       // Henyey-Greenstein
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
// transmittance LUT 參數化（Bruneton）：(r, mu) ↔ uv
fn transUv(r: f32, mu: f32) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = sqrt(max(r * r - RG * RG, 0.0));
  let disc = r * r * (mu * mu - 1.0) + RTOP * RTOP;
  let d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  let dmin = RTOP - r;
  let dmax = rho + H;
  return vec2f((d - dmin) / (dmax - dmin), rho / H);
}
fn transUvToRMu(uv: vec2f) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = H * uv.y;
  let r = sqrt(rho * rho + RG * RG);
  let dmin = RTOP - r;
  let dmax = rho + H;
  let d = dmin + uv.x * (dmax - dmin);
  var mu = 1.0;
  if (d > 0.0) { mu = (H * H - rho * rho - d * d) / (2.0 * r * d); }
  return vec2f(r, clamp(mu, -1.0, 1.0));
}
</script>

<script type="text/wgsl" id="atmo_lut_fn">
// ── atmo_lut_fn：查 transmittance LUT（需要先宣告 transLUT）──
fn transmittance(r: f32, mu: f32) -> vec3f {
  let uv = transUv(r, mu);
  return textureSampleLevel(transLUT, sLin, (uv * vec2f(255.0, 63.0) + 0.5) / vec2f(256.0, 64.0), 0.0).rgb;
}
// 從半徑 r 的點看太陽（天頂角餘弦 mu）的透射率；被地球擋住時為 0
fn transToSun(r: f32, mu: f32) -> vec3f {
  let hc = -sqrt(max(1.0 - (RG / r) * (RG / r), 0.0));
  return transmittance(r, mu) * smoothstep(-0.004, 0.004, mu - hc);
}
</script>

<script type="text/wgsl" id="lut_trans">
// ── lut_trans：transmittance LUT（256×64）──
#include common
#include fullscreen
#include atmo_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(255.0, 63.0);
  let rm = transUvToRMu(uv);
  let ro = vec3f(0.0, rm.x, 0.0);
  let rd = vec3f(sqrt(max(1.0 - rm.y * rm.y, 0.0)), rm.y, 0.0);
  let tTop = raySphere(ro, rd, RTOP).y;
  var od = vec3f(0.0);
  let N = 48;
  for (var i = 0; i < N; i++) {   // 取樣點往起點加密（近地霾的尺度高很小）
    let a = f32(i) / f32(N);
    let b = f32(i + 1) / f32(N);
    let t0 = a * a * tTop;
    let t1 = b * b * tTop;
    let p = ro + rd * (0.5 * (t0 + t1));
    od += medium(max(length(p) - RG, 0.0)).ext * (t1 - t0);
  }
  return vec4f(exp(-od), 1.0);
}
</script>

<script type="text/wgsl" id="lut_ms">
// ── lut_ms：多重散射 LUT（32×32；u = 太陽天頂角餘弦，v = 高度）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
#include atmo_lut_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / 31.0;
  let muS = uv.x * 2.0 - 1.0;
  let r = RG + 0.01 + uv.y * (RTOP - RG - 0.02);
  let sun = vec3f(sqrt(max(1.0 - muS * muS, 0.0)), muS, 0.0);
  let ro = vec3f(0.0, r, 0.0);
  var L2 = vec3f(0.0);
  var fms = vec3f(0.0);
  let SQ = 8;
  let NS = 20;
  for (var i = 0; i < SQ; i++) {
    for (var j = 0; j < SQ; j++) {
      let th = TAU * (f32(i) + 0.5) / f32(SQ);
      let cph = 1.0 - 2.0 * (f32(j) + 0.5) / f32(SQ);
      let sph = sqrt(max(1.0 - cph * cph, 0.0));
      let rd = vec3f(sph * cos(th), cph, sph * sin(th));
      let tg = raySphere(ro, rd, RG);
      var tMax = raySphere(ro, rd, RTOP).y;
      let hit = tg.x > 0.0;
      if (hit) { tMax = tg.x; }
      var T = vec3f(1.0);
      var Li = vec3f(0.0);
      var Lf = vec3f(0.0);
      let dt = tMax / f32(NS);
      for (var s = 0; s < NS; s++) {
        let p = ro + rd * ((f32(s) + 0.3) * dt);
        let rr = length(p);
        let m = medium(max(rr - RG, 0.0));
        let sT = exp(-m.ext * dt);
        let scat = m.scatR + vec3f(m.scatM);
        let Ts = transToSun(rr, dot(p / rr, sun));
        let S = Ts * scat * (1.0 / (4.0 * PI));
        Li += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
        Lf += T * (scat - scat * sT) / max(m.ext, vec3f(1e-7));
        T *= sT;
      }
      if (hit) {   // 地面反射的一次散射
        let pg = ro + rd * tMax;
        let n = normalize(pg);
        let nl = saturate(dot(n, sun));
        Li += T * transToSun(RG + 0.001, dot(n, sun)) * nl * A.misc.x / PI;
      }
      L2 += Li;
      fms += Lf;
    }
  }
  let inv = 1.0 / f32(SQ * SQ);
  L2 *= inv;
  fms *= inv;
  return vec4f(L2 / (vec3f(1.0) - fms), 1.0);
}
</script>

<script type="text/wgsl" id="sky_lut_map">
// ── sky_lut_map：sky-view LUT 的方向 ↔ uv（緯度在地平線附近加密；方位相對太陽、左右對稱）──
const SKY_W: f32 = 192.0;
const SKY_H: f32 = 108.0;
fn skyHorizon() -> vec2f {   // (zenith 到地平線的角度, beta)
  let r = RG + A.misc.y;
  let beta = acos(clamp(sqrt(max(r * r - RG * RG, 0.0)) / r, 0.0, 1.0));
  return vec2f(PI - beta, beta);
}
fn skyUv(dir: vec3f) -> vec2f {
  let hz = skyHorizon();
  let ang = acos(clamp(dir.y, -1.0, 1.0));
  var v: f32;
  if (ang < hz.x) { v = (1.0 - sqrt(max(1.0 - ang / hz.x, 0.0))) * 0.5; }
  else { v = sqrt(saturate((ang - hz.x) / hz.y)) * 0.5 + 0.5; }
  let dh = dir.xz / max(length(dir.xz), 1e-5);
  let sh = F.sunDir.xz / max(length(F.sunDir.xz), 1e-5);
  let u = acos(clamp(dot(dh, sh), -1.0, 1.0)) / PI;
  return vec2f((u * (SKY_W - 1.0) + 0.5) / SKY_W, (v * (SKY_H - 1.0) + 0.5) / SKY_H);
}
</script>

<script type="text/wgsl" id="lut_sky">
// ── lut_sky：sky-view LUT（192×108，每幀更新）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var msLUT: texture_2d<f32>;
#include atmo_lut_fn
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(SKY_W - 1.0, SKY_H - 1.0);
  let hz = skyHorizon();
  var ang: f32;
  if (uv.y < 0.5) { var c = 1.0 - 2.0 * uv.y; c = 1.0 - c * c; ang = hz.x * c; }
  else { var c = uv.y * 2.0 - 1.0; c = c * c; ang = hz.x + hz.y * c; }
  let phi = uv.x * PI;
  let rd = vec3f(sin(ang) * cos(phi), cos(ang), sin(ang) * sin(phi));
  let el = F.sunDir.w;
  let sun = vec3f(cos(el), sin(el), 0.0);
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let tg = raySphere(ro, rd, RG);
  var tMax = raySphere(ro, rd, RTOP).y;
  if (tg.x > 0.0) { tMax = tg.x; }
  let cosT = dot(rd, sun);
  let pR = phaseR(cosT);
  let pM = phaseM(cosT, A.mie.w);
  var T = vec3f(1.0);
  var L = vec3f(0.0);
  let N = 32;
  for (var i = 0; i < N; i++) {
    var t0 = f32(i) / f32(N);
    var t1 = f32(i + 1) / f32(N);
    t0 = t0 * t0; t1 = t1 * t1;
    let t = tMax * (t0 + (t1 - t0) * 0.3);
    let dt = tMax * (t1 - t0);
    let p = ro + rd * t;
    let rr = length(p);
    let m = medium(max(rr - RG, 0.0));
    let sT = exp(-m.ext * dt);
    let muS = dot(p / rr, sun);
    let Ts = transToSun(rr, muS);
    let ms = textureSampleLevel(msLUT, sLin, vec2f(muS * 0.5 + 0.5, saturate((rr - RG) / (RTOP - RG))), 0.0).rgb;
    let S = A.sunE.rgb * (Ts * (m.scatR * pR + vec3f(m.scatM * pM)) + ms * (m.scatR + vec3f(m.scatM)));
    L += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
    T *= sT;
  }
  return vec4f(L, 1.0);
}
</script>

<script type="text/wgsl" id="amb_cube">
// ── amb_cube：天空環境光（6 個軸向的餘弦加權平均輝度，6×1）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var skyLUT: texture_2d<f32>;
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let k = i32(in.pos.x);
  var n = vec3f(1.0, 0.0, 0.0);
  if (k == 1) { n = vec3f(-1.0, 0.0, 0.0); }
  if (k == 2) { n = vec3f(0.0, 1.0, 0.0); }
  if (k == 3) { n = vec3f(0.0, -1.0, 0.0); }
  if (k == 4) { n = vec3f(0.0, 0.0, 1.0); }
  if (k == 5) { n = vec3f(0.0, 0.0, -1.0); }
  let t = normalize(cross(n, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(n.y) > 0.5)));
  let b = cross(n, t);
  var acc = vec3f(0.0);
  let N = 64;
  for (var i = 0; i < N; i++) {
    let u = (f32(i) + 0.5) / f32(N);
    let ph = TAU * fract(f32(i) * 0.61803399);
    let ct = sqrt(1.0 - u);
    let st = sqrt(u);
    var d = t * (st * cos(ph)) + b * (st * sin(ph)) + n * ct;
    var w = 1.0;
    if (d.y < 0.0) { d.y = 0.02; d = normalize(d); w = 0.3; }   // 地平線以下：用地平線天色的 0.3 倍近似地面反光
    acc += textureSampleLevel(skyLUT, sLin, skyUv(d), 0.0).rgb * w;
  }
  return vec4f(acc / f32(N), 1.0);
}
</script>

<script type="text/wgsl" id="scene_tex">
// ── scene_tex：場景共用貼圖（group 1）。產生這些貼圖的 pass 不能 include 這個模組 ──
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var lightVol: texture_3d<f32>;
@group(1) @binding(2) var skyLUT: texture_2d<f32>;
@group(1) @binding(3) var ambCube: texture_2d<f32>;
@group(1) @binding(4) var noise2D: texture_2d<f32>;
@group(1) @binding(5) var heightTex: texture_2d<f32>; // @unfilterable
@group(1) @binding(6) var normalTex: texture_2d<f32>;
@group(1) @binding(7) var macroTex: texture_2d<f32>;

<script type="text/wgsl" id="phys_fn">
// ── phys_fn：高斯煙流（f32）。和 JS 的 PHYS.concSrc 是同一套式子：
//    Briggs σy、σz＋浮升引起的擴散（BID）＋過渡段浮升＋地面反射；有逆溫層時加 ±4 階反射 ──
fn concSrc(i: i32, x: f32, y: f32, z: f32) -> f32 {
  if (x <= 1e-3) { return 0.0; }
  let s = HU.src[i];
  let r = HU.rise[i];
  let sy0 = HU.sig.x * x / sqrt(1.0 + HU.sig.y * x);
  let sz0 = HU.sig.z * x * pow(1.0 + HU.sig.w * x, HU.prm.x);
  let dh = min(r.x * pow(x, r.y), r.z);
  let bid = dh / 3.5;
  let sy = sqrt(sy0 * sy0 + bid * bid);
  let sz = sqrt(sz0 * sz0 + bid * bid);
  let Hh = s.z + dh;
  let ey = exp(-y * y / (2.0 * sy * sy));
  let zi = HU.prm.y;
  if (zi > 0.0) {
    if (sz >= 1.6 * zi) { return r.w / (sqrt(TAU) * sy * s.w * zi) * ey; }      // 垂直方向已混合均勻
    var V = 0.0;
    for (var n = -4; n <= 4; n++) {
      let a = z - Hh + 2.0 * f32(n) * zi;
      let b = z + Hh + 2.0 * f32(n) * zi;
      V += exp(-a * a / (2.0 * sz * sz)) + exp(-b * b / (2.0 * sz * sz));
    }
    return r.w / (TAU * s.w * sy * sz) * ey * V;
  }
  return r.w / (TAU * s.w * sy * sz) * ey * (exp(-(z - Hh) * (z - Hh) / (2.0 * sz * sz)) + exp(-(z + Hh) * (z + Hh) / (2.0 * sz * sz)));
}
// 世界座標 (x,z)、離地高度 h 的總濃度 [μg/m³]（三支煙囪疊加）
fn concAt(wxz: vec2f, h: f32) -> f32 {
  let wd = HU.prm.zw;
  var c = 0.0;
  for (var i = 0; i < 3; i++) {
    let rel = wxz - HU.src[i].xy;
    c += concSrc(i, dot(rel, wd), rel.y * wd.x - rel.x * wd.y, h);
  }
  return c;
}
</script>

<script type="text/wgsl" id="heat_compute">
// ── heat_compute：地面濃度熱圖（compute，r32float，單位 μg/m³）──
#include common
#include phys_fn
@group(1) @binding(0) var heatOut: texture_storage_2d<r32float, write>;
@compute @workgroup_size(8, 8) fn main(@builtin(global_invocation_id) id: vec3u) {
  let dim = textureDimensions(heatOut);
  if (id.x >= dim.x || id.y >= dim.y) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(dim);
  let wxz = HU.grid.yz + (uv - 0.5) * (2.0 * HU.grid.x);
  textureStore(heatOut, vec2i(id.xy), vec4f(concAt(wxz, 0.0), 0.0, 0.0, 1.0));
}
</script>

<script type="text/wgsl" id="heat_fn">
// ── heat_fn：把濃度畫成熱圖（viridis 色階、1-2-5 等值線、門檻線、測站與 Cmax 標記）。需要 scene_tex ──
fn viridis(t: f32) -> vec3f {   // 感知均勻色階（多項式近似）
  let c0 = vec3f(0.2777273272234177, 0.005407344544966578, 0.3340998053353061);
  let c1 = vec3f(0.1050930431085774, 1.404613529898575, 1.384590162594685);
  let c2 = vec3f(-0.3308618287255563, 0.214847559468213, 0.09509516302823659);
  let c3 = vec3f(-4.634230498983486, -5.799100973351585, -19.33244095627987);
  let c4 = vec3f(6.228269936347081, 14.17993336680509, 56.69055260068105);
  let c5 = vec3f(4.776384997670288, -13.74514537774601, -65.35303263337234);
  let c6 = vec3f(-5.435455855934631, 4.645852612178535, 26.3124352495832);
  return c0 + t * (c1 + t * (c2 + t * (c3 + t * (c4 + t * (c5 + t * c6)))));
}
fn heatLoad(wxz: vec2f) -> f32 {   // 熱圖的雙線性取樣（r32float 要手動內插）；範圍外回傳 -1
  let uv = (wxz - HU.grid.yz) / (2.0 * HU.grid.x) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return -1.0; }
  let dim = vec2i(textureDimensions(heatTex));
  let t = uv * vec2f(dim) - 0.5;
  let fl = floor(t);
  let i = vec2i(fl);
  let f = t - fl;
  let mx = dim - vec2i(1);
  let a = textureLoad(heatTex, clamp(i, vec2i(0), mx), 0).r;
  let b = textureLoad(heatTex, clamp(i + vec2i(1, 0), vec2i(0), mx), 0).r;
  let c = textureLoad(heatTex, clamp(i + vec2i(0, 1), vec2i(0), mx), 0).r;
  let d = textureLoad(heatTex, clamp(i + vec2i(1, 1), vec2i(0), mx), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
// 濃度 → (顏色, 不透明度)。lc＝log10(濃度)，fw＝lc 在螢幕上一個像素的變化量（畫等值線用）
fn heatColor(c: f32, lc: f32, fw: f32) -> vec4f {
  let t = saturate((lc - HU.scale.x) / (HU.scale.y - HU.scale.x));
  var col = viridis(t);
  var a = smoothstep(0.0, 0.12, t) * 0.80;
  // 等值線：每十倍分成 1、2、5 三條
  let fr = lc - floor(lc);
  let dl = min(min(abs(fr), abs(fr - 0.30103)), min(abs(fr - 0.69897), abs(fr - 1.0))) / max(fw, 1e-6);
  let line = (1.0 - smoothstep(0.7, 1.6, dl)) * step(HU.scale.x, lc);
  col = mix(col, vec3f(0.96), line * 0.55);
  a = max(a, line * 0.5);
  // 門檻線（示意值）：較粗的白線
  let dt = abs(lc - log(HU.grid.w) / 2.302585) / max(fw, 1e-6);
  let tl = 1.0 - smoothstep(1.6, 3.0, dt);
  col = mix(col, vec3f(1.0, 0.36, 0.22), tl);
  a = max(a, tl * 0.95);
  return vec4f(col, a * step(0.0, c));
}
// 貼在地面／水面上的熱圖。base＝原本的顏色；回傳疊上熱圖後的顏色
fn heatGround(base: vec3f, wxz: vec2f, c: f32, lc: f32, fw: f32, pixM: f32) -> vec3f {
  var k = F.time.z;
  if (k < 0.004) { return base; }
  // 熱圖邊界淡出（避免範圍邊緣出現一刀切的直線）
  let guv = (wxz - HU.grid.yz) / (2.0 * HU.grid.x) + 0.5;
  let ge = min(min(guv.x, 1.0 - guv.x), min(guv.y, 1.0 - guv.y));
  let hc = heatColor(c, lc, fw) * vec4f(1.0, 1.0, 1.0, smoothstep(0.0, 0.05, ge));
  // 發光量依場景亮度調整（曝光會隨時間改變）
  let lum = 0.55 / max(F.camFwd.w, 1e-3);
  var col = mix(base, hc.rgb * lum, hc.a * k);
  // 下風軸線：每 1 km 一個刻度
  let rel = wxz - HU.src[1].xy;
  let wd = HU.prm.zw;
  let ax = dot(rel, wd);
  let ay = abs(rel.y * wd.x - rel.x * wd.y);
  let w = max(pixM * 1.2, 3.0);
  var m = (1.0 - smoothstep(w, w * 2.0, ay)) * step(0.0, ax) * step(fract(ax / 200.0), 0.6) * 0.7;
  let tick = abs(fract(ax / 1000.0 + 0.5) - 0.5) * 1000.0;
  m = max(m, (1.0 - smoothstep(w, w * 2.0, tick)) * step(ay, 90.0) * step(500.0, ax));
  // Cmax 與測站：圓環
  let dm = length(wxz - HU.mark.xy);
  m = max(m, 1.0 - smoothstep(w, w * 2.0, abs(dm - 110.0)));
  m = max(m, 1.0 - smoothstep(w * 0.5, w * 1.5, abs(dm - 30.0)));
  var st = 0.0;
  for (var i = 0; i < 6; i++) {
    let ds = length(wxz - HU.stn[i].xy);
    st = max(st, 1.0 - smoothstep(w, w * 2.0, abs(ds - 70.0)));
    st = max(st, 1.0 - smoothstep(18.0, 26.0 + w, ds));
  }
  col = mix(col, vec3f(1.0) * lum, m * k);
  col = mix(col, vec3f(0.35, 0.85, 1.0) * lum * 1.2, st * k);
  return col;
}
</script>

<script type="text/wgsl" id="curtain">
// ── curtain：沿下風軸線的垂直剖面（分析模式）。每個像素直接用模型算濃度，
//    看得出煙流怎麼浮升、何時碰到地面；白煙蒸發的位置用虛線標出，之後只剩看不見的污染物 ──
#include common
#include phys_fn
#include atmo_fn
#include scene_tex
#include heat_fn
struct COut { @builtin(position) pos: vec4f, @location(0) xa: f32, @location(1) h: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> COut {
  let c = vec2f(f32(vi & 1u), f32((vi >> 1u) & 1u));
  let L = HU.grid.x * 1.3;
  let xa = c.x * L;
  let h = c.y * HU.scale.w;
  let o = HU.src[1].xy + HU.prm.zw * xa;
  var out: COut;
  out.pos = F.viewProj * vec4f(o.x, h + 3.2, o.y, 1.0);
  out.xa = xa; out.h = h;
  return out;
}
@fragment fn fs(in: COut) -> @location(0) vec4f {
  let k = F.time.z;
  let wxz = HU.src[1].xy + HU.prm.zw * in.xa;
  let c = concAt(wxz, in.h);
  let lc = log(max(c, 1e-9)) / 2.302585;
  let fw = fwidth(lc);
  let hc = heatColor(c, lc, fw);
  let lum = 0.55 / max(F.camFwd.w, 1e-3);
  var col = hc.rgb;
  var a = hc.a * 0.9;
  // 主煙囪的中心線 H(x)
  let r = HU.rise[1];
  let Hc = HU.src[1].z + min(r.x * pow(max(in.xa, 1e-3), r.y), r.z);
  let fh = fwidth(in.h);
  let cl = 1.0 - smoothstep(fh * 1.0, fh * 2.2, abs(in.h - Hc));
  col = mix(col, vec3f(1.0), cl); a = max(a, cl * 0.9);
  // 混合層頂（逆溫層）
  if (HU.prm.y > 0.0) {
    let ll = (1.0 - smoothstep(fh, fh * 2.2, abs(in.h - HU.prm.y))) * step(fract(in.xa / 120.0), 0.5);
    col = mix(col, vec3f(0.5, 0.8, 1.0), ll); a = max(a, ll * 0.9);
  }
  // 白煙蒸發的位置
  let fx = fwidth(in.xa);
  let ev = (1.0 - smoothstep(fx, fx * 2.2, abs(in.xa - HU.scale.z))) * step(fract(in.h / 60.0), 0.5);
  col = mix(col, vec3f(1.0, 0.85, 0.5), ev); a = max(a, ev * 0.95);
  // 外框
  let edge = 1.0 - smoothstep(fh * 1.0, fh * 2.5, min(in.h, HU.scale.w - in.h));
  a = max(a, edge * 0.5); col = mix(col, vec3f(0.8), edge);
  return vec4f(col * lum, a * k);
}
</script>

<script type="text/wgsl" id="lights">
// ── lights：夜間燈光的 sprite（instancing、加色混合）。遠處的燈至少畫 1.6 個像素寬，
//    同時把輝度依面積調低，總光量不變 → 不閃爍、亮度隨距離平方衰減 ──
#include common
struct LIn { @location(0) pos: vec4f, @location(1) col: vec4f };   // pos.w＝光量；col.a＝種類（整數）＋相位（小數）
struct LOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f };
@vertex fn vs(@builtin(vertex_index) vi: u32, l: LIn) -> LOut {
  let c = vec2f(f32(vi & 1u), f32((vi >> 1u) & 1u)) * 2.0 - 1.0;
  let rel = l.pos.xyz - F.camPos.xyz;
  let vd = max(dot(rel, F.camFwd.xyz), 0.1);
  let pix = 2.0 * F.camUp.w * F.viewport.w;
  let s = max(0.45, vd * pix * 1.6);
  let kind = i32(floor(l.col.a));
  let ph = fract(l.col.a);
  let night = F.sunIllum.w;
  var on = smoothstep(ph * 0.55, ph * 0.55 + 0.18, night);        // 每盞燈在不同的天色亮起
  var power = l.pos.w;
  if (kind == 2) {                                                 // 航空障礙燈：全天亮、慢閃；白天模式較亮
    on = 0.25 + 0.75 * smoothstep(0.1, 0.9, sin(F.time.x * 1.9 + ph * 40.0) * 0.5 + 0.5);
    power *= 1.0 + 45.0 * (1.0 - night);
  }
  if (kind == 3 || kind == 4) { on *= step(0.55, fract(F.time.x * 0.25 + ph)); }   // 導航燈：明滅
  var o: LOut;
  let wp = l.pos.xyz + (F.camRight.xyz * c.x + F.camUp.xyz * c.y) * (s * 2.6);
  o.pos = F.viewProj * vec4f(wp, 1.0);
  o.uv = c * 2.6;
  o.col = l.col.rgb * (power * on / (PI * s * s));
  return o;
}
@fragment fn fs(in: LOut) -> @location(0) vec4f {
  return vec4f(in.col * exp(-dot(in.uv, in.uv)), 0.0);
}
</script>

<script type="text/wgsl" id="lightmap_gen">
// ── lightmap_gen：啟動時把每盞燈在地面的光池畫進一張俯視貼圖（±LM_HALF 公尺）──
#include common
struct LIn { @location(0) pos: vec4f, @location(1) col: vec4f };
struct LOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f, @location(2) h: f32 };
@vertex fn vs(@builtin(vertex_index) vi: u32, l: LIn) -> LOut {
  let c = vec2f(f32(vi & 1u), f32((vi >> 1u) & 1u)) * 2.0 - 1.0;
  let kind = i32(floor(l.col.a));
  let h = clamp(l.pos.y - 3.0, 6.0, 60.0);
  let r = h * 5.0;
  var o: LOut;
  let xz = l.pos.xz + c * r;
  o.pos = vec4f(xz.x / LM_HALF, -xz.y / LM_HALF, 0.0, 1.0);
  o.uv = c * 5.0;
  o.h = h;
  o.col = l.col.rgb * l.pos.w * step(f32(kind), 1.5);      // 只有路燈、工作燈（種類 0、1）會照亮地面
  return o;
}
@fragment fn fs(in: LOut) -> @location(0) vec4f {
  // 點光源在地面的照度：∝ h / (h² + r²)^1.5
  let r2 = dot(in.uv, in.uv);
  let e = 1.0 / (in.h * in.h * pow(1.0 + r2, 1.5)) * smoothstep(25.0, 9.0, r2);
  return vec4f(in.col * e, 0.0);
}
</script>

<script type="text/wgsl" id="flame">
// ── flame：火炬塔的火焰（一片面向相機的四邊形，形狀與顏色由雜訊程序生成，會被風吹斜）──
#include common
@group(1) @binding(0) var noise2D: texture_2d<f32>;
struct FOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) vi: u32) -> FOut {
  let c = vec2f(f32(vi & 1u), f32((vi >> 1u) & 1u));
  let base = PL.flare.xyz - vec3f(0.0, 6.0, 0.0);
  let side = normalize(vec3f(F.camRight.x, 0.0, F.camRight.z));
  let lean = vec3f(PL.wind.x, 0.0, PL.wind.y) * (c.y * c.y) * 16.0;       // 火焰往下風倒
  let wp = base + side * ((c.x - 0.5) * 16.0) + vec3f(0.0, c.y * 34.0, 0.0) + lean;
  var o: FOut;
  o.pos = F.viewProj * vec4f(wp, 1.0);
  o.uv = c;
  return o;
}
@fragment fn fs(in: FOut) -> @location(0) vec4f {
  let t = F.time.x;
  let x = in.uv.x * 2.0 - 1.0;
  let y = in.uv.y;
  let n1 = textureSampleLevel(noise2D, sRep, vec2f(x * 0.22 + 0.3, y * 0.35 - t * 0.55), 0.0).r;
  let n2 = textureSampleLevel(noise2D, sRep, vec2f(x * 0.6 + 0.7, y * 0.9 - t * 1.3), 0.0).g;
  let wob = (n1 - 0.5) * 0.9 * y + (n2 - 0.5) * 0.35;
  let w = mix(0.16, 0.50, smoothstep(0.0, 0.25, y)) * (1.0 - smoothstep(0.35, 1.0, y));   // 水滴形的輪廓
  let d = abs(x + wob) / max(w, 1e-3);
  var v = saturate(1.0 - d) * smoothstep(0.0, 0.04, y);
  v *= 0.55 + 0.9 * n2;
  v = saturate(v * 1.6 - y * 0.55);
  // 黑體色階：紅 → 橘 → 黃白
  let col = vec3f(1.0, 0.33, 0.07) * v + vec3f(1.0, 0.75, 0.35) * pow(v, 2.5) * 1.6 + vec3f(0.9, 0.9, 0.8) * pow(v, 6.0) * 2.0;
  return vec4f(col * PL.flare.w * 0.012, 0.0);
}
</script>

<script type="text/wgsl" id="noise3d_gen">
// ── noise3d_gen：啟動時用 compute 產生可平鋪的 3D 雜訊（64³，rgba8）──
//    R＝Perlin-Worley（大團塊）、G＝Worley FBM（中）、B＝Worley FBM（細）、A＝Perlin FBM
@group(0) @binding(0) var outTex: texture_storage_3d<rgba8unorm, write>;
const N3: i32 = 64;
fn h3(p: vec3i) -> vec3f {
  var x = u32(p.x) * 1664525u + 1013904223u;
  x = (x ^ (u32(p.y) * 2246822519u)) * 3266489917u;
  x = (x ^ (u32(p.z) * 668265263u)) * 2654435761u;
  x ^= x >> 15u; x *= 2246822519u; x ^= x >> 13u;
  let a = x; let b = a * 1103515245u + 12345u; let c = b * 1103515245u + 12345u;
  return vec3f(f32(a >> 8u), f32(b >> 8u), f32(c >> 8u)) / 16777216.0;
}
fn wrap(p: vec3i, per: i32) -> vec3i { return ((p % per) + per) % per; }
fn worley(p: vec3f, cells: i32) -> f32 {
  let q = p * f32(cells);
  let ip = vec3i(floor(q));
  var md = 9.0;
  for (var z = -1; z <= 1; z++) { for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let c = ip + vec3i(x, y, z);
    let fp = vec3f(c) + h3(wrap(c, cells) + vec3i(cells * 7));
    md = min(md, distance(q, fp));
  } } }
  return saturate(1.0 - md);
}
fn perlin(p: vec3f, per: i32) -> f32 {
  let q = p * f32(per);
  let ip = vec3i(floor(q));
  let f = q - floor(q);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  var acc = 0.0;
  for (var k = 0; k < 8; k++) {
    let o = vec3i(k & 1, (k >> 1u) & 1, (k >> 2u) & 1);
    let g = normalize(h3(wrap(ip + o, per) + vec3i(per * 13)) * 2.0 - 1.0);
    let w = mix(1.0 - u.x, u.x, f32(o.x)) * mix(1.0 - u.y, u.y, f32(o.y)) * mix(1.0 - u.z, u.z, f32(o.z));
    acc += w * dot(g, f - vec3f(o));
  }
  return acc;
}
@compute @workgroup_size(4, 4, 4) fn main(@builtin(global_invocation_id) id: vec3u) {
  let p = (vec3f(id) + 0.5) / f32(N3);
  let pf = perlin(p, 4) * 0.55 + perlin(p, 8) * 0.28 + perlin(p, 16) * 0.17;
  let w1 = worley(p, 4) * 0.60 + worley(p, 8) * 0.27 + worley(p, 16) * 0.13;
  let w2 = worley(p, 8) * 0.60 + worley(p, 16) * 0.27 + worley(p, 32) * 0.13;
  let w3 = worley(p, 16) * 0.65 + worley(p, 32) * 0.35;
  let pw = saturate((pf * 1.1 + 0.5) * 0.55 + w1 * 0.75 - 0.18);
  textureStore(outTex, vec3i(id), vec4f(pw, w2, w3, saturate(pf * 1.2 + 0.5)));
}
</script>

<script type="text/wgsl" id="plume_fn">
// ── plume_fn：3D 煙流的密度。需要先宣告 plumeLUT、condLUT、noise3D ──
// 每支煙囪：中心線高度 Δh(x) 與瞬時粗細 σy、σz 查 plumeLUT（和分析模式同一套 Briggs 模型算出）；
// 混合比例 f（煙氣佔的比例）＝ 高斯包絡 × 湍流雜訊；f 查 condLUT 得到凝結水滴的消光係數。
// f 低於臨界值時水滴蒸發（白煙消失），但污染物還在 —— 只剩很淡的氣膠霾。
// 水滴消光、霾消光 [1/m]、到煙流外緣的估計距離、(z−中心)/σz、σz、(y−中心)/σy、建議的 raymarch 步長
// stp＝所在煙流內的基本步長（不在任何一道煙流裡時是很大的數）；lim＝到「還沒進入的煙流」外緣的安全步長
struct PD { ext: f32, haze: f32, sdf: f32, dzn: f32, sz: f32, dyn: f32, stp: f32, ao: f32, lim: f32 };   // ao＝團塊凹處的遮蔽
fn condBeta(f: f32) -> f32 {
  let t = 1.0 + log2(max(f, 1e-6)) / 12.0;
  if (t <= 0.0) { return 0.0; }
  return textureSampleLevel(condLUT, sLin, vec2f(min(t, 1.0) * (255.0 / 256.0) + 0.5 / 256.0, 0.5), 0.0).r;
}
fn plumeEval(p: vec3f, lod: f32) -> PD {
  var o: PD;
  o.ext = 0.0; o.haze = 0.0; o.sdf = 1e5; o.dzn = 0.0; o.sz = 0.0; o.dyn = 0.0; o.ao = 0.0;
  let wd = PL.wind.xy;
  let r0 = PL.prm2.w;
  let ky = TAU / PL.prm.z;
  let kz = TAU / PL.prm2.z;
  var wsum = 0.0;
  var stepIn = 1e5;
  var lim = 1e5;
  for (var i = 0; i < 3; i++) {
    let s = PL.src[i];
    let rel = p - s.xyz;
    let x = dot(rel.xz, wd);
    // 上風側：到煙囪口的距離（不能用到「上風平面」的距離，否則貼著平面走的視線會一直走小步）
    if (x < -3.0 * r0) { let dd = max(length(rel) - 5.0 * r0, 2.0); o.sdf = min(o.sdf, dd); lim = min(lim, dd * 0.6); continue; }
    if (x > PL.wind.w) { let dd = x - PL.wind.w + 2.0; o.sdf = min(o.sdf, dd); lim = min(lim, max(dd * 0.6, 40.0)); continue; }
    let y = rel.z * wd.x - rel.x * wd.y;
    let t = sqrt(max(x, 0.0) / PL.prm.x);
    let lu = t * (511.0 / 512.0) + 0.5 / 512.0;
    let lut = textureSampleLevel(plumeLUT, sLin, vec2f(lu, (f32(i) + 0.5) / 4.0), 0.0);
    let mam = textureSampleLevel(plumeLUT, sLin, vec2f(lu, 3.5 / 4.0), 0.0).rg;   // 蜿蜒振幅 (水平, 垂直)，三支煙囪共用
    // 蜿蜒：隨氣塊平流（ξ = x − u·t），時間平均後會回到高斯包絡。三個分量的係數平方和／2 = 1（單位變異數）；
    // 高頻分量的振幅要小，否則中心線太陡，煙流會被扭成薄片，從側面看是一道道銳利的線
    let xi = x - PL.wind.z * F.time.x + f32(i) * 733.0;
    let my = mam.x * (1.288 * sin(ky * xi) + 0.552 * sin(2.37 * ky * xi + 1.3) + 0.184 * sin(5.3 * ky * xi + 4.1));
    let mz = mam.y * (1.288 * sin(kz * xi + 2.0) + 0.552 * sin(2.11 * kz * xi + 0.4) + 0.184 * sin(4.7 * kz * xi + 5.2));
    let dy = y - my;
    let dz = rel.y - lut.r - mz;
    let smin = min(lut.g, lut.b);
    let d = sqrt(dy * dy / (lut.g * lut.g) + dz * dz / (lut.b * lut.b));
    let sd = (d - 4.2) * smin;
    o.sdf = min(o.sdf, sd);
    // 還沒進入這道煙流：往外緣走 0.6 倍的估計距離（煙流往下風會變粗，不能走滿）；
    // 下限是局部粗細的 1/4（視線擦過外框時估計距離趨近 0，沒有下限會把步數耗盡）
    if (d > 4.2) { lim = min(lim, max(0.6 * sd, 0.25 * smin)); continue; }
    stepIn = min(stepIn, 0.4 * smin);
    // 湍流雜訊附著在氣塊上；團塊大小跟著煙流粗細走（相鄰兩個八度交叉淡化，避免尺度跳變）
    let q = vec3f(xi, dy, dz);
    let lam = clamp(3.2 * smin, 6.0, 3000.0);
    let kf = log2(lam / 6.0);
    let k0 = floor(kf);
    let wk = kf - k0;
    let l0 = 6.0 * exp2(k0);
    let ev = vec3f(0.07, 0.31, 0.19) * (F.time.x * 0.9);
    // 注意：兩層的取樣座標只差一個 2 倍縮放，這樣 kf 跨過整數時（wk 由 1 跳回 0、l0 加倍）雜訊場才完全連續
    let n0 = textureSampleLevel(noise3D, sRep, (q + ev) / (l0 * 4.0), 0.0);
    let n1 = textureSampleLevel(noise3D, sRep, (q + ev) / (l0 * 8.0), 0.0);
    let nn = mix(n0, n1, wk);
    let shape = nn.r;                                    // 大團塊（Perlin-Worley）
    let far = smoothstep(300.0, 1800.0, x);              // 遠處已經混合均勻，團塊感要淡掉
    let pulse = mix(0.70 + 0.60 * nn.a, 1.0, far);       // 粗細沿軸向起伏 → 一團一團的
    var dn = d / pulse + (0.5 - shape) * mix(2.1, 0.2, far) + ((0.5 - nn.g) * 1.1 + (0.5 - nn.b) * 0.7) * lod * (1.0 - far);
    dn = max(dn, d * 0.62);                              // 雜訊最多把邊緣往外推到一定程度，外框（d=4.2）處密度才會趨近 0
    // 外框（d=4.2）處平滑收到 0：高斯尾巴被硬切的話，從切線方向看會在天空畫出細線
    let g = exp(-0.5 * dn * dn) * smoothstep(-3.0 * r0, -0.5 * r0, x) * smoothstep(4.2, 2.8, d);
    let f = min(s.w / (lut.g * lut.b) * g, 1.0);
    let e = condBeta(f);
    // 氣膠霾：稀釋後才看得出來；靠近煙囪處由水滴主導（太濃會把白煙染髒）。
    // 用平滑的飽和曲線，不用 min()：硬截會在煙囪附近形成「均勻的實心管」，從側面看邊緣很銳利。
    // 往下風畫到 PL.wind.w 為止，最後 40% 平滑淡出（硬切也會留下一道邊）
    let hz = PL.prm.w * f / (1.0 + f / 0.006) * smoothstep(PL.wind.w, 0.6 * PL.wind.w, x);
    o.ext += e;
    o.haze += hz;
    let wgt = e + hz + 1e-7;
    o.dzn += wgt * dz / lut.b;
    o.dyn += wgt * dy / lut.g;
    o.sz += wgt * lut.b;
    o.ao += wgt * mix(mix(0.45, 1.0, smoothstep(0.25, 0.70, shape)), 1.0, far);
    wsum += wgt;
  }
  if (wsum > 0.0) { o.dzn /= wsum; o.dyn /= wsum; o.sz /= wsum; o.ao /= wsum; } else { o.sz = 10.0; o.ao = 1.0; }
  o.stp = stepIn;
  o.lim = lim;
  return o;
}
</script>

<script type="text/wgsl" id="plume_tau">
// ── plume_tau：某一點往太陽方向、被煙流擋掉的光學深度（查光空間體積；體積外＝0）。需要 scene_tex ──
fn plumeTau(p: vec3f) -> f32 {
  let uvw = vec3f(dot(PL.lv0.xyz, p) + PL.lv0.w, dot(PL.lv1.xyz, p) + PL.lv1.w, dot(PL.lv2.xyz, p) + PL.lv2.w);
  if (uvw.x < 0.0 || uvw.x > 1.0 || uvw.y < 0.0 || uvw.y > 1.0 || uvw.z < 0.0) { return 0.0; }
  let e = min(min(uvw.x, 1.0 - uvw.x), min(uvw.y, 1.0 - uvw.y));
  return textureSampleLevel(lightVol, sLin, vec3f(uvw.xy, min(uvw.z, 1.0)), 0.0).r * smoothstep(0.0, 0.03, e);
}
// 煙流投下的影子（給地面、建築、霧用）：回傳透光比例。
// 太陽有視直徑，離煙流越遠半影越寬，影子逐漸淡掉（幾百公尺外就看不出細長的影子）
fn plumeShadow(p: vec3f) -> f32 {
  let wz = dot(PL.lv2.xyz, p) + PL.lv2.w;
  if (wz < 0.0) { return 1.0; }
  let beyond = max(wz - 1.0, 0.0) / length(PL.lv2.xyz);
  return mix(exp(-plumeTau(p)), 1.0, 1.0 - exp(-beyond / 260.0));
}
</script>

<script type="text/wgsl" id="lightvol">
// ── lightvol：煙流的光學深度體積（compute）。沿光線方向累積消光，
//    一張體積同時給：煙流自陰影、落在地面與建築的影子、霧裡的光柱 ──
#include common
@group(1) @binding(0) var plumeLUT: texture_2d<f32>;
@group(1) @binding(1) var condLUT: texture_2d<f32>;
@group(1) @binding(2) var noise3D: texture_3d<f32>;
@group(1) @binding(3) var lvOut: texture_storage_3d<rgba16float, write>;
struct LVU { o: vec4f, u: vec4f, v: vec4f, w: vec4f };   // 體積原點與三個軸（世界座標，長度＝整個範圍）
@group(1) @binding(4) var<uniform> LV: LVU;
#include plume_fn
@compute @workgroup_size(8, 8, 1) fn main(@builtin(global_invocation_id) id: vec3u) {
  let dim = textureDimensions(lvOut);
  if (id.x >= dim.x || id.y >= dim.y) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(dim.xy);
  let base = LV.o.xyz + LV.u.xyz * uv.x + LV.v.xyz * uv.y;
  let dw = length(LV.w.xyz) / f32(dim.z);
  var tau = 0.0;
  for (var k = 0u; k < dim.z; k++) {
    let p = base + LV.w.xyz * ((f32(k) + 0.5) / f32(dim.z));
    let pd = plumeEval(p, 0.5);
    let e = (pd.ext + pd.haze) * dw;
    textureStore(lvOut, vec3i(vec2i(id.xy), i32(k)), vec4f(tau + 0.5 * e, 0.0, 0.0, 1.0));
    tau += e;
  }
}
</script>

<script type="text/wgsl" id="sky_fn">
// ── sky_fn：天空顏色（LUT＋雲＋日面＋星）與環境光。需要 scene_tex、atmo_fn、atmo_lut_fn、sky_lut_map ──
fn skyLutSample(dir: vec3f) -> vec3f {
  return textureSampleLevel(skyLUT, sLin, skyUv(dir), 0.0).rgb;
}
// 天空環境光：依法線在 6 個軸向之間內插（ambient cube）
fn ambient(n: vec3f) -> vec3f {
  let n2 = n * n;
  let ix = select(1, 0, n.x >= 0.0);
  let iy = select(3, 2, n.y >= 0.0);
  let iz = select(5, 4, n.z >= 0.0);
  return n2.x * textureLoad(ambCube, vec2i(ix, 0), 0).rgb + n2.y * textureLoad(ambCube, vec2i(iy, 0), 0).rgb
       + n2.z * textureLoad(ambCube, vec2i(iz, 0), 0).rgb;
}
// 一層薄雲。回傳 (rgb 顏色, a 遮蔽量)
fn cloudLayer(dir: vec3f, altKm: f32, scale: vec2f, drift: vec2f, cover: f32, soft: f32) -> vec4f {
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let t = raySphere(ro, dir, RG + altKm).y;
  if (dir.y <= 0.002 || t <= 0.0) { return vec4f(0.0); }
  let w = F.camPos.xz * 0.001 + dir.xz * t;
  let uv = w * scale + drift * (F.time.x * 0.0004);
  let n1 = textureSampleLevel(noise2D, sRep, uv, 0.0);
  let n2 = textureSampleLevel(noise2D, sRep, uv * 3.3 + n1.gr * 0.12, 0.0);
  let n3 = textureSampleLevel(noise2D, sRep, uv * 11.0 + n2.rg * 0.05, 0.0);
  var d = n1.r * 0.62 + n2.g * 0.28 + n3.r * 0.10;
  d = smoothstep(1.0 - cover, 1.0 - cover + soft, d);
  if (d <= 0.0) { return vec4f(0.0); }
  // 雲的位置看太陽：越晚越紅，被地球擋住就暗掉
  let pc = ro + dir * t;
  let rc = length(pc);
  let sunL = normalize(vec3f(F.sunDir.x, F.sunDir.y, F.sunDir.z));
  let muS = dot(pc / rc, sunL);
  let sunC = A.sunE.rgb * transToSun(rc, muS);
  let cosS = dot(dir, sunL);
  let fwd = hg(cosS, 0.72) * 3.0 + hg(cosS, 0.25) * 2.0 + 0.10;
  let thin = 1.0 - 0.75 * d;                     // 厚的地方自己遮光
  let amb = skyLutSample(vec3f(0.0, 1.0, 0.0)) * 1.6 + skyLutSample(normalize(vec3f(dir.x, 0.25, dir.z))) * 0.5;
  let col = sunC * fwd * thin * 0.55 + amb * (0.35 + 0.4 * d);
  // 相機到雲之間的透射率：T(相機, 方向) / T(雲, 方向)
  let Tv = transmittance(r, dir.y) / max(transmittance(rc, dot(pc / rc, dir)), vec3f(1e-4));
  let fade = saturate(luma(Tv) * 1.15) * smoothstep(0.002, 0.05, dir.y);
  return vec4f(col, d * fade);
}
fn stars(dir: vec3f) -> f32 {
  let p = dir * 220.0;
  let id = floor(p);
  let h = hash31(id + 500.0);
  if (h < 0.992) { return 0.0; }
  let c = id + 0.5 + (vec3f(hash31(id + 11.0), hash31(id + 23.0), hash31(id + 37.0)) - 0.5) * 0.6;
  let d = length(p - c);
  return smoothstep(0.42, 0.0, d) * (0.3 + 3.0 * pow(hash31(id + 71.0), 6.0));
}
fn skyColor(dir: vec3f, withSun: f32) -> vec3f {
  var L = skyLutSample(dir);
  let night = F.sunIllum.w;
  // 夜空底色（大氣輝光＋月光散射的近似）與地平線的城市光害
  let hor = 1.0 - saturate(dir.y);
  L += vec3f(0.010, 0.016, 0.034) * night * (0.35 + 0.65 * hor * hor) * 0.012;
  L += vec3f(1.0, 0.62, 0.30) * night * pow(hor, 10.0) * 0.00045;
  if (dir.y > -0.02) {
    L += vec3f(0.9, 0.95, 1.0) * stars(dir) * night * 0.0035 * smoothstep(0.0, 0.25, dir.y);
    let cov = A.misc.z;
    // 高層卷雲（拉長）與中層碎雲
    let c1 = cloudLayer(dir, 9.5, vec2f(0.012, 0.034), vec2f(0.6, 0.2), cov * 0.62, 0.42);
    L = mix(L, c1.rgb, c1.a * 0.85);
    let c2 = cloudLayer(dir, 4.2, vec2f(0.045, 0.060), vec2f(1.0, -0.4), cov * 0.50, 0.22);
    L = mix(L, c2.rgb, c2.a * 0.92);
  }
  // 日面（含周邊減光）；輝度有上限，避免 bloom 失控
  let sunL = F.sunDir.xyz;
  let ang = length(cross(dir, sunL));
  let rad = A.sunE.w;
  if (withSun > 0.0 && dot(dir, sunL) > 0.0 && ang < rad * 1.6) {
    let r = RG + A.misc.y;
    let x = saturate(ang / rad);
    let limb = 1.0 - 0.55 * (1.0 - sqrt(max(1.0 - x * x, 0.0)));
    let disc = smoothstep(rad * 1.04, rad * 0.94, ang);
    let Ls = A.sunE.rgb * transToSun(r, dir.y) / (PI * rad * rad);
    L += min(Ls * limb, vec3f(A.misc.w)) * disc * withSun;
  }
  return L;
}
</script>

<script type="text/wgsl" id="sky">
// ── sky：主場景裡的天空（畫在最遠處）──
#include common

#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {

<script type="text/wgsl" id="terrain_gen">
// ── terrain_gen：啟動時產生一次高度圖（r32float）。macroTex 由 JS 依場景配置畫出：
//    R＝基準高度（m，水域為負）、G＝丘陵量、B＝鋪面、A＝市鎮 ──
#include common
#include fullscreen
@group(1) @binding(0) var macroTex: texture_2d<f32>;
fn grad2(p: vec2f) -> vec2f {
  let a = hash21(p + 4096.0) * TAU;
  return vec2f(cos(a), sin(a));
}
fn gnoise(p: vec2f) -> f32 {   // 梯度雜訊，約 −1..1
  let i = floor(p);
  let f = p - i;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(grad2(i), f);
  let b = dot(grad2(i + vec2f(1.0, 0.0)), f - vec2f(1.0, 0.0));
  let c = dot(grad2(i + vec2f(0.0, 1.0)), f - vec2f(0.0, 1.0));
  let d = dot(grad2(i + vec2f(1.0, 1.0)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 1.4;
}
fn fbm(p0: vec2f, oct: i32) -> f32 {
  var p = p0;
  var s = 0.0;
  var a = 0.5;
  for (var i = 0; i < oct; i++) {
    s += a * gnoise(p);
    p = mat2x2f(1.6, 1.2, -1.2, 1.6) * p;
    a *= 0.5;
  }
  return s;
}
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let p = (in.uv - 0.5) * (2.0 * MAP_HALF);
  let m = textureSampleLevel(macroTex, sLin, in.uv, 0.0);
  var h = m.r;
  // 丘陵：domain-warped FBM＋脊狀起伏
  let q = p / 2100.0 + vec2f(37.0, 91.0);
  let w = vec2f(fbm(q + vec2f(1.7, 9.2), 4), fbm(q + vec2f(8.3, 2.8), 4));
  let n = fbm(q + 0.8 * w, 8);
  let rdg = 1.0 - abs(fbm(q * 1.9 + w * 0.6 + vec2f(5.0, 3.0), 6));
  let e = saturate(0.5 + 0.9 * n);
  h += m.g * (20.0 + 230.0 * pow(e, 1.5) + 50.0 * rdg * rdg * e);
  // 自然地表的小起伏（鋪面區保持平整）
  let land = smoothstep(0.5, 3.0, m.r);
  h += land * (1.0 - m.b) * (1.0 - m.g) * (1.5 + 2.5 * fbm(p / 160.0, 4));
  h += (1.0 - land) * 0.8 * fbm(p / 90.0, 3);
  return vec4f(h, 0.0, 0.0, 1.0);
}
</script>

<script type="text/wgsl" id="terrain_fn">
// ── terrain_fn：查高度圖（r32float 不能用線性取樣器，手動雙線性）。需要 scene_tex ──
fn mapUv(xz: vec2f) -> vec2f { return xz / (2.0 * MAP_HALF) + 0.5; }
fn terrainH(xz: vec2f, mip: i32) -> f32 {
  let dim = vec2i(textureDimensions(heightTex, mip));
  let t = mapUv(xz) * vec2f(dim) - 0.5;
  let fl = floor(t);
  let i = vec2i(fl);
  let f = t - fl;
  let mx = dim - vec2i(1);
  let a = textureLoad(heightTex, clamp(i, vec2i(0), mx), mip).r;
  let b = textureLoad(heightTex, clamp(i + vec2i(1, 0), vec2i(0), mx), mip).r;
  let c = textureLoad(heightTex, clamp(i + vec2i(0, 1), vec2i(0), mx), mip).r;
  let d = textureLoad(heightTex, clamp(i + vec2i(1, 1), vec2i(0), mx), mip).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
</script>

<script type="text/wgsl" id="lighting">
// ── lighting：不透明表面的光照（太陽＋天空環境光）。需要 sky_fn ──
struct Surf { pos: vec3f, n: vec3f, albedo: vec3f, rough: f32, metal: f32, ao: f32, emis: vec3f };
#include plume_tau
// 給霧用的單點陰影查詢（不做濾波）
fn csm1(pos: vec3f) -> f32 {
  let nc = i32(F.shadowPrm.x);
  let vd = dot(pos - F.camPos.xyz, F.camFwd.xyz);
  var ci = nc;
  for (var i = nc - 1; i >= 0; i--) { if (vd < F.shadowSplit[i]) { ci = i; } }
  if (ci >= nc) { return 1.0; }
  let sp = F.shadowVP[ci] * vec4f(pos, 1.0);
  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  return textureSampleCompareLevel(shadowMap, sShadow, uv, ci, sp.z);
}
// 太陽陰影＝cascaded shadow maps × 煙流的遮蔽
fn sunShadow(pos: vec3f, n: vec3f) -> f32 { return csmShadow(pos, n) * plumeShadow(pos); }
// cascaded shadow maps＋旋轉 Poisson 取樣的 PCF（SHADOW_TAPS 由畫質等級決定）
fn csmShadow(pos: vec3f, n: vec3f) -> f32 {
  let nc = i32(F.shadowPrm.x);
  let vd = dot(pos - F.camPos.xyz, F.camFwd.xyz);
  var ci = nc;
  for (var i = nc - 1; i >= 0; i--) { if (vd < F.shadowSplit[i]) { ci = i; } }
  if (ci >= nc) { return 1.0; }
  let tex = F.shadowTexel[ci];
  let p = pos + n * (tex * 1.8) + F.shadowDir.xyz * (tex * 1.2);
  let sp = F.shadowVP[ci] * vec4f(p, 1.0);
  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  var pd = array<vec2f, 16>(
    vec2f(-0.94, -0.40), vec2f(0.95, -0.77), vec2f(-0.09, -0.93), vec2f(0.34, 0.29), vec2f(-0.92, 0.46), vec2f(-0.82, -0.88), vec2f(-0.38, 0.28), vec2f(0.97, 0.76),
    vec2f(0.44, -0.98), vec2f(0.54, 0.99), vec2f(-0.26, -0.42), vec2f(0.79, 0.19), vec2f(-0.24, 1.00), vec2f(-0.81, 0.91), vec2f(0.02, -0.51), vec2f(0.14, -0.14));
  let a = hash21(floor(pos.xz * 3.0) + floor(pos.y * 3.0) * 17.0) * TAU;
  let cs = cos(a); let sn = sin(a);
  let rad = F.shadowPrm.z / F.shadowPrm.y;
  var s = 0.0;
  for (var i = 0; i < SHADOW_TAPS; i++) {
    let o = vec2f(pd[i].x * cs - pd[i].y * sn, pd[i].x * sn + pd[i].y * cs) * rad;
    s += textureSampleCompareLevel(shadowMap, sShadow, uv + o, ci, sp.z);
  }
  s /= f32(SHADOW_TAPS);
  // 最後一層的遠端淡出
  if (ci == nc - 1) { s = mix(s, 1.0, smoothstep(0.85, 1.0, vd / F.shadowSplit[ci])); }
  return s;
}
fn shade(s: Surf, V: vec3f) -> vec3f {
  let L = F.sunDir.xyz;
  let nl = saturate(dot(s.n, L));
  let H = normalize(L + V);
  let nh = saturate(dot(s.n, H));
  let nv = max(dot(s.n, V), 1e-3);
  let vh = saturate(dot(V, H));
  let a = max(s.rough * s.rough, 0.02);
  let a2 = a * a;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let k = a * 0.5;
  let Vis = 0.25 / ((nl * (1.0 - k) + k) * (nv * (1.0 - k) + k));
  let F0 = mix(vec3f(0.04), s.albedo, s.metal);
  let Fr = F0 + (vec3f(1.0) - F0) * pow(1.0 - vh, 5.0);
  let diff = s.albedo * (1.0 - s.metal) / PI;
  var col = vec3f(0.0);
  if (nl > 0.0) { col = (diff + D * Vis * Fr) * F.sunIllum.rgb * nl * sunShadow(s.pos, s.n); }
  col += s.albedo * (1.0 - s.metal) * ambient(s.n) * s.ao;
  col += F0 * ambient(reflect(-V, s.n)) * s.metal * s.ao * (1.0 - 0.5 * s.rough);
  // 夜間：燈光在地面的光池（俯視貼圖）＋火炬的點光源
  let night = F.sunIllum.w;
  if (night > 0.01) {
    let lm = textureSampleLevel(lightMap, sLin, s.pos.xz / (2.0 * LM_HALF) + 0.5, 0.0).rgb;
    let hAbove = max(s.pos.y - 3.2, 0.0);
    col += s.albedo * lm * smoothstep(0.05, 0.6, night) * (0.35 + 0.65 * saturate(s.n.y)) / (1.0 + hAbove * hAbove / 500.0);
  }
  let fv = PL.flare.xyz - s.pos;
  let fd2 = dot(fv, fv);
  col += s.albedo * vec3f(1.0, 0.52, 0.20) * (PL.flare.w / (fd2 + 100.0)) * saturate(dot(s.n, fv) / sqrt(fd2) * 0.7 + 0.3) / PI;
  return col + s.emis;
}
</script>

<script type="text/wgsl" id="terrain">
// ── terrain：以相機為中心的 clipmap 環；外緣用 CDLOD 式 morph 接到粗一層，沒有裂縫 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
#include heat_fn
struct TerrainU {
  levels: array<vec4f, 10>,   // xy＝中心 xz（已對齊格點），z＝格距（m），w＝高度圖 mip
  inner: array<vec4f, 10>,    // 細一層涵蓋的範圍 xmin, zmin, xmax, zmax（這個範圍內不畫）
  prm: vec4f,                 // x＝每邊格數 N，y＝層數
};
@group(2) @binding(0) var<uniform> T: TerrainU;
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) @interpolate(flat) lvl: u32 };
@vertex fn vs(@location(0) g: vec2f, @builtin(instance_index) inst: u32) -> VOut {
  let L = T.levels[inst];
  let Lc = T.levels[min(inst + 1u, u32(T.prm.y) - 1u)];
  let N = T.prm.x;
  let rel = g - N * 0.5;
  let d = max(abs(rel.x), abs(rel.y)) / (N * 0.5);
  let k = smoothstep(0.70, 0.90, d);
  let odd = fract(g * 0.5) * 2.0;          // 奇數格點在外緣併到相鄰的偶數格點（＝粗一層的格點）
  let xz = L.xy + (rel - odd * k) * L.z;
  let h = mix(terrainH(xz, i32(L.w)), terrainH(xz, i32(Lc.w)), k);
  var o: VOut;
  o.wp = vec3f(xz.x, h, xz.y);
  o.pos = F.viewProj * vec4f(o.wp, 1.0);
  o.lvl = inst;
  return o;
}
@fragment fn fs(in: VOut) -> @location(0) vec4f {
  let uv = mapUv(in.wp.xz);
  let nt = textureSample(normalTex, sLin, uv);
  let nz = textureSample(noise2D, sRep, in.wp.xz / 420.0);
  let nz2 = textureSample(noise2D, sRep, in.wp.xz / 61.0);
  let dn1 = textureSample(noise2D, sRep, in.wp.xz / 128.0).rg - 0.5;
  let dn2 = textureSample(noise2D, sRep, in.wp.xz / 13.0).gr - 0.5;
  let rp = vec2f(0.8 * in.wp.x - 0.6 * in.wp.z, 0.6 * in.wp.x + 0.8 * in.wp.z);   // 轉個角度再取樣，打散重複感
  let nr1 = textureSample(noise2D, sRep, rp / 173.0);
  let nr2 = textureSample(noise2D, sRep, rp.yx / 29.0);
  // 分析模式的熱圖：濃度與它在螢幕上的變化率要在任何分支之前算好
  let hcv = heatLoad(in.wp.xz);
  let hlc = log(max(hcv, 1e-9)) / 2.302585;
  let hfw = fwidth(hlc);
  if (in.lvl > 0u) {
    let r = T.inner[in.lvl];
    if (in.wp.x > r.x && in.wp.z > r.y && in.wp.x < r.z && in.wp.z < r.w) { discard; }
  }
#if REFL
  if (in.wp.y < 0.0) { discard; }   // 倒影 pass：水面以下不畫
#endif
  let mac = textureSampleLevel(macroTex, sLin, uv, 0.0);
  var n = normalize(nt.xyz * 2.0 - 1.0);
  let slope = 1.0 - n.y;
  let paved = smoothstep(0.35, 0.65, mac.b);
  let city = smoothstep(0.4, 0.7, mac.a) * (1.0 - paved);
  let h = in.wp.y;
  // 自然地表：草地 → 樹林（丘陵）→ 陡坡露岩 → 岸邊沙地。
  // 雜訊用兩組不同尺度、不同旋轉角的取樣相乘混合，避免看得出貼圖重複
  let mixA = nz.r * 0.55 + nr1.g * 0.45;
  let mixB = nz2.g * 0.5 + nr2.r * 0.5;
  let grass = mix(vec3f(0.085, 0.100, 0.045), vec3f(0.155, 0.150, 0.070), mixA);
  let forest = mix(vec3f(0.032, 0.054, 0.024), vec3f(0.058, 0.082, 0.034), mixB);
  let rock = mix(vec3f(0.20, 0.175, 0.15), vec3f(0.31, 0.28, 0.245), nz2.r);
  var alb = mix(grass, forest, smoothstep(0.12, 0.55, mac.g + (mixA - 0.5) * 0.6));
  alb = mix(alb, rock, smoothstep(0.30, 0.55, slope + (nz2.r - 0.5) * 0.2));
  alb = mix(alb, vec3f(0.40, 0.35, 0.27), smoothstep(2.4, 0.7, h) * (1.0 - paved));
  // 鋪面：混凝土地坪（每 8 m 一道伸縮縫、深淺不一的補丁與油漬）＋每 140 m 一條的廠區道路（柏油、標線）
  let pixG = length(F.camPos.xyz - in.wp) * 2.0 * F.camUp.w * F.viewport.w;       // 一個像素在地面上大約多寬
  var conc = mix(vec3f(0.155, 0.155, 0.150), vec3f(0.265, 0.260, 0.245), nz2.r * 0.45 + nz.g * 0.25 + nr1.r * 0.30);
  conc *= mix(1.0, 0.72, smoothstep(0.58, 0.80, nr2.g * 0.6 + nz2.b * 0.4));    // 油漬、積水痕
  let slab = abs(fract(in.wp.xz / 8.0) - 0.5) * 8.0;
  conc *= 1.0 - 0.30 * (1.0 - smoothstep(0.06, 0.16 + pixG * 0.5, 4.0 - max(slab.x, slab.y))) * saturate(1.5 - pixG * 0.6);
  let rd = abs(fract((in.wp.xz - vec2f(1675.0, 95.0)) / 140.0 + 0.5) - 0.5) * 140.0;
  let rdm = min(rd.x, rd.y);
  let road = 1.0 - smoothstep(4.6, 5.2 + pixG, rdm);
  var asph = vec3f(0.050, 0.050, 0.054) * (0.75 + 0.5 * nz2.r);
  let along = select(in.wp.z, in.wp.x, rd.y < rd.x);
  let dash = step(fract(along / 12.0), 0.45) * (1.0 - smoothstep(0.10, 0.20 + pixG * 0.6, rdm));
  let edgeL = 1.0 - smoothstep(0.10, 0.20 + pixG * 0.6, abs(rdm - 4.1));
  asph = mix(asph, vec3f(0.50, 0.48, 0.40), max(dash, edgeL * 0.8) * saturate(1.6 - pixG * 0.35) * 0.85);
  conc = mix(conc, asph, road);
  alb = mix(alb, conc, paved);
  alb = mix(alb, mix(vec3f(0.11, 0.11, 0.115), vec3f(0.21, 0.20, 0.19), nz2.g), city);
  alb = mix(vec3f(0.07, 0.08, 0.065), alb, smoothstep(-1.2, 0.4, h));   // 水面下的海床
  let rough = (1.0 - paved) * (1.0 - city);
  n = normalize(n + vec3f(dn1.x, 0.0, dn1.y) * (0.06 + 1.0 * rough) + vec3f(dn2.x, 0.0, dn2.y) * (0.05 + 0.3 * rough));
  var s: Surf;
  s.pos = in.wp; s.n = n; s.albedo = alb; s.rough = 0.92; s.metal = 0.0; s.ao = 1.0; s.emis = vec3f(0.0);
  let toCam = F.camPos.xyz - in.wp;
  var col = shade(s, normalize(toCam));
  col = heatGround(col, in.wp.xz, hcv, hlc, hfw, length(toCam) * 2.0 * F.camUp.w * F.viewport.w);
  return vec4f(col, 1.0);
}
</script>

<script type="text/wgsl" id="water">
// ── water：海面與港內水面。位置由視線與 y=0 平面的交點算出；法線是多層方向波，
//    解析不到的小波依距離轉成粗糙度（斜率變異數），太陽光帶才會穩定不閃 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
#include heat_fn
@group(2) @binding(0) var reflTex: texture_2d<f32>;   // 平面反射（鏡射相機畫的設施、地形、燈光）
struct WOut { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> WOut {
  let c = vec2f(f32(i & 1u), f32((i >> 1u) & 1u)) * 2.0 - 1.0;
  let xz = F.camPos.xz + c * 90000.0;
  var o: WOut;
  o.pos = F.viewProj * vec4f(xz.x, 0.0, xz.y, 1.0);
  return o;
}
// 一個方向波：回傳 (斜率 x, 斜率 z, 解析不到的斜率變異數)。
// foot＝像素在水面上的涵蓋範圍 (沿視線方向, 垂直視線方向)；掠射角時沿視線方向會拉得很長
fn wave(p: vec2f, t: f32, ang: f32, lam: f32, steep: f32, ph: f32, foot: vec2f, vdir: vec2f) -> vec3f {
  let d = vec2f(cos(ang), sin(ang));
  let k = TAU / lam;
  let w = sqrt(9.81 * k);
  let al = abs(dot(d, vdir));
  let f = sqrt(foot.x * foot.x * al * al + foot.y * foot.y * (1.0 - al * al));
  let res = saturate(lam / (f * 2.5) - 0.7);           // 波長比像素涵蓋範圍大多少 → 還看得出來的比例
  let s = steep * cos(dot(d, p) * k - w * t + ph);
  return vec3f(d * (s * res), 0.5 * steep * steep * (1.0 - res * res));
}
@fragment fn fs(in: WOut) -> @location(0) vec4f {
  let uv = in.pos.xy * F.viewport.zw;
  let rd = normalize(viewRay(uv));
  let ro = F.camPos.xyz;
  let t = -ro.y / min(rd.y, -1e-6);
  let p = ro + rd * t;
  let V = -rd;
  // 像素在水面上涵蓋的大小（m）
  let pix = 2.0 * F.camUp.w * F.viewport.w;
  let foot = vec2f(t * pix / max(-rd.y, 0.004), t * pix);
  let vdir = normalize(rd.xz);
  let mac = textureSampleLevel(macroTex, sLin, mapUv(p.xz), 0.0);
  let depth = -mac.r;
  let sea = smoothstep(10.5, 16.0, depth);            // 0＝港內（平靜），1＝外海
  let tm = F.time.x;
  var acc = vec3f(0.0);
  // 外海：風浪（主波向大致跟西南風一致）
  acc += wave(p.xz, tm, -0.75, 46.0, 0.050 * sea, 0.3, foot, vdir);
  acc += wave(p.xz, tm, -0.35, 27.0, 0.060 * sea, 1.9, foot, vdir);
  acc += wave(p.xz, tm, -1.15, 15.0, 0.070 * sea, 4.1, foot, vdir);
  acc += wave(p.xz, tm, -0.55, 8.3, 0.075 * sea, 2.4, foot, vdir);
  // 細浪（港內也有，但更小）
  let rp = 0.35 + 0.65 * sea;
  acc += wave(p.xz, tm, -0.95, 4.1, 0.075 * rp, 5.2, foot, vdir);
  acc += wave(p.xz, tm, 0.25, 2.3, 0.080 * rp, 0.7, foot, vdir);
  acc += wave(p.xz, tm, -1.6, 1.3, 0.085 * rp, 3.3, foot, vdir);
  acc += wave(p.xz, tm, -0.15, 0.71, 0.085 * rp, 1.1, foot, vdir);
  // 雜訊漣漪（打散規則感）
  let r1 = textureSample(noise2D, sRep, p.xz / 23.0 + vec2f(0.011, -0.007) * tm).rg - 0.5;
  let r2 = textureSample(noise2D, sRep, p.xz / 5.7 + vec2f(-0.023, 0.017) * tm).gr - 0.5;
  let rres = saturate(1.2 - foot.x * 0.25);
  var slope = acc.xy + (r1 * 0.10 + r2 * 0.14 * rres) * rp;
  var sv = acc.z + (0.0012 + 0.0026 * (1.0 - rres)) * rp * rp + 0.0009;
  let N = normalize(vec3f(-slope.x, 1.0, -slope.y));
  let alpha = clamp(sqrt(2.0 * sv), 0.03, 0.5);
  let nv = max(dot(N, V), 0.0);
  // Fresnel（粗糙水面在掠射角的反射率會比鏡面低，用粗糙度往回修正）
  let fres = 0.02 + 0.98 * pow(1.0 - max(nv, alpha * 0.55), 5.0);
  // 天空反射：粗糙時反射方向往上偏
  var R = reflect(rd, N);
  R.y = abs(R.y) + alpha * 0.35;
  R = normalize(R);
  // 平面反射：用波浪斜率偏移取樣位置，並沿垂直方向多取幾點（水面越粗糙拉得越長）→ 燈光與煙囪的倒影拖成長條
  let du = dot(slope, F.camRight.xz) / F.camRight.w * 0.5;
  let dv = dot(slope, vdir) / F.camUp.w * 0.9;
  let spread = (alpha * 0.55 + 0.002) / F.camUp.w;
  var pr = vec4f(0.0);
  for (var k = 0; k < 5; k++) {
    let o = (f32(k) - 2.0) * 0.5;
    pr += textureSampleLevel(reflTex, sLin, clamp(uv + vec2f(du, dv + o * spread), vec2f(0.001), vec2f(0.999)), 0.0);
  }
  pr *= 0.2;
  let refl = skyColor(R, 0.0) * (1.0 - pr.a) + pr.rgb;
  // 太陽高光（GGX；粗糙度來自斜率變異數）
  let L = F.sunDir.xyz;
  let H = normalize(L + V);
  let nh = saturate(dot(N, H));
  let nl = saturate(dot(N, L));
  let a2 = alpha * alpha;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let kk = alpha * 0.5;
  let Vis = 0.25 / ((nl * (1.0 - kk) + kk) * (nv * (1.0 - kk) + kk));
  let Fs = 0.02 + 0.98 * pow(1.0 - saturate(dot(V, H)), 5.0);
  let sh = sunShadow(p, vec3f(0.0, 1.0, 0.0));
  let spec = F.sunIllum.rgb * min(D * Vis * Fs * nl, 60.0) * sh;
  // 水體顏色：港內混濁偏綠褐，外海較深較藍
  let rho = mix(vec3f(0.020, 0.030, 0.024), vec3f(0.006, 0.020, 0.028), sea);
  let Edown = ambient(vec3f(0.0, 1.0, 0.0)) * PI + F.sunIllum.rgb * max(L.y, 0.0) * sh;
  var body = rho * Edown / PI * 3.0;
  // 淺水：透出一點底色；岸邊泡沫
  let hh = terrainH(p.xz, 0);
  let shallow = smoothstep(-2.5, -0.2, hh);
  body = mix(body, vec3f(0.16, 0.15, 0.11) * Edown / PI, shallow * 0.6);
  let fn_ = textureSample(noise2D, sRep, p.xz / 9.0 + vec2f(0.02, 0.013) * tm).b;
  let foam = smoothstep(-0.9, -0.05, hh + (fn_ - 0.6) * 0.8) * (0.3 + 0.7 * sea);
  var col = mix(body, refl, fres) + spec;
  col = mix(col, vec3f(0.55) * Edown / PI, foam * 0.75);
  let hcv = heatLoad(p.xz);
  let hlc = log(max(hcv, 1e-9)) / 2.302585;
  col = heatGround(col, p.xz, hcv, hlc, fwidth(hlc), t * pix);
  return vec4f(col, 1.0);
}
</script>

<script type="text/wgsl" id="mesh_io">
// ── mesh_io：設施網格的頂點格式與 instance 變換（主場景與陰影共用）──
struct MIn {
  @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) me: vec2f,     // me＝(材質代號, 額外參數)
  @location(4) r0: vec4f, @location(5) r1: vec4f, @location(6) r2: vec4f,       // instance：3×4 仿射矩陣的三列
  @location(7) col: vec4f,                                                      // instance：rgb 顏色，a＝材質代號（整數部分）＋亂數種子（小數部分）
};
fn instPos(v: MIn) -> vec3f {
  let p = vec4f(v.pos, 1.0);
  return vec3f(dot(v.r0, p), dot(v.r1, p), dot(v.r2, p));
}
fn instScale(v: MIn) -> vec3f {
  return vec3f(length(vec3f(v.r0.x, v.r1.x, v.r2.x)), length(vec3f(v.r0.y, v.r1.y, v.r2.y)), length(vec3f(v.r0.z, v.r1.z, v.r2.z)));
}
</script>

<script type="text/wgsl" id="shadow">
// ── shadow：陰影 pass（只寫深度）。每個 cascade 一個小 uniform 指定要用哪個矩陣 ──
#include common
#include mesh_io
struct CasU { idx: vec4f };
@group(1) @binding(0) var<uniform> C: CasU;
@vertex fn vs(v: MIn) -> @builtin(position) vec4f {
  return F.shadowVP[u32(C.idx.x)] * vec4f(instPos(v), 1.0);
}
</script>

<script type="text/wgsl" id="mesh">
// ── mesh：工業設施（instancing）。材質全部程序生成：依物件自己的座標（公尺）畫色帶、窗格、焊道、鏽痕 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
#include mesh_io
struct MOut {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f, @location(1) wn: vec3f, @location(2) lp: vec3f, @location(3) ln: vec3f,
  @location(4) @interpolate(flat) mat: f32, @location(5) @interpolate(flat) col: vec4f, @location(6) ex: f32,
};
@vertex fn vs(v: MIn) -> MOut {
  var o: MOut;
  let sc = instScale(v);
  o.wp = instPos(v);
  let nl = v.nrm / (sc * sc);                    // 法線要用逆轉置矩陣（非等比縮放時才正確）
  o.wn = normalize(vec3f(dot(v.r0.xyz, nl), dot(v.r1.xyz, nl), dot(v.r2.xyz, nl)));
  o.lp = v.pos * sc;
  o.ln = v.nrm;
  o.mat = v.me.x; o.ex = v.me.y; o.col = v.col;
  o.pos = F.viewProj * vec4f(o.wp, 1.0);
  return o;
}
fn palette(h: f32) -> vec3f {                    // 貨櫃常見顏色
  var p = array<vec3f, 8>(vec3f(0.40, 0.07, 0.05), vec3f(0.05, 0.15, 0.34), vec3f(0.07, 0.26, 0.15), vec3f(0.58, 0.21, 0.04),
                          vec3f(0.40, 0.41, 0.42), vec3f(0.68, 0.68, 0.66), vec3f(0.05, 0.28, 0.31), vec3f(0.60, 0.47, 0.06));
  return p[u32(clamp(h, 0.0, 0.999) * 8.0)];
}
@fragment fn fs(in: MOut) -> @location(0) vec4f {
  var mat = i32(in.mat + 0.5);
  let seed = fract(in.col.a);
  if (mat == 255) { mat = i32(floor(in.col.a + 0.001)); }
  let ln = normalize(in.ln);
  var n = normalize(in.wn);
  let top = ln.y > 0.7;
  // 面內座標（公尺）：hu 沿牆面水平方向、hv 高度；圓柱面用弧長
  var hu = in.lp.x;
  if (abs(ln.x) > abs(ln.z)) { hu = in.lp.z; }
  let hv = in.lp.y;
  let arc = atan2(in.lp.z, in.lp.x) * max(length(in.lp.xz), 1.0);
  let so = vec2f(seed * 37.0, seed * 91.0);
  let n1 = textureSample(noise2D, sRep, vec2f(hu, hv) / 23.0 + so);
  let n2 = textureSample(noise2D, sRep, vec2f(hu, hv) / 3.3 + so);
  let stk = textureSample(noise2D, sRep, vec2f(hu / 2.7, hv / 70.0) + so);          // 垂直流痕（平面）
  let stc = textureSample(noise2D, sRep, vec2f(arc / 2.7, hv / 70.0) + so);         // 垂直流痕（圓柱面）
  let nt = textureSample(noise2D, sRep, in.lp.xz / 17.0 + so);                       // 頂面
  let night = F.sunIllum.w;
  var s: Surf;
  s.pos = in.wp; s.rough = 0.85; s.metal = 0.0; s.ao = 1.0; s.emis = vec3f(0.0);
  var alb = vec3f(0.3);
  let rust = mix(vec3f(0.20, 0.085, 0.035), vec3f(0.30, 0.15, 0.06), n2.g);
  if (mat == 0) {                                 // 混凝土
    alb = mix(vec3f(0.27, 0.265, 0.25), vec3f(0.40, 0.39, 0.37), n1.r) * (0.9 + 0.2 * n2.r);
    alb *= mix(1.0, 0.62, smoothstep(0.52, 0.75, stk.r));
  } else if (mat == 1) {                          // 油漆鋼材（顏色由 instance 給）
    alb = in.col.rgb * (0.85 + 0.3 * n1.g);
    alb = mix(alb, rust, smoothstep(0.60, 0.74, n1.r * 0.6 + n2.r * 0.4) * 0.8);
    alb *= mix(1.0, 0.7, smoothstep(0.55, 0.8, stk.g));
    s.rough = 0.55;
  } else if (mat == 2) {                          // 煙囪：上半段紅白相間的航空警示色帶，下半段是混凝土原色
    let t = in.ex;
    let conc = mix(vec3f(0.33, 0.32, 0.30), vec3f(0.45, 0.44, 0.41), nt.r * 0.5 + stc.r * 0.5);
    let bt = (t - 0.37) / 0.63 * 7.0;
    let red = fract(bt * 0.5) < 0.5;
    var band = vec3f(0.74, 0.72, 0.68);
    if (red) { band = vec3f(0.52, 0.065, 0.04); }
    let edge = smoothstep(0.0, 0.006, abs(fract(bt + 0.5) - 0.5));
    alb = mix(conc, band * (0.86 + 0.28 * stc.g), step(0.37, t));
    alb *= mix(0.8, 1.0, edge);
    alb *= mix(1.0, 0.55, smoothstep(0.50, 0.78, stc.r) * 0.8);          // 雨水流痕
    alb *= mix(1.0, 0.35, smoothstep(0.955, 1.0, t));                     // 出口附近的煤灰
    s.rough = 0.8;
  } else if (mat == 3 || mat == 16) {             // 建築外牆＋窗（16＝船艛，白色小窗）
    var fl = 3.6; var bay = 3.3;
    if (mat == 16) { fl = 2.8; bay = 2.2; }
    var wall = in.col.rgb * (0.82 + 0.3 * n1.r);
    if (mat == 16) { wall = vec3f(0.74, 0.73, 0.70) * (0.85 + 0.25 * n1.r); }
    wall *= mix(1.0, 0.68, smoothstep(0.55, 0.8, stk.r));
    alb = wall;
    if (top) { alb = vec3f(0.19, 0.19, 0.185) * (0.8 + 0.4 * nt.r); }
    else {
      let cu = fract(hu / bay); let cv = fract(hv / fl);
      let win = step(0.22, cu) * step(cu, 0.78) * step(0.32, cv) * step(cv, 0.80) * step(1.2, hv);
      let id = floor(vec2f(hu / bay, hv / fl)) + vec2f(seed * 977.0, seed * 131.0);
      let h1 = hash21(id);
      if (win > 0.5) {
        alb = vec3f(0.035, 0.045, 0.055);
        s.rough = 0.15;
        let on = step(0.62, h1) * night;                                  // 入夜後部分窗戶亮燈
        let warm = mix(vec3f(1.0, 0.62, 0.28), vec3f(0.80, 0.90, 1.0), step(0.55, hash21(id + 7.0)));
        s.emis = warm * on * (0.006 + 0.012 * hash21(id + 3.0));
      }
    }
  } else if (mat == 4) {                          // 浪板／貨櫃
    var c = in.col.rgb;
    if (in.ex > 0.001 && in.ex < 0.995) { c = palette(hash21(vec2f(floor(in.ex * 255.0 + 0.5), floor(hv / 2.6)) + seed * 100.0)); }
    let rib = sin(hu * TAU / 0.29);
    alb = c * (0.82 + 0.10 * rib + 0.2 * n1.r);
    alb = mix(alb, rust, smoothstep(0.66, 0.80, n1.g * 0.5 + n2.g * 0.5) * 0.7);
    alb *= mix(1.0, 0.72, smoothstep(0.55, 0.8, stk.r));
    if (top) { alb = c * 0.6 * (0.8 + 0.4 * nt.g); }
    s.rough = 0.6;
  } else if (mat == 5) {                          // 深色鋼構、管線
    alb = mix(vec3f(0.13, 0.13, 0.135), vec3f(0.23, 0.22, 0.21), n1.r);
    alb = mix(alb, rust, smoothstep(0.55, 0.72, n1.g) * 0.6);
    s.rough = 0.6; s.metal = 0.5;
  } else if (mat == 6) {                          // 屋頂、甲板
    alb = vec3f(0.17, 0.175, 0.17) * (0.75 + 0.5 * nt.r);
  } else if (mat == 7) {                          // 船殼：水線以下紅色防污漆，上面是船殼色
    let hull = in.col.rgb * (0.8 + 0.3 * n1.r);
    alb = mix(vec3f(0.30, 0.06, 0.045), hull, smoothstep(1.0, 1.25, hv + (n1.g - 0.5) * 0.3));
    alb = mix(alb, rust, smoothstep(0.50, 0.75, stk.r) * 0.55);
    s.rough = 0.5;
  } else if (mat == 8) {                          // 白色儲槽：每 2.4 m 一圈焊道，往下的鏽痕與底部污漬
    alb = vec3f(0.70, 0.69, 0.66) * (0.86 + 0.22 * n1.r);
    let seam = smoothstep(0.035, 0.0, abs(fract(hv / 2.4) - 0.5) * 2.4 - 1.16);
    alb *= 1.0 - 0.28 * seam;
    alb = mix(alb, rust * 1.3, smoothstep(0.56, 0.80, stc.r) * 0.55);
    alb *= mix(0.62, 1.0, smoothstep(0.0, 2.5, hv + n2.r));
    if (top) { alb = vec3f(0.60, 0.59, 0.57) * (0.8 + 0.3 * nt.r); }
    s.rough = 0.45;
  } else if (mat == 9) {                          // 柏油路＋標線
    alb = vec3f(0.045, 0.045, 0.05) * (0.8 + 0.5 * nt.r);
    let w = abs(in.lp.z);
    let dash = step(fract(in.lp.x / 12.0), 0.4) * smoothstep(0.16, 0.10, w);
    alb = mix(alb, vec3f(0.55), max(dash, smoothstep(0.12, 0.06, abs(w - 3.3))) * 0.8 * step(0.7, ln.y));
  } else if (mat == 11) {                         // 自發光（燈具）
    alb = vec3f(0.02);
    s.emis = in.col.rgb * night * 0.4;
  } else if (mat == 12) {                         // 黑（煙囪內壁）
    alb = vec3f(0.008);
  } else if (mat == 13) {                         // 消波塊、煤堆
    alb = in.col.rgb * (0.6 + 0.8 * nt.r * n2.g);
    s.rough = 0.95;
  } else if (mat == 14) {                         // 碼頭：混凝土＋邊緣黃線＋黑色防舷材
    alb = mix(vec3f(0.24, 0.24, 0.23), vec3f(0.36, 0.355, 0.34), nt.r);
    if (!top) {
      alb *= mix(0.45, 1.0, smoothstep(0.0, 2.2, hv + n2.r * 0.6));         // 潮間帶較黑
      alb = mix(alb, vec3f(0.02), step(abs(fract(hu / 9.0) - 0.5), 0.07) * step(1.0, hv));
    }
  } else if (mat == 15) {                         // 鋁皮保溫層（塔槽、管線）
    alb = vec3f(0.58, 0.59, 0.60) * (0.8 + 0.3 * n1.r);
    alb *= 1.0 - 0.2 * smoothstep(0.03, 0.0, abs(fract(hv / 1.2) - 0.5) * 1.2 - 0.57);
    s.rough = 0.38; s.metal = 0.85;
  }
  // 接近地面的積塵與濺痕
  alb *= mix(0.78, 1.0, smoothstep(0.0, 1.6, in.wp.y - terrainH(in.wp.xz, 1) + n2.b));
  s.n = n; s.albedo = alb;
#if REFL
  if (in.wp.y < 0.0) { discard; }   // 倒影 pass：水面以下不畫
#endif
  return vec4f(shade(s, normalize(F.camPos.xyz - in.wp)), 1.0);
}
</script>

<script type="text/wgsl" id="vol_march">
// ── vol_march：低解析度的體積 raymarch。先走煙流（依到煙流外緣的距離調整步長），再走大氣霧；
//    輸出 (加上的輻射, 透射率) 與輔助資訊 (重投影用的深度, 場景深度) ──
#include common
#include fullscreen
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include lighting
@group(2) @binding(0) var plumeLUT: texture_2d<f32>;
@group(2) @binding(1) var condLUT: texture_2d<f32>;
@group(2) @binding(2) var noise3D: texture_3d<f32>;
@group(2) @binding(3) var msLUT: texture_2d<f32>;
#if MSAA
@group(2) @binding(4) var depthIn: texture_depth_multisampled_2d;
#else
@group(2) @binding(4) var depthIn: texture_depth_2d;
#endif
#include plume_fn
struct MarchOut { @location(0) col: vec4f, @location(1) aux: vec4f };
@fragment fn fs(in: FSOut) -> MarchOut {
  let dpt = textureLoad(depthIn, vec2i(in.uv * F.viewport.xy), 0);
  let rdu = viewRay(in.uv);
  let rl = length(rdu);
  let rd = rdu / rl;
  let ro = F.camPos.xyz;
  let isSky = dpt <= 0.0;
  let zlin = min(linDepth(dpt), 60000.0);
  let tScene = zlin * rl;
  let jit = ign(in.pos.xy, F.time.y);
  let sunL = F.sunDir.xyz;
  let cosT = dot(rd, sunL);
  let pixA = 2.0 * F.camUp.w * F.viewport.w * VOL_DIV;       // 一個低解析度像素的張角
  // ── 煙流 ──
  var Tp = 1.0;
  var Lp = vec3f(0.0);
  var tw = 0.0;
  var twt = 0.0;
  let wd = PL.wind.xy;
  let relo = ro.xz - vec2f(PL.obbMin.w, PL.obbMax.w);
  let rol = vec3f(dot(relo, wd), ro.y, relo.y * wd.x - relo.x * wd.y);
  var rdl = vec3f(dot(rd.xz, wd), rd.y, rd.z * wd.x - rd.x * wd.y);
  rdl = select(rdl, vec3f(1e-6), abs(rdl) < vec3f(1e-6));
  let ta = (PL.obbMin.xyz - rol) / rdl;
  let tb = (PL.obbMax.xyz - rol) / rdl;
  let tmn = min(ta, tb);
  let tmx = max(ta, tb);
  let t0 = max(max(tmn.x, tmn.y), max(tmn.z, 0.0));
  let t1 = min(min(tmx.x, tmx.y), min(tmx.z, tScene));
  if (t1 > t0) {
    let ambUp = ambient(vec3f(0.0, 1.0, 0.0));
    let ambDn = ambient(vec3f(0.0, -1.0, 0.0)) + PL.glow.rgb;
    var t = t0 + jit * max(2.0, t0 * pixA * 2.0);
    var tPrev = t;
    var sigPrev = 0.0;
    var LinPrev = vec3f(0.0);
    for (var i = 0; i < VOL_STEPS; i++) {
      if (t >= t1 || Tp < 0.004) { break; }
      let p = ro + rd * t;
      let dsMin = max(1.5, t * pixA * 1.2);
      let pd = plumeEval(p, saturate(1.6 - t * pixA * 0.25));
      let sig = pd.ext + pd.haze;
      // 每一步的長度都加亂數（平均不變）：取樣位置才不會在相鄰像素之間排成等距的「等高線」
      let xi = fract(jit + 0.754878 * f32(i + 1));
      // 幾乎沒有東西的地方（外面，或煙流尾端淡到看不見的部分）：直接走到下一道煙流的外緣附近
      // 在某道煙流的範圍內（pd.stp < 1e4）步長不能超過它的幾何尺度，否則會一步跨過整個截面
      let geo = select(400.0, 2.0 * pd.stp, pd.stp < 1e4);
      var ds = clamp(min(geo, pd.lim), dsMin, 500.0) * (0.7 + 0.6 * xi);
      var Lin = vec3f(0.0);
      if (sig >= 1e-7) {
      // 步長：很淡的霾可以走大一點（每步的光學深度約 0.03），但最多到煙流粗細的 0.8 倍；濃的地方不超過約 1.4 個平均自由徑；
      // 而且不能越過「還沒進入的煙流」的外緣（pd.lim），否則會跳過埋在淡霾裡的濃煙。
      // （之前允許淡霾一步走 500 m，比煙流截面還寬，積分在輪廓附近高估 → 邊緣變成一道硬線）
      ds = clamp(min(min(max(pd.stp, min(0.03 / sig, geo)), pd.lim), 1.4 / sig), dsMin, 500.0) * (0.5 + xi);
      // 太陽光：查光學深度體積；多重散射用幾個「越來越鈍」的八度近似（厚的地方不會全黑）
      // 體積裡存的是「到體素中心」的累積值，要扣掉取樣點自己這格的一半，迎光面才不會被自己遮暗
      let tauS = max(plumeTau(p) - 0.5 * sig * PL.prm2.y, 0.0);
      // 一次散射（雙瓣 HG：逆光時薄邊發亮）＋兩個較鈍的八度（近似低階多重散射）
      var ms = 0.0;
      var a = 1.0; var b = 1.0; var c = 1.0;
      for (var k = 0; k < 3; k++) {
        ms += b * exp(-tauS * a) * mix(hg(cosT, 0.86 * c), hg(cosT, -0.28 * c), 0.2);
        a *= 0.45; b *= 0.6; c *= 0.45;
      }
      // 高階多重散射：光在厚雲裡擴散。雙流近似的漫透射率 1/(1+0.75(1−g)τ)，g≈0.85；
      // 只有夠厚的地方才有（薄霧只有一次散射）
      let thick = 1.0 - exp(-sig * pd.sz * 1.5);
      ms += thick * 0.75 / PI / (1.0 + 0.075 * tauS);
      ms *= pd.ao;
      // 環境光：依取樣點在煙流截面裡的位置估計「朝外的方向」，查該方向的天空；越深入煙流越暗。
      // 這樣背光那一側拿到的是另一邊天空的冷色，迎光側才是暖色
      let nrmW = normalize(vec3f(-wd.y * pd.dyn, pd.dzn + 0.15, wd.x * pd.dyn) + vec3f(0.0, 1e-3, 0.0));
      let depthIn = max(2.3 - length(vec2f(pd.dyn, pd.dzn)), 0.0);
      let td = sig * pd.sz * clamp(1.25 + 0.9 * pd.dzn, 0.05, 3.0);
      let amb = (ambient(nrmW) * exp(-sig * pd.sz * depthIn * 0.25) * 1.15 + (ambUp * 0.5 + ambDn) * 0.15) * pd.ao;
      // 火炬：點光源，照亮煙流底部
      let fv = PL.flare.xyz - p;
      let fl = vec3f(1.0, 0.52, 0.20) * PL.flare.w / (dot(fv, fv) + 900.0) * exp(-td * 0.3);
      let alb = (vec3f(pd.ext) + pd.haze * vec3f(0.93, 0.90, 0.86)) / sig;
      Lin = alb * (F.sunIllum.rgb * ms + amb + fl);
      }
      // 梯形積分：這個取樣點和上一個取樣點之間的線段，消光取兩端平均。
      // （只用單端的話，剛進入煙流的那一段會被整段當成空的，在淡霾的外緣形成看得見的界線）
      let seg = t - tPrev;
      let sA = 0.5 * (sig + sigPrev);
      if (sA > 1e-8 && seg > 0.0) {
        let sT = exp(-sA * seg);
        Lp += Tp * (1.0 - sT) * (Lin * sig + LinPrev * sigPrev) / (sig + sigPrev);
        tw += Tp * (1.0 - sT);
        twt += Tp * (1.0 - sT) * (t - 0.5 * seg);
        Tp *= sT;
      }
      tPrev = t; sigPrev = sig; LinPrev = Lin;
      t += ds;
    }
    // 最後一個取樣點到終點（場景表面或外框）的那一段
    if (sigPrev > 1e-7 && Tp >= 0.004) {
      let seg = max(min(t, t1) - tPrev, 0.0);
      let sT = exp(-0.5 * sigPrev * seg);
      Lp += Tp * (1.0 - sT) * LinPrev;
      tw += Tp * (1.0 - sT);
      twt += Tp * (1.0 - sT) * tPrev;
      Tp *= sT;
    }
  }
  // ── 大氣霧（和天空 LUT 同一個介質）：太陽項會被煙流與建築擋住 → 光柱 ──
  // 煙流的代表深度（把霧分成煙流前、後兩段用）。不能設門檻：門檻兩側的合成結果差一點點，
  // 就會沿著「霾的不透明度＝門檻值」的等值線在天空畫出一圈弧線
  var tP = tScene;
  if (tw > 1e-6) { tP = twt / tw; }
  let tEnd = min(tScene, 40000.0);
  let pR = phaseR(cosT);
  let pM = phaseM(cosT, A.mie.w);
  var Af = vec3f(0.0); var Ab = vec3f(0.0); var Uf = vec3f(0.0); var Ub = vec3f(0.0);
  var Tf = vec3f(1.0);
  var Tff = vec3f(1.0);
  let kexp = 3.4;
  var tPrev = 0.0;
  for (var i = 0; i < FOG_STEPS; i++) {
    let u1 = (f32(i) + 1.0) / f32(FOG_STEPS);
    let tNext = tEnd * (exp(kexp * u1) - 1.0) / (exp(kexp) - 1.0);
    let dt = tNext - tPrev;
    let t = tPrev + dt * fract(jit + 0.618034 * f32(i));
    let p = ro + rd * t;
    let hkm = max(p.y, 0.0) * 0.001;
    let m = medium(hkm);
    let ext = m.ext * 0.001;
    let scR = m.scatR * 0.001;
    let scM = m.scatM * 0.001;
    let Ts = transToSun(RG + hkm, sunL.y);
    let msv = textureSampleLevel(msLUT, sLin, vec2f(sunL.y * 0.5 + 0.5, saturate(hkm / (RTOP - RG))), 0.0).rgb;
    var sh = 1.0;
    if (t < 12000.0) {
      sh = plumeShadow(p);
#if FOG_CSM
      // 建築的影子只在近處進霧（遠處細長的影子在少量取樣下只會變成雜線）
      if (t < 700.0) { sh *= mix(csm1(p), 1.0, smoothstep(350.0, 700.0, t)); }
#endif
    }
    let S1 = A.sunE.rgb * Ts * (scR * pR + vec3f(scM * pM));
    let Sm = A.sunE.rgb * msv * (scR + vec3f(scM));
    let sT = exp(-ext * dt);
    let wI = (vec3f(1.0) - sT) / max(ext, vec3f(1e-9));
    let cs = Tf * wI * (S1 * sh + Sm);
    let cu = Tf * wI * (S1 + Sm);
    Tf *= sT;
    if (t < tP) { Af += cs; Uf += cu; Tff = Tf; } else { Ab += cs; Ub += cu; }
    tPrev = tNext;
  }
  var o: MarchOut;
  if (isSky) {
    // 天空像素：天空 LUT 已含整條視線的散射，這裡只扣掉被擋住的部分，並把煙流前方的空氣光補回來
    o.col = vec4f((1.0 - Tp) * Uf + Tff * Lp - (Uf - Af) - Tp * (Ub - Ab), Tp);
  } else {
    o.col = vec4f(Af + Tff * Lp + Tp * Ab, Tp * dot(Tf, vec3f(1.0 / 3.0)));
  }
  o.aux = vec4f(mix(tScene, tP, saturate(tw * 5.0)), zlin, 0.0, 0.0);   // 重投影用的深度：煙流越不透明越偏向煙流的深度
  // 除錯用（S.dbgVol）：1＝只看煙流的不透明度，2＝只看霧，3＝不合成體積
  if (F.time.w > 0.5 && F.time.w < 1.5) { o.col = vec4f(vec3f(1.0 - Tp) * 4.0 / F.camFwd.w, 0.0); }
  if (F.time.w > 1.5 && F.time.w < 2.5) { o.col = vec4f(Af + Ab, dot(Tf, vec3f(1.0 / 3.0))); if (isSky) { o.col = vec4f(Af - Uf + Ab - Ub, 1.0); } }
  if (F.time.w > 2.5) { o.col = vec4f(0.0, 0.0, 0.0, 1.0); }
  return o;
}
</script>

<script type="text/wgsl" id="vol_temporal">
// ── vol_temporal：體積結果的時間累積。用上一幀的矩陣重投影，並夾在目前鄰域的範圍內（抑制鬼影）──
#include common
#include fullscreen
@group(1) @binding(0) var curTex: texture_2d<f32>;
@group(1) @binding(1) var auxTex: texture_2d<f32>;
@group(1) @binding(2) var histTex: texture_2d<f32>;
struct VolU { p: vec4f };   // x＝1：沒有可用的歷史（剛啟動、改解析度或瞬間移動）
@group(1) @binding(3) var<uniform> VU: VolU;
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let pc = vec2i(in.pos.xy);
  let dim = vec2i(textureDimensions(curTex));
  let cur = textureLoad(curTex, pc, 0);
  var mn = cur;
  var mx = cur;
  for (var j = -1; j <= 1; j++) { for (var i = -1; i <= 1; i++) {
    let c = textureLoad(curTex, clamp(pc + vec2i(i, j), vec2i(0), dim - vec2i(1)), 0);
    mn = min(mn, c); mx = max(mx, c);
  } }
  let aux = textureLoad(auxTex, pc, 0);
  let wp = F.camPos.xyz + normalize(viewRay(in.uv)) * aux.r;
  let pp = F.prevViewProj * vec4f(wp, 1.0);
  let puv = pp.xy / max(pp.w, 1e-6) * vec2f(0.5, -0.5) + 0.5;
  var k = 0.93;
  if (VU.p.x > 0.5 || pp.w <= 0.0 || puv.x < 0.0 || puv.y < 0.0 || puv.x > 1.0 || puv.y > 1.0) { k = 0.0; }
  let hist = textureSampleLevel(histTex, sLin, puv, 0.0);
  let ex = (mx - mn) * 0.75 + vec4f(1e-4);
  return mix(cur, clamp(hist, mn - ex, mx + ex), k);
}
</script>

<script type="text/wgsl" id="vol_composite">
// ── vol_composite：把低解析度的體積結果合成回全解析度（深度感知升採樣）。混合：out = L + T·scene ──
#include common
#include fullscreen
@group(1) @binding(0) var volTex: texture_2d<f32>;
@group(1) @binding(1) var auxTex: texture_2d<f32>;
#if MSAA
@group(1) @binding(2) var depthIn: texture_depth_multisampled_2d;
#else
@group(1) @binding(2) var depthIn: texture_depth_2d;
#endif
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let zf = min(linDepth(textureLoad(depthIn, vec2i(in.pos.xy), 0)), 60000.0);
  let dim = vec2f(textureDimensions(volTex));
  let st = in.uv * dim - 0.5;
  let i0 = vec2i(floor(st));
  let f = st - floor(st);
  var acc = vec4f(0.0);
  var ws = 0.0;
  for (var k = 0; k < 4; k++) {
    let o = vec2i(k & 1, k >> 1u);
    let c = clamp(i0 + o, vec2i(0), vec2i(dim) - vec2i(1));
    let z = textureLoad(auxTex, c, 0).g;
    let bw = mix(1.0 - f.x, f.x, f32(o.x)) * mix(1.0 - f.y, f.y, f32(o.y));
    let w = bw / (0.03 + abs(z - zf) / max(zf, 1.0)) + 1e-5;
    acc += textureLoad(volTex, c, 0) * w;
    ws += w;
  }
  return acc / ws;
}
