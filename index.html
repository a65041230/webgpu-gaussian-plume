<script type="text/wgsl" id="common">
// ── common：每幀 uniform、取樣器、小工具 ──
// 注意：uniform struct 只用 vec4f 與 mat4x4f（都對齊 16 bytes），JS 端會解析這個 struct 自動算位移。
struct Frame {
  viewProj: mat4x4f,
  prevViewProj: mat4x4f,
  camPos: vec4f,     // xyz 世界座標（m），w = near
  camRight: vec4f,   // xyz，w = tan(水平視角/2)
  camUp: vec4f,      // xyz，w = tan(垂直視角/2)
  camFwd: vec4f,     // xyz，w 預留
  viewport: vec4f,   // 內部解析度 w, h, 1/w, 1/h
  sunDir: vec4f,     // xyz 指向太陽，w = 太陽高度角（rad）
  sunIllum: vec4f,   // rgb 地面的太陽照度，w = 夜間係數 0..1
  time: vec4f,       // x 模擬時間（s），y 幀序號，z 分析模式係數 0..1，w 預留
};
// 大氣參數（長度單位：公里）
struct Atmo {
  rayleigh: vec4f,   // rgb 海平面散射係數 [/km]，w = 尺度高 [km]
  mie: vec4f,        // x 散射、y 吸收 [/km]，z 尺度高 [km]，w 相位函數 g
  ozone: vec4f,      // rgb 吸收係數 [/km]
  haze: vec4f,       // 近地霾：x 散射、w 吸收 [/km]，y 尺度高 [km]
  sunE: vec4f,       // rgb 大氣層頂的太陽照度（相對單位），w = 太陽視半徑 [rad]
  misc: vec4f,       // x 地面反照率，y 相機高度 [km]，z 雲量 0..1，w 日面輝度上限
};
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var sLin: sampler;
@group(0) @binding(2) var sRep: sampler;
@group(0) @binding(3) var sNear: sampler; // @nonfiltering
@group(0) @binding(4) var<uniform> A: Atmo;

const PI: f32 = 3.14159265358979;
const TAU: f32 = 6.28318530717959;

fn saturate(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn sat3(x: vec3f) -> vec3f { return clamp(x, vec3f(0.0), vec3f(1.0)); }
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }

// 整數雜湊（PCG 風格）→ [0,1)
fn hashU(x: u32) -> u32 {
  var v = x * 747796405u + 2891336453u;
  let w = ((v >> ((v >> 28u) + 4u)) ^ v) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hash21(p: vec2f) -> f32 {
  let q = vec2u(vec2i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y))) * (1.0 / 4294967296.0);
}
fn hash31(p: vec3f) -> f32 {
  let q = vec3u(vec3i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y ^ hashU(q.z)))) * (1.0 / 4294967296.0);
}
// Interleaved Gradient Noise（Jimenez 2014）：搭配每幀位移，時間累積後接近 blue noise
fn ign(pix: vec2f, frame: f32) -> f32 {
  let p = pix + 5.588238 * (frame % 64.0);
  return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715))));
}
// 從螢幕 uv（左上原點）取得世界空間視線方向（未正規化，沿 camFwd 的分量為 1）
fn viewRay(uv: vec2f) -> vec3f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  return F.camFwd.xyz + F.camRight.xyz * (ndc.x * F.camRight.w) + F.camUp.xyz * (ndc.y * F.camUp.w);
}
// reversed-Z 無限遠投影：深度值 → 沿 camFwd 的線性距離（m）
fn linDepth(d: f32) -> f32 { return F.camPos.w / max(d, 1e-9); }
</script>

<script type="text/wgsl" id="fullscreen">
// ── fullscreen：一個涵蓋整個畫面的三角形 ──
struct FSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> FSOut {
  var o: FSOut;
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
</script>

<script type="text/wgsl" id="atmo_fn">
// ── atmo_fn：大氣介質與查表座標（Hillaire 2020；長度單位公里）。不存取貼圖 ──
const RG: f32 = 6360.0;     // 地球半徑
const RTOP: f32 = 6460.0;   // 大氣頂
// 射線與球（球心在原點）的兩個交點距離；沒有交點回傳 (-1,-1)
fn raySphere(ro: vec3f, rd: vec3f, rad: f32) -> vec2f {
  let b = dot(ro, rd);
  let c = dot(ro, ro) - rad * rad;
  let h = b * b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h);
  return vec2f(-b - s, -b + s);
}
struct Medium { scatR: vec3f, scatM: f32, ext: vec3f };
fn medium(h: f32) -> Medium {
  let dR = exp(-h / A.rayleigh.w);
  let dM = exp(-h / A.mie.z);
  let dH = exp(-h / A.haze.y);
  let dO = max(0.0, 1.0 - abs(h - 25.0) / 15.0);
  var m: Medium;
  m.scatR = A.rayleigh.rgb * dR;
  m.scatM = A.mie.x * dM + A.haze.x * dH;
  m.ext = m.scatR + vec3f(m.scatM + A.mie.y * dM + A.haze.w * dH) + A.ozone.rgb * dO;
  return m;
}
fn phaseR(c: f32) -> f32 { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
fn phaseM(c: f32, g: f32) -> f32 {   // Cornette-Shanks
  let g2 = g * g;
  return 3.0 / (8.0 * PI) * (1.0 - g2) * (1.0 + c * c) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
fn hg(c: f32, g: f32) -> f32 {       // Henyey-Greenstein
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
// transmittance LUT 參數化（Bruneton）：(r, mu) ↔ uv
fn transUv(r: f32, mu: f32) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = sqrt(max(r * r - RG * RG, 0.0));
  let disc = r * r * (mu * mu - 1.0) + RTOP * RTOP;
  let d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  let dmin = RTOP - r;
  let dmax = rho + H;
  return vec2f((d - dmin) / (dmax - dmin), rho / H);
}
fn transUvToRMu(uv: vec2f) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = H * uv.y;
  let r = sqrt(rho * rho + RG * RG);
  let dmin = RTOP - r;
  let dmax = rho + H;
  let d = dmin + uv.x * (dmax - dmin);
  var mu = 1.0;
  if (d > 0.0) { mu = (H * H - rho * rho - d * d) / (2.0 * r * d); }
  return vec2f(r, clamp(mu, -1.0, 1.0));
}
</script>

<script type="text/wgsl" id="atmo_lut_fn">
// ── atmo_lut_fn：查 transmittance LUT（需要先宣告 transLUT）──
fn transmittance(r: f32, mu: f32) -> vec3f {
  let uv = transUv(r, mu);
  return textureSampleLevel(transLUT, sLin, (uv * vec2f(255.0, 63.0) + 0.5) / vec2f(256.0, 64.0), 0.0).rgb;
}
// 從半徑 r 的點看太陽（天頂角餘弦 mu）的透射率；被地球擋住時為 0
fn transToSun(r: f32, mu: f32) -> vec3f {
  let hc = -sqrt(max(1.0 - (RG / r) * (RG / r), 0.0));
  return transmittance(r, mu) * smoothstep(-0.004, 0.004, mu - hc);
}
</script>

<script type="text/wgsl" id="lut_trans">
// ── lut_trans：transmittance LUT（256×64）──
#include common
#include fullscreen
#include atmo_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(255.0, 63.0);
  let rm = transUvToRMu(uv);
  let ro = vec3f(0.0, rm.x, 0.0);
  let rd = vec3f(sqrt(max(1.0 - rm.y * rm.y, 0.0)), rm.y, 0.0);
  let tTop = raySphere(ro, rd, RTOP).y;
  var od = vec3f(0.0);
  let N = 48;
  for (var i = 0; i < N; i++) {   // 取樣點往起點加密（近地霾的尺度高很小）
    let a = f32(i) / f32(N);
    let b = f32(i + 1) / f32(N);
    let t0 = a * a * tTop;
    let t1 = b * b * tTop;
    let p = ro + rd * (0.5 * (t0 + t1));
    od += medium(max(length(p) - RG, 0.0)).ext * (t1 - t0);
  }
  return vec4f(exp(-od), 1.0);
}
</script>

<script type="text/wgsl" id="lut_ms">
// ── lut_ms：多重散射 LUT（32×32；u = 太陽天頂角餘弦，v = 高度）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
#include atmo_lut_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / 31.0;
  let muS = uv.x * 2.0 - 1.0;
  let r = RG + 0.01 + uv.y * (RTOP - RG - 0.02);
  let sun = vec3f(sqrt(max(1.0 - muS * muS, 0.0)), muS, 0.0);
  let ro = vec3f(0.0, r, 0.0);
  var L2 = vec3f(0.0);
  var fms = vec3f(0.0);
  let SQ = 8;
  let NS = 20;
  for (var i = 0; i < SQ; i++) {
    for (var j = 0; j < SQ; j++) {
      let th = TAU * (f32(i) + 0.5) / f32(SQ);
      let cph = 1.0 - 2.0 * (f32(j) + 0.5) / f32(SQ);
      let sph = sqrt(max(1.0 - cph * cph, 0.0));
      let rd = vec3f(sph * cos(th), cph, sph * sin(th));
      let tg = raySphere(ro, rd, RG);
      var tMax = raySphere(ro, rd, RTOP).y;
      let hit = tg.x > 0.0;
      if (hit) { tMax = tg.x; }
      var T = vec3f(1.0);
      var Li = vec3f(0.0);
      var Lf = vec3f(0.0);
      let dt = tMax / f32(NS);
      for (var s = 0; s < NS; s++) {
        let p = ro + rd * ((f32(s) + 0.3) * dt);
        let rr = length(p);
        let m = medium(max(rr - RG, 0.0));
        let sT = exp(-m.ext * dt);
        let scat = m.scatR + vec3f(m.scatM);
        let Ts = transToSun(rr, dot(p / rr, sun));
        let S = Ts * scat * (1.0 / (4.0 * PI));
        Li += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
        Lf += T * (scat - scat * sT) / max(m.ext, vec3f(1e-7));
        T *= sT;
      }
      if (hit) {   // 地面反射的一次散射
        let pg = ro + rd * tMax;
        let n = normalize(pg);
        let nl = saturate(dot(n, sun));
        Li += T * transToSun(RG + 0.001, dot(n, sun)) * nl * A.misc.x / PI;
      }
      L2 += Li;
      fms += Lf;
    }
  }
  let inv = 1.0 / f32(SQ * SQ);
  L2 *= inv;
  fms *= inv;
  return vec4f(L2 / (vec3f(1.0) - fms), 1.0);
}
</script>

<script type="text/wgsl" id="sky_lut_map">
// ── sky_lut_map：sky-view LUT 的方向 ↔ uv（緯度在地平線附近加密；方位相對太陽、左右對稱）──
const SKY_W: f32 = 192.0;
const SKY_H: f32 = 108.0;
fn skyHorizon() -> vec2f {   // (zenith 到地平線的角度, beta)
  let r = RG + A.misc.y;
  let beta = acos(clamp(sqrt(max(r * r - RG * RG, 0.0)) / r, 0.0, 1.0));
  return vec2f(PI - beta, beta);
}
fn skyUv(dir: vec3f) -> vec2f {
  let hz = skyHorizon();
  let ang = acos(clamp(dir.y, -1.0, 1.0));
  var v: f32;
  if (ang < hz.x) { v = (1.0 - sqrt(max(1.0 - ang / hz.x, 0.0))) * 0.5; }
  else { v = sqrt(saturate((ang - hz.x) / hz.y)) * 0.5 + 0.5; }
  let dh = dir.xz / max(length(dir.xz), 1e-5);
  let sh = F.sunDir.xz / max(length(F.sunDir.xz), 1e-5);
  let u = acos(clamp(dot(dh, sh), -1.0, 1.0)) / PI;
  return vec2f((u * (SKY_W - 1.0) + 0.5) / SKY_W, (v * (SKY_H - 1.0) + 0.5) / SKY_H);
}
</script>

<script type="text/wgsl" id="lut_sky">
// ── lut_sky：sky-view LUT（192×108，每幀更新）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var msLUT: texture_2d<f32>;
#include atmo_lut_fn
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(SKY_W - 1.0, SKY_H - 1.0);
  let hz = skyHorizon();
  var ang: f32;
  if (uv.y < 0.5) { var c = 1.0 - 2.0 * uv.y; c = 1.0 - c * c; ang = hz.x * c; }
  else { var c = uv.y * 2.0 - 1.0; c = c * c; ang = hz.x + hz.y * c; }
  let phi = uv.x * PI;
  let rd = vec3f(sin(ang) * cos(phi), cos(ang), sin(ang) * sin(phi));
  let el = F.sunDir.w;
  let sun = vec3f(cos(el), sin(el), 0.0);
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let tg = raySphere(ro, rd, RG);
  var tMax = raySphere(ro, rd, RTOP).y;
  if (tg.x > 0.0) { tMax = tg.x; }
  let cosT = dot(rd, sun);
  let pR = phaseR(cosT);
  let pM = phaseM(cosT, A.mie.w);
  var T = vec3f(1.0);
  var L = vec3f(0.0);
  let N = 32;
  for (var i = 0; i < N; i++) {
    var t0 = f32(i) / f32(N);
    var t1 = f32(i + 1) / f32(N);
    t0 = t0 * t0; t1 = t1 * t1;
    let t = tMax * (t0 + (t1 - t0) * 0.3);
    let dt = tMax * (t1 - t0);
    let p = ro + rd * t;
    let rr = length(p);
    let m = medium(max(rr - RG, 0.0));
    let sT = exp(-m.ext * dt);
    let muS = dot(p / rr, sun);
    let Ts = transToSun(rr, muS);
    let ms = textureSampleLevel(msLUT, sLin, vec2f(muS * 0.5 + 0.5, saturate((rr - RG) / (RTOP - RG))), 0.0).rgb;
    let S = A.sunE.rgb * (Ts * (m.scatR * pR + vec3f(m.scatM * pM)) + ms * (m.scatR + vec3f(m.scatM)));
    L += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
    T *= sT;
  }
  return vec4f(L, 1.0);
}
</script>

<script type="text/wgsl" id="amb_cube">
// ── amb_cube：天空環境光（6 個軸向的餘弦加權平均輝度，6×1）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var skyLUT: texture_2d<f32>;
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let k = i32(in.pos.x);
  var n = vec3f(1.0, 0.0, 0.0);
  if (k == 1) { n = vec3f(-1.0, 0.0, 0.0); }
  if (k == 2) { n = vec3f(0.0, 1.0, 0.0); }
  if (k == 3) { n = vec3f(0.0, -1.0, 0.0); }
  if (k == 4) { n = vec3f(0.0, 0.0, 1.0); }
  if (k == 5) { n = vec3f(0.0, 0.0, -1.0); }
  let t = normalize(cross(n, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(n.y) > 0.5)));
  let b = cross(n, t);
  var acc = vec3f(0.0);
  let N = 64;
  for (var i = 0; i < N; i++) {
    let u = (f32(i) + 0.5) / f32(N);
    let ph = TAU * fract(f32(i) * 0.61803399);
    let ct = sqrt(1.0 - u);
    let st = sqrt(u);
    var d = t * (st * cos(ph)) + b * (st * sin(ph)) + n * ct;
    var w = 1.0;
    if (d.y < 0.0) { d.y = 0.02; d = normalize(d); w = 0.3; }   // 地平線以下：用地平線天色的 0.3 倍近似地面反光
    acc += textureSampleLevel(skyLUT, sLin, skyUv(d), 0.0).rgb * w;
  }
  return vec4f(acc / f32(N), 1.0);
}
</script>

<script type="text/wgsl" id="scene_tex">
// ── scene_tex：場景共用貼圖（group 1）。產生這些貼圖的 pass 不能 include 這個模組 ──
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var msLUT: texture_2d<f32>;
@group(1) @binding(2) var skyLUT: texture_2d<f32>;
@group(1) @binding(3) var ambCube: texture_2d<f32>;
@group(1) @binding(4) var noise2D: texture_2d<f32>;
</script>

<script type="text/wgsl" id="sky_fn">
// ── sky_fn：天空顏色（LUT＋雲＋日面＋星）與環境光。需要 scene_tex、atmo_fn、atmo_lut_fn、sky_lut_map ──
fn skyLutSample(dir: vec3f) -> vec3f {
  return textureSampleLevel(skyLUT, sLin, skyUv(dir), 0.0).rgb;
}
// 天空環境光：依法線在 6 個軸向之間內插（ambient cube）
fn ambient(n: vec3f) -> vec3f {
  let n2 = n * n;
  let ix = select(1, 0, n.x >= 0.0);
  let iy = select(3, 2, n.y >= 0.0);
  let iz = select(5, 4, n.z >= 0.0);
  return n2.x * textureLoad(ambCube, vec2i(ix, 0), 0).rgb + n2.y * textureLoad(ambCube, vec2i(iy, 0), 0).rgb
       + n2.z * textureLoad(ambCube, vec2i(iz, 0), 0).rgb;
}
// 一層薄雲。回傳 (rgb 顏色, a 遮蔽量)
fn cloudLayer(dir: vec3f, altKm: f32, scale: vec2f, drift: vec2f, cover: f32, soft: f32) -> vec4f {
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let t = raySphere(ro, dir, RG + altKm).y;
  if (dir.y <= 0.002 || t <= 0.0) { return vec4f(0.0); }
  let w = F.camPos.xz * 0.001 + dir.xz * t;
  let uv = w * scale + drift * (F.time.x * 0.0004);
  let n1 = textureSampleLevel(noise2D, sRep, uv, 0.0);
  let n2 = textureSampleLevel(noise2D, sRep, uv * 3.3 + n1.gr * 0.12, 0.0);
  let n3 = textureSampleLevel(noise2D, sRep, uv * 11.0 + n2.rg * 0.05, 0.0);
  var d = n1.r * 0.62 + n2.g * 0.28 + n3.r * 0.10;
  d = smoothstep(1.0 - cover, 1.0 - cover + soft, d);
  if (d <= 0.0) { return vec4f(0.0); }
  // 雲的位置看太陽：越晚越紅，被地球擋住就暗掉
  let pc = ro + dir * t;
  let rc = length(pc);
  let sunL = normalize(vec3f(F.sunDir.x, F.sunDir.y, F.sunDir.z));
  let muS = dot(pc / rc, sunL);
  let sunC = A.sunE.rgb * transToSun(rc, muS);
  let cosS = dot(dir, sunL);
  let fwd = hg(cosS, 0.72) * 3.0 + hg(cosS, 0.25) * 2.0 + 0.10;
  let thin = 1.0 - 0.75 * d;                     // 厚的地方自己遮光
  let amb = skyLutSample(vec3f(0.0, 1.0, 0.0)) * 1.6 + skyLutSample(normalize(vec3f(dir.x, 0.25, dir.z))) * 0.5;
  let col = sunC * fwd * thin * 0.55 + amb * (0.35 + 0.4 * d);
  // 相機到雲之間的透射率：T(相機, 方向) / T(雲, 方向)
  let Tv = transmittance(r, dir.y) / max(transmittance(rc, dot(pc / rc, dir)), vec3f(1e-4));
  let fade = saturate(luma(Tv) * 1.15) * smoothstep(0.002, 0.05, dir.y);
  return vec4f(col, d * fade);
}
fn stars(dir: vec3f) -> f32 {
  let p = dir * 220.0;
  let id = floor(p);
  let h = hash31(id + 500.0);
  if (h < 0.992) { return 0.0; }
  let c = id + 0.5 + (vec3f(hash31(id + 11.0), hash31(id + 23.0), hash31(id + 37.0)) - 0.5) * 0.6;
  let d = length(p - c);
  return smoothstep(0.42, 0.0, d) * (0.3 + 3.0 * pow(hash31(id + 71.0), 6.0));
}
fn skyColor(dir: vec3f, withSun: f32) -> vec3f {
  var L = skyLutSample(dir);
  let night = F.sunIllum.w;
  // 夜空底色（大氣輝光＋月光散射的近似）與地平線的城市光害
  let hor = 1.0 - saturate(dir.y);
  L += vec3f(0.010, 0.016, 0.034) * night * (0.35 + 0.65 * hor * hor) * 0.012;
  L += vec3f(1.0, 0.62, 0.30) * night * pow(hor, 10.0) * 0.00045;
  if (dir.y > -0.02) {
    L += vec3f(0.9, 0.95, 1.0) * stars(dir) * night * 0.0035 * smoothstep(0.0, 0.25, dir.y);
    let cov = A.misc.z;
    // 高層卷雲（拉長）與中層碎雲
    let c1 = cloudLayer(dir, 9.5, vec2f(0.012, 0.034), vec2f(0.6, 0.2), cov * 0.62, 0.42);
    L = mix(L, c1.rgb, c1.a * 0.85);
    let c2 = cloudLayer(dir, 4.2, vec2f(0.045, 0.060), vec2f(1.0, -0.4), cov * 0.50, 0.22);
    L = mix(L, c2.rgb, c2.a * 0.92);
  }
  // 日面（含周邊減光）；輝度有上限，避免 bloom 失控
  let sunL = F.sunDir.xyz;
  let ang = length(cross(dir, sunL));
  let rad = A.sunE.w;
  if (withSun > 0.0 && dot(dir, sunL) > 0.0 && ang < rad * 1.6) {
    let r = RG + A.misc.y;
    let x = saturate(ang / rad);
    let limb = 1.0 - 0.55 * (1.0 - sqrt(max(1.0 - x * x, 0.0)));
    let disc = smoothstep(rad * 1.04, rad * 0.94, ang);
    let Ls = A.sunE.rgb * transToSun(r, dir.y) / (PI * rad * rad);
    L += min(Ls * limb, vec3f(A.misc.w)) * disc * withSun;
  }
  return L;
}
</script>

<script type="text/wgsl" id="sky">
// ── sky：主場景裡的天空（畫在最遠處）──
#include common
#include fullscreen
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let rd = normalize(viewRay(in.uv));
  var col = skyColor(rd, 1.0);
  // M2 暫用：格線地面（M3 換成地形與水面）
  let ro = F.camPos.xyz;
  let tg = -ro.y / min(rd.y, -1e-5);
  let pg = ro + rd * tg;
  let fw = fwidth(pg.xz / 500.0);
  if (rd.y < 0.0) {
    let g = abs(fract(pg.xz / 500.0 - 0.5) - 0.5) / fw;
    let line = 1.0 - saturate(min(g.x, g.y));
    let n = vec3f(0.0, 1.0, 0.0);
    let ground = (vec3f(0.12) + vec3f(0.3) * line) * (ambient(n) + F.sunIllum.rgb * max(F.sunDir.y, 0.0) / PI);
    col = mix(ground, col, saturate(tg / 30000.0));
  }
  return vec4f(col, 1.0);
}
</script>

<script type="text/wgsl" id="resolve">
// ── resolve：MSAA 自訂 resolve。用可逆 tone map 的權重平均，避免超亮像素讓邊緣鋸齒 ──
#include common
#include fullscreen
@group(1) @binding(0) var msTex: texture_multisampled_2d<f32>;
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let p = vec2i(in.pos.xy);
  var acc = vec3f(0.0);
  var wsum = 0.0;
  for (var i = 0; i < 4; i++) {
    let c = textureLoad(msTex, p, i).rgb;
    let w = 1.0 / (1.0 + luma(max(c, vec3f(0.0))) * F.camFwd.w);
    acc += c * w;
    wsum += w;
  }
  return vec4f(acc / wsum, 1.0);
}
</script>

<script type="text/wgsl" id="post_final">
// ── post_final：曝光 → AgX → 調色 → dithering → canvas ──
#include common
#include fullscreen
struct PostU {
  p0: vec4f,   // x 曝光倍率，y bloom 強度，z 去飽和（分析模式），w 暗角強度
  p1: vec4f,   // x canvas 寬，y canvas 高，z 幀序號，w 預留
};
@group(1) @binding(0) var<uniform> P: PostU;
@group(1) @binding(1) var hdrTex: texture_2d<f32>;
@group(1) @binding(2) var bloomTex: texture_2d<f32>;

// AgX（Troy Sobotka）；這裡用 Benjamin Wrensch 的精簡近似版
fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x; let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(c: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                  0.0784335999999992, 0.878468636469772, 0.0784336,
                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393; let maxEv = 4.026069;
  var v = m * c;
  v = clamp(log2(max(v, vec3f(1e-10))), vec3f(minEv), vec3f(maxEv));
  v = (v - minEv) / (maxEv - minEv);
  return agxContrast(v);
}
fn agxLook(c: vec3f) -> vec3f {
  // 稍微加對比與飽和（介於預設與 punchy 之間）
  var v = pow(max(c, vec3f(0.0)), vec3f(1.18));
  let l = luma(v);
  return l + 1.22 * (v - l);
}
fn agxEotf(c: vec3f) -> vec3f {
  let m = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                  -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                  -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  return pow(max(m * c, vec3f(0.0)), vec3f(2.2));
}
fn toSrgb(c: vec3f) -> vec3f {
  let lo = c * 12.92;
  let hi = 1.055 * pow(max(c, vec3f(0.0)), vec3f(1.0 / 2.4)) - 0.055;
  return select(hi, lo, c <= vec3f(0.0031308));
}
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  var c = max(textureSampleLevel(hdrTex, sLin, in.uv, 0.0).rgb, vec3f(0.0));
  let b = max(textureSampleLevel(bloomTex, sLin, in.uv, 0.0).rgb, vec3f(0.0));
  c = mix(c, b, P.p0.y) * P.p0.x;
  // 暗角
  let q = in.uv - 0.5;
  c *= 1.0 - P.p0.w * smoothstep(0.25, 0.95, dot(q, q) * 2.0);
  var o = agxEotf(agxLook(agx(c)));
  // 分析模式：去飽和
  o = mix(o, vec3f(luma(o)), P.p0.z);
  o = toSrgb(o);
  // 三角分佈 dithering，消除 8-bit 色帶
  let n1 = hash21(in.pos.xy + vec2f(P.p1.z * 13.0, 7.0));
  let n2 = hash21(in.pos.xy + vec2f(91.0, P.p1.z * 17.0 + 3.0));
  o += (n1 + n2 - 1.0) / 255.0;
  return vec4f(o, 1.0);
}
</script>

};
// 矩陣：Float32Array(16)，column-major（和 WGSL mat4x4f 一致）
const m4 = {
  ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) {

  },
  // reversed-Z、無限遠平面的透視投影（near 映到 1，無限遠映到 0）

    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return o;
  },

  });
  window.addEventListener('mouseup', () => { INPUT.dragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (INPUT.locked) { lookBy(e.movementX, e.movementY); userActed(); }
    else if (INPUT.dragging) { lookBy(e.clientX - INPUT.lx, e.clientY - INPUT.ly); INPUT.lx = e.clientX; INPUT.ly = e.clientY; userActed(); }
  });
  document.addEventListener('pointerlockchange', () => { INPUT.locked = document.pointerLockElement === canvas; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    S.cam.speed = clamp(S.cam.speed * Math.pow(1.15, -Math.sign(e.deltaY)), 2, 2000);
    userActed();
  }, {passive: false});
}
function updateCamera(dt) {
  const c = S.cam;
  if (!S.userActed && !CFG.shot && !CFG.bench) {
    // 使用者還沒操作：鏡頭緩慢推移
    const f = dirFromAzEl(c.yaw, 0), r = [Math.cos(c.yaw), 0, Math.sin(c.yaw)];
    c.pos = v3.add(c.pos, v3.add(v3.scale(f, 3.0 * dt), v3.scale(r, 1.2 * dt)));
    return;
  }
  let mx = 0, mz = 0, my = 0;
  if (KEYS.has('KeyW') || KEYS.has('ArrowUp')) mz += 1;
  if (KEYS.has('KeyS') || KEYS.has('ArrowDown')) mz -= 1;
  if (KEYS.has('KeyD') || KEYS.has('ArrowRight')) mx += 1;
  if (KEYS.has('KeyA') || KEYS.has('ArrowLeft')) mx -= 1;
  if (KEYS.has('Space')) my += 1;
  if (KEYS.has('ShiftLeft') || KEYS.has('ShiftRight')) my -= 1;
  mx += INPUT.joy[0]; mz += INPUT.joy[1]; my += INPUT.lift;
  const f = dirFromAzEl(c.yaw, c.pitch), r = [Math.cos(c.yaw), 0, Math.sin(c.yaw)];
  const want = v3.scale([f[0] * mz + r[0] * mx, f[1] * mz + my, f[2] * mz + r[2] * mx], c.speed);
  const k = 1 - Math.exp(-dt * 8);
  c.vel = v3.lerp(c.vel, want, k);
  c.pos = v3.add(c.pos, v3.scale(c.vel, dt));
  c.pos[0] = clamp(c.pos[0], -14000, 14000); c.pos[2] = clamp(c.pos[2], -14000, 14000); c.pos[1] = clamp(c.pos[1], 1.5, 6000);
  c.fov = lerp(c.fov, c.fovTarget, 1 - Math.exp(-dt * 2.2));
}

// ═══ §J9 測試鉤子 ═════════════════════════════════════════════════════
function selftestCPU() {
  const out = [];
  const chk = (id, name, val, ref, tol) => {
    const err = Math.abs(val - ref) / Math.abs(ref), ok = err < tol;
    out.push({id, name, val, ref, err, ok});
    console.log(`SELFTEST ${ok ? 'PASS' : 'FAIL'} ${id} ${name}：計算值=${val.toPrecision(8)}，參考值=${ref}，相對誤差=${(err * 100).toExponential(3)}%（門檻 ${tol * 100}%）`);
  };
  const s = PHYS.sigma('D', false, 1000);
  chk('a1', 'σy（D 級、鄉村、x=1000 m）[m]', s.sy, 76.28, 0.005);
  chk('a2', 'σz（D 級、鄉村、x=1000 m）[m]', s.sz, 37.95, 0.005);
  const c1 = PHYS.gauss(100, 5, s.sy, s.sz, 0, 0, 100);
  chk('b', '地面中心線濃度（Q=100 g/s、u=5 m/s、H=100 m）[μg/m³]', c1 * 1e6, 68.29, 0.005);
  // c 質量守恆：∫∫ u·C dy dz，y 取 ±8σy，z 取 0 到 H+8σz，中點法
  let flux = 0; const ny = 400, nz = 800, y0 = -8 * s.sy, dy = 16 * s.sy / ny, zTop = 100 + 8 * s.sz, dz = zTop / nz;
  for (let j = 0; j < nz; j++) { const z = (j + 0.5) * dz; for (let i = 0; i < ny; i++) flux += 5 * PHYS.gauss(100, 5, s.sy, s.sz, y0 + (i + 0.5) * dy, z, 100) * dy * dz; }
  chk('c', '質量守恆 ∫∫u·C dy dz（應等於 Q=100）[g/s]', flux, 100, 0.01);
  const c2 = PHYS.gauss(100, 10, s.sy, s.sz, 0, 0, 100);
  chk('d', '風速加倍後的濃度比（應為 0.5）', c2 / c1, 0.5, 1e-9);
  return out;
}
async function runSelftest() {
  const res = selftestCPU();
  window.__selftest = {items: res, done: false};
  // e 項（GPU 熱圖回讀）在熱圖 pass 建好後補上
  if (typeof selftestGPU === 'function') { try { res.push(...await selftestGPU()); } catch (e) { reportError('[selftest e] ' + (e.stack || e)); res.push({id: 'e', ok: false, name: 'GPU 熱圖回讀', err: NaN}); } }
  const allOk = res.every(r => r.ok);
  window.__selftest.done = true; window.__selftest.ok = allOk;
  console.log(`SELFTEST ${allOk ? 'PASS' : 'FAIL'} 總結：${res.filter(r => r.ok).length}/${res.length} 項通過`);
}
window.__scene = {
  setCamera(o) {
    const c = S.cam;
    if (o.pos) c.pos = [...o.pos];
    if (o.target) { const d = v3.norm(v3.sub(o.target, c.pos)); c.yaw = (Math.atan2(d[0], -d[2]) + Math.PI * 2) % (Math.PI * 2); c.pitch = Math.asin(clamp(d[1], -1, 1)); }
    if (o.yawDeg !== undefined) c.yaw = o.yawDeg * DEG;
    if (o.pitchDeg !== undefined) c.pitch = o.pitchDeg * DEG;
    if (o.fovDeg !== undefined) { c.fov = c.fovTarget = o.fovDeg * DEG; }
    S.userActed = true; c.vel = [0, 0, 0];
  },
  setTime(min) { S.timeMin = clamp(+min, -90, 75); },
  setParams(o) { Object.assign(S.params, o); S.paramsDirty = true; },
  setMode(m) { S.mode = (m === 1 || m === 'analysis') ? 1 : 0; },
  getState() { return JSON.parse(JSON.stringify({cam: S.cam, timeMin: S.timeMin, params: S.params, mode: S.mode, tier: TIER.name, res: [RT.w, RT.h], canvas: [canvas.width, canvas.height], adapter: GPU.adapterName, gl: GPU.glName, software: GPU.software, features: GPU.features, frame: S.frame, errors: S.errors.length})); },
};

// ═══ §J10 主迴圈與啟動 ════════════════════════════════════════════════
function update(dt) {
  if (!S.frozen) S.simTime += dt;
  S.modeK = lerp(S.modeK, S.mode, 1 - Math.exp(-dt * 3.5));
  if (Math.abs(S.modeK - S.mode) < 0.002) S.modeK = S.mode;
  updateCamera(dt);
}
const LOOP = {lastRaf: 0, lastTick: 0, starved: false, gpuBusy: false, manual: false};
function tick(nowMs) {
  if (!GPU.ready || LOOP.gpuBusy || LOOP.manual) return;
  const now = nowMs * 0.001;
  let dt = Math.min(now - S.lastT, 0.1);
  if (S.resetDt || !(dt > 0)) { dt = 1 / 60; S.resetDt = false; }
  S.lastT = now; LOOP.lastTick = nowMs;
  try {
    update(dt); render();
    LOOP.gpuBusy = true;   // GPU 還沒做完上一幀就不再送，避免工作堆積
    device.queue.onSubmittedWorkDone().then(() => { LOOP.gpuBusy = false; }, () => { LOOP.gpuBusy = false; });
  } catch (e) { reportError('[frame] ' + (e.stack || e)); GPU.ready = false; }
  if (CFG.shot && !window.__shotReady && S.frame >= 90 && !S.errors.length) { window.__shotReady = true; console.log('SHOT_READY'); }
}
function rafLoop() {
  const n = performance.now();
  if (n - LOOP.lastRaf < 200) LOOP.starved = false;
  LOOP.lastRaf = n;
  tick(n);
  requestAnimationFrame(rafLoop);
}
// 視窗被遮住或最小化、但分頁仍算「可見」時，requestAnimationFrame 會被瀏覽器降到每秒 1–2 次（自動化測試常見）。
// 這時改用計時器推動畫面；真的切到背景分頁（document.hidden）就不畫。
setInterval(() => {
  const n = performance.now();
  if (document.hidden) return;
  if (n - LOOP.lastRaf > 400) LOOP.starved = true;
  if (LOOP.starved && n - LOOP.lastTick > 15) tick(n);
}, 8);
document.addEventListener('visibilitychange', () => { S.resetDt = true; });   // 分頁切回來時不用累積的時間差
async function start(isRestart) {
  try {
    if (!(await initGPU())) return;
    for (const k of Object.keys(RT)) delete RT[k];
    for (const k of Object.keys(RES)) delete RES[k];
    GPU.bglCache.clear(); GPU.gen++;
    TIER = pickTier();
    timerInit();
    buildStatic();
    buildPipelines();
    allocTargets();
    GPU.ready = true; S.resetDt = true;
    console.log(`[海港夕煙] adapter=${GPU.adapterName} | ${GPU.glName} | 軟體渲染=${GPU.software} | 畫質=${TIER.name} | features=${GPU.features.join(',')}`);
    if (!isRestart) {
      initInput();
      if (CFG.shot) { S.frozen = true; S.simTime = 40; S.userActed = true; }
      if (CFG.selftest) runSelftest();
      requestAnimationFrame(rafLoop);
    }
  } catch (e) {
    reportError('[start] ' + (e.stack || e));
    fail('啟動時發生錯誤，畫面無法顯示。<br>請改用最新版的 Chrome 或 Edge，或 Safari 26 以上的版本。', String(e && e.message || e));
  }
}
new ResizeObserver(() => { S.resizePending = true; }).observe(canvas);
start(false);
</script>
