<script type="text/wgsl" id="common">
// ── common：每幀 uniform、取樣器、小工具 ──
// 注意：uniform struct 只用 vec4f 與 mat4x4f（都對齊 16 bytes），JS 端會解析這個 struct 自動算位移。
struct Frame {
  viewProj: mat4x4f,
  prevViewProj: mat4x4f,
  camPos: vec4f,     // xyz 世界座標（m），w = near
  camRight: vec4f,   // xyz，w = tan(水平視角/2)
  camUp: vec4f,      // xyz，w = tan(垂直視角/2)
  camFwd: vec4f,     // xyz，w 預留
  viewport: vec4f,   // 內部解析度 w, h, 1/w, 1/h
  sunDir: vec4f,     // xyz 指向太陽，w = 太陽高度角（rad）
  sunIllum: vec4f,   // rgb 地面的太陽照度，w = 夜間係數 0..1
  time: vec4f,       // x 模擬時間（s），y 幀序號，z 分析模式係數 0..1，w 預留
  shadowVP: array<mat4x4f, 4>,   // 各 cascade 的光空間矩陣
  shadowSplit: vec4f,            // 各 cascade 的最遠視距（m）
  shadowTexel: vec4f,            // 各 cascade 一個 texel 的世界大小（m）
  shadowPrm: vec4f,              // x cascade 數，y 解析度，z 濾波半徑（texel），w 預留
  shadowDir: vec4f,              // 陰影用的光方向（高度角有下限）
};
// 大氣參數（長度單位：公里）
struct Atmo {
  rayleigh: vec4f,   // rgb 海平面散射係數 [/km]，w = 尺度高 [km]
  mie: vec4f,        // x 散射、y 吸收 [/km]，z 尺度高 [km]，w 相位函數 g
  ozone: vec4f,      // rgb 吸收係數 [/km]
  haze: vec4f,       // 近地霾：x 散射、w 吸收 [/km]，y 尺度高 [km]
  sunE: vec4f,       // rgb 大氣層頂的太陽照度（相對單位），w = 太陽視半徑 [rad]
  misc: vec4f,       // x 地面反照率，y 相機高度 [km]，z 雲量 0..1，w 日面輝度上限
};
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var sLin: sampler;
@group(0) @binding(2) var sRep: sampler;
@group(0) @binding(3) var sNear: sampler; // @nonfiltering
@group(0) @binding(4) var<uniform> A: Atmo;
@group(0) @binding(5) var sShadow: sampler_comparison;

const PI: f32 = 3.14159265358979;
const TAU: f32 = 6.28318530717959;
const MAP_HALF: f32 = 12000.0;   // 地形圖涵蓋 ±12 km（要和 JS 的 WORLD.half 一致）

fn saturate(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn sat3(x: vec3f) -> vec3f { return clamp(x, vec3f(0.0), vec3f(1.0)); }
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }

// 整數雜湊（PCG 風格）→ [0,1)
fn hashU(x: u32) -> u32 {
  var v = x * 747796405u + 2891336453u;
  let w = ((v >> ((v >> 28u) + 4u)) ^ v) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hash21(p: vec2f) -> f32 {
  let q = vec2u(vec2i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y))) * (1.0 / 4294967296.0);
}
fn hash31(p: vec3f) -> f32 {
  let q = vec3u(vec3i(floor(p)));
  return f32(hashU(q.x ^ hashU(q.y ^ hashU(q.z)))) * (1.0 / 4294967296.0);
}
// Interleaved Gradient Noise（Jimenez 2014）：搭配每幀位移，時間累積後接近 blue noise
fn ign(pix: vec2f, frame: f32) -> f32 {
  let p = pix + 5.588238 * (frame % 64.0);
  return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715))));
}
// 從螢幕 uv（左上原點）取得世界空間視線方向（未正規化，沿 camFwd 的分量為 1）
fn viewRay(uv: vec2f) -> vec3f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  return F.camFwd.xyz + F.camRight.xyz * (ndc.x * F.camRight.w) + F.camUp.xyz * (ndc.y * F.camUp.w);
}
// reversed-Z 無限遠投影：深度值 → 沿 camFwd 的線性距離（m）
fn linDepth(d: f32) -> f32 { return F.camPos.w / max(d, 1e-9); }
</script>

<script type="text/wgsl" id="fullscreen">
// ── fullscreen：一個涵蓋整個畫面的三角形 ──
struct FSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> FSOut {
  var o: FSOut;
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
</script>

<script type="text/wgsl" id="atmo_fn">
// ── atmo_fn：大氣介質與查表座標（Hillaire 2020；長度單位公里）。不存取貼圖 ──
const RG: f32 = 6360.0;     // 地球半徑
const RTOP: f32 = 6460.0;   // 大氣頂
// 射線與球（球心在原點）的兩個交點距離；沒有交點回傳 (-1,-1)
fn raySphere(ro: vec3f, rd: vec3f, rad: f32) -> vec2f {
  let b = dot(ro, rd);
  let c = dot(ro, ro) - rad * rad;
  let h = b * b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h);
  return vec2f(-b - s, -b + s);
}
struct Medium { scatR: vec3f, scatM: f32, ext: vec3f };
fn medium(h: f32) -> Medium {
  let dR = exp(-h / A.rayleigh.w);
  let dM = exp(-h / A.mie.z);
  let dH = exp(-h / A.haze.y);
  let dO = max(0.0, 1.0 - abs(h - 25.0) / 15.0);
  var m: Medium;
  m.scatR = A.rayleigh.rgb * dR;
  m.scatM = A.mie.x * dM + A.haze.x * dH;
  m.ext = m.scatR + vec3f(m.scatM + A.mie.y * dM + A.haze.w * dH) + A.ozone.rgb * dO;
  return m;
}
fn phaseR(c: f32) -> f32 { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
fn phaseM(c: f32, g: f32) -> f32 {   // Cornette-Shanks
  let g2 = g * g;
  return 3.0 / (8.0 * PI) * (1.0 - g2) * (1.0 + c * c) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
fn hg(c: f32, g: f32) -> f32 {       // Henyey-Greenstein
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
// transmittance LUT 參數化（Bruneton）：(r, mu) ↔ uv
fn transUv(r: f32, mu: f32) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = sqrt(max(r * r - RG * RG, 0.0));
  let disc = r * r * (mu * mu - 1.0) + RTOP * RTOP;
  let d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  let dmin = RTOP - r;
  let dmax = rho + H;
  return vec2f((d - dmin) / (dmax - dmin), rho / H);
}
fn transUvToRMu(uv: vec2f) -> vec2f {
  let H = sqrt(RTOP * RTOP - RG * RG);
  let rho = H * uv.y;
  let r = sqrt(rho * rho + RG * RG);
  let dmin = RTOP - r;
  let dmax = rho + H;
  let d = dmin + uv.x * (dmax - dmin);
  var mu = 1.0;
  if (d > 0.0) { mu = (H * H - rho * rho - d * d) / (2.0 * r * d); }
  return vec2f(r, clamp(mu, -1.0, 1.0));
}
</script>

<script type="text/wgsl" id="atmo_lut_fn">
// ── atmo_lut_fn：查 transmittance LUT（需要先宣告 transLUT）──
fn transmittance(r: f32, mu: f32) -> vec3f {
  let uv = transUv(r, mu);
  return textureSampleLevel(transLUT, sLin, (uv * vec2f(255.0, 63.0) + 0.5) / vec2f(256.0, 64.0), 0.0).rgb;
}
// 從半徑 r 的點看太陽（天頂角餘弦 mu）的透射率；被地球擋住時為 0
fn transToSun(r: f32, mu: f32) -> vec3f {
  let hc = -sqrt(max(1.0 - (RG / r) * (RG / r), 0.0));
  return transmittance(r, mu) * smoothstep(-0.004, 0.004, mu - hc);
}
</script>

<script type="text/wgsl" id="lut_trans">
// ── lut_trans：transmittance LUT（256×64）──
#include common
#include fullscreen
#include atmo_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(255.0, 63.0);
  let rm = transUvToRMu(uv);
  let ro = vec3f(0.0, rm.x, 0.0);
  let rd = vec3f(sqrt(max(1.0 - rm.y * rm.y, 0.0)), rm.y, 0.0);
  let tTop = raySphere(ro, rd, RTOP).y;
  var od = vec3f(0.0);
  let N = 48;
  for (var i = 0; i < N; i++) {   // 取樣點往起點加密（近地霾的尺度高很小）
    let a = f32(i) / f32(N);
    let b = f32(i + 1) / f32(N);
    let t0 = a * a * tTop;
    let t1 = b * b * tTop;
    let p = ro + rd * (0.5 * (t0 + t1));
    od += medium(max(length(p) - RG, 0.0)).ext * (t1 - t0);
  }
  return vec4f(exp(-od), 1.0);
}
</script>

<script type="text/wgsl" id="lut_ms">
// ── lut_ms：多重散射 LUT（32×32；u = 太陽天頂角餘弦，v = 高度）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
#include atmo_lut_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / 31.0;
  let muS = uv.x * 2.0 - 1.0;
  let r = RG + 0.01 + uv.y * (RTOP - RG - 0.02);
  let sun = vec3f(sqrt(max(1.0 - muS * muS, 0.0)), muS, 0.0);
  let ro = vec3f(0.0, r, 0.0);
  var L2 = vec3f(0.0);
  var fms = vec3f(0.0);
  let SQ = 8;
  let NS = 20;
  for (var i = 0; i < SQ; i++) {
    for (var j = 0; j < SQ; j++) {
      let th = TAU * (f32(i) + 0.5) / f32(SQ);
      let cph = 1.0 - 2.0 * (f32(j) + 0.5) / f32(SQ);
      let sph = sqrt(max(1.0 - cph * cph, 0.0));
      let rd = vec3f(sph * cos(th), cph, sph * sin(th));
      let tg = raySphere(ro, rd, RG);
      var tMax = raySphere(ro, rd, RTOP).y;
      let hit = tg.x > 0.0;
      if (hit) { tMax = tg.x; }
      var T = vec3f(1.0);
      var Li = vec3f(0.0);
      var Lf = vec3f(0.0);
      let dt = tMax / f32(NS);
      for (var s = 0; s < NS; s++) {
        let p = ro + rd * ((f32(s) + 0.3) * dt);
        let rr = length(p);
        let m = medium(max(rr - RG, 0.0));
        let sT = exp(-m.ext * dt);
        let scat = m.scatR + vec3f(m.scatM);
        let Ts = transToSun(rr, dot(p / rr, sun));
        let S = Ts * scat * (1.0 / (4.0 * PI));
        Li += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
        Lf += T * (scat - scat * sT) / max(m.ext, vec3f(1e-7));
        T *= sT;
      }
      if (hit) {   // 地面反射的一次散射
        let pg = ro + rd * tMax;
        let n = normalize(pg);
        let nl = saturate(dot(n, sun));
        Li += T * transToSun(RG + 0.001, dot(n, sun)) * nl * A.misc.x / PI;
      }
      L2 += Li;
      fms += Lf;
    }
  }
  let inv = 1.0 / f32(SQ * SQ);
  L2 *= inv;
  fms *= inv;
  return vec4f(L2 / (vec3f(1.0) - fms), 1.0);
}
</script>

<script type="text/wgsl" id="sky_lut_map">
// ── sky_lut_map：sky-view LUT 的方向 ↔ uv（緯度在地平線附近加密；方位相對太陽、左右對稱）──
const SKY_W: f32 = 192.0;
const SKY_H: f32 = 108.0;
fn skyHorizon() -> vec2f {   // (zenith 到地平線的角度, beta)
  let r = RG + A.misc.y;
  let beta = acos(clamp(sqrt(max(r * r - RG * RG, 0.0)) / r, 0.0, 1.0));
  return vec2f(PI - beta, beta);
}
fn skyUv(dir: vec3f) -> vec2f {
  let hz = skyHorizon();
  let ang = acos(clamp(dir.y, -1.0, 1.0));
  var v: f32;
  if (ang < hz.x) { v = (1.0 - sqrt(max(1.0 - ang / hz.x, 0.0))) * 0.5; }
  else { v = sqrt(saturate((ang - hz.x) / hz.y)) * 0.5 + 0.5; }
  let dh = dir.xz / max(length(dir.xz), 1e-5);
  let sh = F.sunDir.xz / max(length(F.sunDir.xz), 1e-5);
  let u = acos(clamp(dot(dh, sh), -1.0, 1.0)) / PI;
  return vec2f((u * (SKY_W - 1.0) + 0.5) / SKY_W, (v * (SKY_H - 1.0) + 0.5) / SKY_H);
}
</script>

<script type="text/wgsl" id="lut_sky">
// ── lut_sky：sky-view LUT（192×108，每幀更新）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var msLUT: texture_2d<f32>;
#include atmo_lut_fn
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let uv = (in.pos.xy - 0.5) / vec2f(SKY_W - 1.0, SKY_H - 1.0);
  let hz = skyHorizon();
  var ang: f32;
  if (uv.y < 0.5) { var c = 1.0 - 2.0 * uv.y; c = 1.0 - c * c; ang = hz.x * c; }
  else { var c = uv.y * 2.0 - 1.0; c = c * c; ang = hz.x + hz.y * c; }
  let phi = uv.x * PI;
  let rd = vec3f(sin(ang) * cos(phi), cos(ang), sin(ang) * sin(phi));
  let el = F.sunDir.w;
  let sun = vec3f(cos(el), sin(el), 0.0);
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let tg = raySphere(ro, rd, RG);
  var tMax = raySphere(ro, rd, RTOP).y;
  if (tg.x > 0.0) { tMax = tg.x; }
  let cosT = dot(rd, sun);
  let pR = phaseR(cosT);
  let pM = phaseM(cosT, A.mie.w);
  var T = vec3f(1.0);
  var L = vec3f(0.0);
  let N = 32;
  for (var i = 0; i < N; i++) {
    var t0 = f32(i) / f32(N);
    var t1 = f32(i + 1) / f32(N);
    t0 = t0 * t0; t1 = t1 * t1;
    let t = tMax * (t0 + (t1 - t0) * 0.3);
    let dt = tMax * (t1 - t0);
    let p = ro + rd * t;
    let rr = length(p);
    let m = medium(max(rr - RG, 0.0));
    let sT = exp(-m.ext * dt);
    let muS = dot(p / rr, sun);
    let Ts = transToSun(rr, muS);
    let ms = textureSampleLevel(msLUT, sLin, vec2f(muS * 0.5 + 0.5, saturate((rr - RG) / (RTOP - RG))), 0.0).rgb;
    let S = A.sunE.rgb * (Ts * (m.scatR * pR + vec3f(m.scatM * pM)) + ms * (m.scatR + vec3f(m.scatM)));
    L += T * (S - S * sT) / max(m.ext, vec3f(1e-7));
    T *= sT;
  }
  return vec4f(L, 1.0);
}
</script>

<script type="text/wgsl" id="amb_cube">
// ── amb_cube：天空環境光（6 個軸向的餘弦加權平均輝度，6×1）──
#include common
#include fullscreen
#include atmo_fn
@group(1) @binding(0) var skyLUT: texture_2d<f32>;
#include sky_lut_map
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let k = i32(in.pos.x);
  var n = vec3f(1.0, 0.0, 0.0);
  if (k == 1) { n = vec3f(-1.0, 0.0, 0.0); }
  if (k == 2) { n = vec3f(0.0, 1.0, 0.0); }
  if (k == 3) { n = vec3f(0.0, -1.0, 0.0); }
  if (k == 4) { n = vec3f(0.0, 0.0, 1.0); }
  if (k == 5) { n = vec3f(0.0, 0.0, -1.0); }
  let t = normalize(cross(n, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(n.y) > 0.5)));
  let b = cross(n, t);
  var acc = vec3f(0.0);
  let N = 64;
  for (var i = 0; i < N; i++) {
    let u = (f32(i) + 0.5) / f32(N);
    let ph = TAU * fract(f32(i) * 0.61803399);
    let ct = sqrt(1.0 - u);
    let st = sqrt(u);
    var d = t * (st * cos(ph)) + b * (st * sin(ph)) + n * ct;
    var w = 1.0;
    if (d.y < 0.0) { d.y = 0.02; d = normalize(d); w = 0.3; }   // 地平線以下：用地平線天色的 0.3 倍近似地面反光
    acc += textureSampleLevel(skyLUT, sLin, skyUv(d), 0.0).rgb * w;
  }
  return vec4f(acc / f32(N), 1.0);
}
</script>

<script type="text/wgsl" id="scene_tex">
// ── scene_tex：場景共用貼圖（group 1）。產生這些貼圖的 pass 不能 include 這個模組 ──
@group(1) @binding(0) var transLUT: texture_2d<f32>;
@group(1) @binding(1) var msLUT: texture_2d<f32>;
@group(1) @binding(2) var skyLUT: texture_2d<f32>;
@group(1) @binding(3) var ambCube: texture_2d<f32>;
@group(1) @binding(4) var noise2D: texture_2d<f32>;
@group(1) @binding(5) var heightTex: texture_2d<f32>; // @unfilterable
@group(1) @binding(6) var normalTex: texture_2d<f32>;
@group(1) @binding(7) var macroTex: texture_2d<f32>;
@group(1) @binding(8) var shadowMap: texture_depth_2d_array;
</script>

<script type="text/wgsl" id="sky_fn">
// ── sky_fn：天空顏色（LUT＋雲＋日面＋星）與環境光。需要 scene_tex、atmo_fn、atmo_lut_fn、sky_lut_map ──
fn skyLutSample(dir: vec3f) -> vec3f {
  return textureSampleLevel(skyLUT, sLin, skyUv(dir), 0.0).rgb;
}
// 天空環境光：依法線在 6 個軸向之間內插（ambient cube）
fn ambient(n: vec3f) -> vec3f {
  let n2 = n * n;
  let ix = select(1, 0, n.x >= 0.0);
  let iy = select(3, 2, n.y >= 0.0);
  let iz = select(5, 4, n.z >= 0.0);
  return n2.x * textureLoad(ambCube, vec2i(ix, 0), 0).rgb + n2.y * textureLoad(ambCube, vec2i(iy, 0), 0).rgb
       + n2.z * textureLoad(ambCube, vec2i(iz, 0), 0).rgb;
}
// 一層薄雲。回傳 (rgb 顏色, a 遮蔽量)
fn cloudLayer(dir: vec3f, altKm: f32, scale: vec2f, drift: vec2f, cover: f32, soft: f32) -> vec4f {
  let r = RG + A.misc.y;
  let ro = vec3f(0.0, r, 0.0);
  let t = raySphere(ro, dir, RG + altKm).y;
  if (dir.y <= 0.002 || t <= 0.0) { return vec4f(0.0); }
  let w = F.camPos.xz * 0.001 + dir.xz * t;
  let uv = w * scale + drift * (F.time.x * 0.0004);
  let n1 = textureSampleLevel(noise2D, sRep, uv, 0.0);
  let n2 = textureSampleLevel(noise2D, sRep, uv * 3.3 + n1.gr * 0.12, 0.0);
  let n3 = textureSampleLevel(noise2D, sRep, uv * 11.0 + n2.rg * 0.05, 0.0);
  var d = n1.r * 0.62 + n2.g * 0.28 + n3.r * 0.10;
  d = smoothstep(1.0 - cover, 1.0 - cover + soft, d);
  if (d <= 0.0) { return vec4f(0.0); }
  // 雲的位置看太陽：越晚越紅，被地球擋住就暗掉
  let pc = ro + dir * t;
  let rc = length(pc);
  let sunL = normalize(vec3f(F.sunDir.x, F.sunDir.y, F.sunDir.z));
  let muS = dot(pc / rc, sunL);
  let sunC = A.sunE.rgb * transToSun(rc, muS);
  let cosS = dot(dir, sunL);
  let fwd = hg(cosS, 0.72) * 3.0 + hg(cosS, 0.25) * 2.0 + 0.10;
  let thin = 1.0 - 0.75 * d;                     // 厚的地方自己遮光
  let amb = skyLutSample(vec3f(0.0, 1.0, 0.0)) * 1.6 + skyLutSample(normalize(vec3f(dir.x, 0.25, dir.z))) * 0.5;
  let col = sunC * fwd * thin * 0.55 + amb * (0.35 + 0.4 * d);
  // 相機到雲之間的透射率：T(相機, 方向) / T(雲, 方向)
  let Tv = transmittance(r, dir.y) / max(transmittance(rc, dot(pc / rc, dir)), vec3f(1e-4));
  let fade = saturate(luma(Tv) * 1.15) * smoothstep(0.002, 0.05, dir.y);
  return vec4f(col, d * fade);
}
fn stars(dir: vec3f) -> f32 {
  let p = dir * 220.0;
  let id = floor(p);
  let h = hash31(id + 500.0);
  if (h < 0.992) { return 0.0; }
  let c = id + 0.5 + (vec3f(hash31(id + 11.0), hash31(id + 23.0), hash31(id + 37.0)) - 0.5) * 0.6;
  let d = length(p - c);
  return smoothstep(0.42, 0.0, d) * (0.3 + 3.0 * pow(hash31(id + 71.0), 6.0));
}
fn skyColor(dir: vec3f, withSun: f32) -> vec3f {
  var L = skyLutSample(dir);
  let night = F.sunIllum.w;
  // 夜空底色（大氣輝光＋月光散射的近似）與地平線的城市光害
  let hor = 1.0 - saturate(dir.y);
  L += vec3f(0.010, 0.016, 0.034) * night * (0.35 + 0.65 * hor * hor) * 0.012;
  L += vec3f(1.0, 0.62, 0.30) * night * pow(hor, 10.0) * 0.00045;
  if (dir.y > -0.02) {
    L += vec3f(0.9, 0.95, 1.0) * stars(dir) * night * 0.0035 * smoothstep(0.0, 0.25, dir.y);
    let cov = A.misc.z;
    // 高層卷雲（拉長）與中層碎雲
    let c1 = cloudLayer(dir, 9.5, vec2f(0.012, 0.034), vec2f(0.6, 0.2), cov * 0.62, 0.42);
    L = mix(L, c1.rgb, c1.a * 0.85);
    let c2 = cloudLayer(dir, 4.2, vec2f(0.045, 0.060), vec2f(1.0, -0.4), cov * 0.50, 0.22);
    L = mix(L, c2.rgb, c2.a * 0.92);
  }
  // 日面（含周邊減光）；輝度有上限，避免 bloom 失控
  let sunL = F.sunDir.xyz;
  let ang = length(cross(dir, sunL));
  let rad = A.sunE.w;
  if (withSun > 0.0 && dot(dir, sunL) > 0.0 && ang < rad * 1.6) {
    let r = RG + A.misc.y;
    let x = saturate(ang / rad);
    let limb = 1.0 - 0.55 * (1.0 - sqrt(max(1.0 - x * x, 0.0)));
    let disc = smoothstep(rad * 1.04, rad * 0.94, ang);
    let Ls = A.sunE.rgb * transToSun(r, dir.y) / (PI * rad * rad);
    L += min(Ls * limb, vec3f(A.misc.w)) * disc * withSun;
  }
  return L;
}
</script>

<script type="text/wgsl" id="sky">
// ── sky：主場景裡的天空（畫在最遠處）──
#include common
#include fullscreen
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let rd = normalize(viewRay(in.uv));
  return vec4f(skyColor(rd, 1.0), 1.0);
}
</script>

<script type="text/wgsl" id="terrain_gen">
// ── terrain_gen：啟動時產生一次高度圖（r32float）。macroTex 由 JS 依場景配置畫出：
//    R＝基準高度（m，水域為負）、G＝丘陵量、B＝鋪面、A＝市鎮 ──
#include common
#include fullscreen
@group(1) @binding(0) var macroTex: texture_2d<f32>;
fn grad2(p: vec2f) -> vec2f {
  let a = hash21(p + 4096.0) * TAU;
  return vec2f(cos(a), sin(a));
}
fn gnoise(p: vec2f) -> f32 {   // 梯度雜訊，約 −1..1
  let i = floor(p);
  let f = p - i;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(grad2(i), f);
  let b = dot(grad2(i + vec2f(1.0, 0.0)), f - vec2f(1.0, 0.0));
  let c = dot(grad2(i + vec2f(0.0, 1.0)), f - vec2f(0.0, 1.0));
  let d = dot(grad2(i + vec2f(1.0, 1.0)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y) * 1.4;
}
fn fbm(p0: vec2f, oct: i32) -> f32 {
  var p = p0;
  var s = 0.0;
  var a = 0.5;
  for (var i = 0; i < oct; i++) {
    s += a * gnoise(p);
    p = mat2x2f(1.6, 1.2, -1.2, 1.6) * p;
    a *= 0.5;
  }
  return s;
}
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let p = (in.uv - 0.5) * (2.0 * MAP_HALF);
  let m = textureSampleLevel(macroTex, sLin, in.uv, 0.0);
  var h = m.r;
  // 丘陵：domain-warped FBM＋脊狀起伏
  let q = p / 2100.0 + vec2f(37.0, 91.0);
  let w = vec2f(fbm(q + vec2f(1.7, 9.2), 4), fbm(q + vec2f(8.3, 2.8), 4));
  let n = fbm(q + 0.8 * w, 8);
  let rdg = 1.0 - abs(fbm(q * 1.9 + w * 0.6 + vec2f(5.0, 3.0), 6));
  let e = saturate(0.5 + 0.9 * n);
  h += m.g * (20.0 + 230.0 * pow(e, 1.5) + 50.0 * rdg * rdg * e);
  // 自然地表的小起伏（鋪面區保持平整）
  let land = smoothstep(0.5, 3.0, m.r);
  h += land * (1.0 - m.b) * (1.0 - m.g) * (1.5 + 2.5 * fbm(p / 160.0, 4));
  h += (1.0 - land) * 0.8 * fbm(p / 90.0, 3);
  return vec4f(h, 0.0, 0.0, 1.0);
}
</script>

<script type="text/wgsl" id="terrain_fn">
// ── terrain_fn：查高度圖（r32float 不能用線性取樣器，手動雙線性）。需要 scene_tex ──
fn mapUv(xz: vec2f) -> vec2f { return xz / (2.0 * MAP_HALF) + 0.5; }
fn terrainH(xz: vec2f, mip: i32) -> f32 {
  let dim = vec2i(textureDimensions(heightTex, mip));
  let t = mapUv(xz) * vec2f(dim) - 0.5;
  let fl = floor(t);
  let i = vec2i(fl);
  let f = t - fl;
  let mx = dim - vec2i(1);
  let a = textureLoad(heightTex, clamp(i, vec2i(0), mx), mip).r;
  let b = textureLoad(heightTex, clamp(i + vec2i(1, 0), vec2i(0), mx), mip).r;
  let c = textureLoad(heightTex, clamp(i + vec2i(0, 1), vec2i(0), mx), mip).r;
  let d = textureLoad(heightTex, clamp(i + vec2i(1, 1), vec2i(0), mx), mip).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
</script>

<script type="text/wgsl" id="lighting">
// ── lighting：不透明表面的光照（太陽＋天空環境光）。需要 sky_fn ──
struct Surf { pos: vec3f, n: vec3f, albedo: vec3f, rough: f32, metal: f32, ao: f32, emis: vec3f };
// 太陽陰影：cascaded shadow maps＋旋轉 Poisson 取樣的 PCF（SHADOW_TAPS 由畫質等級決定）
fn sunShadow(pos: vec3f, n: vec3f) -> f32 {
  let nc = i32(F.shadowPrm.x);
  let vd = dot(pos - F.camPos.xyz, F.camFwd.xyz);
  var ci = nc;
  for (var i = nc - 1; i >= 0; i--) { if (vd < F.shadowSplit[i]) { ci = i; } }
  if (ci >= nc) { return 1.0; }
  let tex = F.shadowTexel[ci];
  let p = pos + n * (tex * 1.8) + F.shadowDir.xyz * (tex * 1.2);
  let sp = F.shadowVP[ci] * vec4f(p, 1.0);
  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) { return 1.0; }
  var pd = array<vec2f, 16>(
    vec2f(-0.94, -0.40), vec2f(0.95, -0.77), vec2f(-0.09, -0.93), vec2f(0.34, 0.29), vec2f(-0.92, 0.46), vec2f(-0.82, -0.88), vec2f(-0.38, 0.28), vec2f(0.97, 0.76),
    vec2f(0.44, -0.98), vec2f(0.54, 0.99), vec2f(-0.26, -0.42), vec2f(0.79, 0.19), vec2f(-0.24, 1.00), vec2f(-0.81, 0.91), vec2f(0.02, -0.51), vec2f(0.14, -0.14));
  let a = hash21(floor(pos.xz * 3.0) + floor(pos.y * 3.0) * 17.0) * TAU;
  let cs = cos(a); let sn = sin(a);
  let rad = F.shadowPrm.z / F.shadowPrm.y;
  var s = 0.0;
  for (var i = 0; i < SHADOW_TAPS; i++) {
    let o = vec2f(pd[i].x * cs - pd[i].y * sn, pd[i].x * sn + pd[i].y * cs) * rad;
    s += textureSampleCompareLevel(shadowMap, sShadow, uv + o, ci, sp.z);
  }
  s /= f32(SHADOW_TAPS);
  // 最後一層的遠端淡出
  if (ci == nc - 1) { s = mix(s, 1.0, smoothstep(0.85, 1.0, vd / F.shadowSplit[ci])); }
  return s;
}
fn shade(s: Surf, V: vec3f) -> vec3f {
  let L = F.sunDir.xyz;
  let nl = saturate(dot(s.n, L));
  let H = normalize(L + V);
  let nh = saturate(dot(s.n, H));
  let nv = max(dot(s.n, V), 1e-3);
  let vh = saturate(dot(V, H));
  let a = max(s.rough * s.rough, 0.02);
  let a2 = a * a;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let k = a * 0.5;
  let Vis = 0.25 / ((nl * (1.0 - k) + k) * (nv * (1.0 - k) + k));
  let F0 = mix(vec3f(0.04), s.albedo, s.metal);
  let Fr = F0 + (vec3f(1.0) - F0) * pow(1.0 - vh, 5.0);
  let diff = s.albedo * (1.0 - s.metal) / PI;
  var col = vec3f(0.0);
  if (nl > 0.0) { col = (diff + D * Vis * Fr) * F.sunIllum.rgb * nl * sunShadow(s.pos, s.n); }
  col += s.albedo * (1.0 - s.metal) * ambient(s.n) * s.ao;
  col += F0 * ambient(reflect(-V, s.n)) * s.metal * s.ao * (1.0 - 0.5 * s.rough);
  return col + s.emis;
}
</script>

<script type="text/wgsl" id="terrain">
// ── terrain：以相機為中心的 clipmap 環；外緣用 CDLOD 式 morph 接到粗一層，沒有裂縫 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
struct TerrainU {
  levels: array<vec4f, 10>,   // xy＝中心 xz（已對齊格點），z＝格距（m），w＝高度圖 mip
  inner: array<vec4f, 10>,    // 細一層涵蓋的範圍 xmin, zmin, xmax, zmax（這個範圍內不畫）
  prm: vec4f,                 // x＝每邊格數 N，y＝層數
};
@group(2) @binding(0) var<uniform> T: TerrainU;
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) @interpolate(flat) lvl: u32 };
@vertex fn vs(@location(0) g: vec2f, @builtin(instance_index) inst: u32) -> VOut {
  let L = T.levels[inst];
  let Lc = T.levels[min(inst + 1u, u32(T.prm.y) - 1u)];
  let N = T.prm.x;
  let rel = g - N * 0.5;
  let d = max(abs(rel.x), abs(rel.y)) / (N * 0.5);
  let k = smoothstep(0.70, 0.90, d);
  let odd = fract(g * 0.5) * 2.0;          // 奇數格點在外緣併到相鄰的偶數格點（＝粗一層的格點）
  let xz = L.xy + (rel - odd * k) * L.z;
  let h = mix(terrainH(xz, i32(L.w)), terrainH(xz, i32(Lc.w)), k);
  var o: VOut;
  o.wp = vec3f(xz.x, h, xz.y);
  o.pos = F.viewProj * vec4f(o.wp, 1.0);
  o.lvl = inst;
  return o;
}
@fragment fn fs(in: VOut) -> @location(0) vec4f {
  let uv = mapUv(in.wp.xz);
  let nt = textureSample(normalTex, sLin, uv);
  let nz = textureSample(noise2D, sRep, in.wp.xz / 420.0);
  let nz2 = textureSample(noise2D, sRep, in.wp.xz / 61.0);
  let dn1 = textureSample(noise2D, sRep, in.wp.xz / 128.0).rg - 0.5;
  let dn2 = textureSample(noise2D, sRep, in.wp.xz / 13.0).gr - 0.5;
  if (in.lvl > 0u) {
    let r = T.inner[in.lvl];
    if (in.wp.x > r.x && in.wp.z > r.y && in.wp.x < r.z && in.wp.z < r.w) { discard; }
  }
  let mac = textureSampleLevel(macroTex, sLin, uv, 0.0);
  var n = normalize(nt.xyz * 2.0 - 1.0);
  let slope = 1.0 - n.y;
  let paved = smoothstep(0.35, 0.65, mac.b);
  let city = smoothstep(0.4, 0.7, mac.a) * (1.0 - paved);
  let h = in.wp.y;
  // 自然地表：草地 → 樹林（丘陵）→ 陡坡露岩 → 岸邊沙地
  let grass = mix(vec3f(0.085, 0.105, 0.045), vec3f(0.17, 0.165, 0.075), nz.r);
  let forest = mix(vec3f(0.028, 0.052, 0.022), vec3f(0.065, 0.092, 0.036), nz2.g);
  let rock = mix(vec3f(0.20, 0.175, 0.15), vec3f(0.31, 0.28, 0.245), nz2.r);
  var alb = mix(grass, forest, smoothstep(0.12, 0.55, mac.g + (nz.g - 0.5) * 0.5));
  alb = mix(alb, rock, smoothstep(0.30, 0.55, slope + (nz2.r - 0.5) * 0.2));
  alb = mix(alb, vec3f(0.40, 0.35, 0.27), smoothstep(2.4, 0.7, h) * (1.0 - paved));
  // 鋪面（混凝土、柏油）與市鎮地面
  let conc = mix(vec3f(0.17, 0.17, 0.165), vec3f(0.27, 0.265, 0.25), nz2.r * 0.7 + nz.g * 0.3);
  alb = mix(alb, conc, paved);
  alb = mix(alb, mix(vec3f(0.11, 0.11, 0.115), vec3f(0.21, 0.20, 0.19), nz2.g), city);
  alb = mix(vec3f(0.07, 0.08, 0.065), alb, smoothstep(-1.2, 0.4, h));   // 水面下的海床
  let rough = (1.0 - paved) * (1.0 - city);
  n = normalize(n + vec3f(dn1.x, 0.0, dn1.y) * (0.06 + 1.0 * rough) + vec3f(dn2.x, 0.0, dn2.y) * (0.05 + 0.3 * rough));
  var s: Surf;
  s.pos = in.wp; s.n = n; s.albedo = alb; s.rough = 0.92; s.metal = 0.0; s.ao = 1.0; s.emis = vec3f(0.0);
  return vec4f(shade(s, normalize(F.camPos.xyz - in.wp)), 1.0);
}
</script>

<script type="text/wgsl" id="water">
// ── water：海面與港內水面。位置由視線與 y=0 平面的交點算出；法線是多層方向波，
//    解析不到的小波依距離轉成粗糙度（斜率變異數），太陽光帶才會穩定不閃 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
struct WOut { @builtin(position) pos: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> WOut {
  let c = vec2f(f32(i & 1u), f32((i >> 1u) & 1u)) * 2.0 - 1.0;
  let xz = F.camPos.xz + c * 90000.0;
  var o: WOut;
  o.pos = F.viewProj * vec4f(xz.x, 0.0, xz.y, 1.0);
  return o;
}
// 一個方向波：回傳 (斜率 x, 斜率 z, 解析不到的斜率變異數)。
// foot＝像素在水面上的涵蓋範圍 (沿視線方向, 垂直視線方向)；掠射角時沿視線方向會拉得很長
fn wave(p: vec2f, t: f32, ang: f32, lam: f32, steep: f32, ph: f32, foot: vec2f, vdir: vec2f) -> vec3f {
  let d = vec2f(cos(ang), sin(ang));
  let k = TAU / lam;
  let w = sqrt(9.81 * k);
  let al = abs(dot(d, vdir));
  let f = sqrt(foot.x * foot.x * al * al + foot.y * foot.y * (1.0 - al * al));
  let res = saturate(lam / (f * 2.5) - 0.7);           // 波長比像素涵蓋範圍大多少 → 還看得出來的比例
  let s = steep * cos(dot(d, p) * k - w * t + ph);
  return vec3f(d * (s * res), 0.5 * steep * steep * (1.0 - res * res));
}
@fragment fn fs(in: WOut) -> @location(0) vec4f {
  let uv = in.pos.xy * F.viewport.zw;
  let rd = normalize(viewRay(uv));
  let ro = F.camPos.xyz;
  let t = -ro.y / min(rd.y, -1e-6);
  let p = ro + rd * t;
  let V = -rd;
  // 像素在水面上涵蓋的大小（m）
  let pix = 2.0 * F.camUp.w * F.viewport.w;
  let foot = vec2f(t * pix / max(-rd.y, 0.004), t * pix);
  let vdir = normalize(rd.xz);
  let mac = textureSampleLevel(macroTex, sLin, mapUv(p.xz), 0.0);
  let depth = -mac.r;
  let sea = smoothstep(10.5, 16.0, depth);            // 0＝港內（平靜），1＝外海
  let tm = F.time.x;
  var acc = vec3f(0.0);
  // 外海：風浪（主波向大致跟西南風一致）
  acc += wave(p.xz, tm, -0.75, 46.0, 0.050 * sea, 0.3, foot, vdir);
  acc += wave(p.xz, tm, -0.35, 27.0, 0.060 * sea, 1.9, foot, vdir);
  acc += wave(p.xz, tm, -1.15, 15.0, 0.070 * sea, 4.1, foot, vdir);
  acc += wave(p.xz, tm, -0.55, 8.3, 0.075 * sea, 2.4, foot, vdir);
  // 細浪（港內也有，但更小）
  let rp = 0.35 + 0.65 * sea;
  acc += wave(p.xz, tm, -0.95, 4.1, 0.075 * rp, 5.2, foot, vdir);
  acc += wave(p.xz, tm, 0.25, 2.3, 0.080 * rp, 0.7, foot, vdir);
  acc += wave(p.xz, tm, -1.6, 1.3, 0.085 * rp, 3.3, foot, vdir);
  acc += wave(p.xz, tm, -0.15, 0.71, 0.085 * rp, 1.1, foot, vdir);
  // 雜訊漣漪（打散規則感）
  let r1 = textureSample(noise2D, sRep, p.xz / 23.0 + vec2f(0.011, -0.007) * tm).rg - 0.5;
  let r2 = textureSample(noise2D, sRep, p.xz / 5.7 + vec2f(-0.023, 0.017) * tm).gr - 0.5;
  let rres = saturate(1.2 - foot.x * 0.25);
  var slope = acc.xy + (r1 * 0.10 + r2 * 0.14 * rres) * rp;
  var sv = acc.z + (0.0012 + 0.0026 * (1.0 - rres)) * rp * rp + 0.0009;
  let N = normalize(vec3f(-slope.x, 1.0, -slope.y));
  let alpha = clamp(sqrt(2.0 * sv), 0.03, 0.5);
  let nv = max(dot(N, V), 0.0);
  // Fresnel（粗糙水面在掠射角的反射率會比鏡面低，用粗糙度往回修正）
  let fres = 0.02 + 0.98 * pow(1.0 - max(nv, alpha * 0.55), 5.0);
  // 天空反射：粗糙時反射方向往上偏
  var R = reflect(rd, N);
  R.y = abs(R.y) + alpha * 0.35;
  R = normalize(R);
  let refl = skyColor(R, 0.0);
  // 太陽高光（GGX；粗糙度來自斜率變異數）
  let L = F.sunDir.xyz;
  let H = normalize(L + V);
  let nh = saturate(dot(N, H));
  let nl = saturate(dot(N, L));
  let a2 = alpha * alpha;
  let dd = nh * nh * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let kk = alpha * 0.5;
  let Vis = 0.25 / ((nl * (1.0 - kk) + kk) * (nv * (1.0 - kk) + kk));
  let Fs = 0.02 + 0.98 * pow(1.0 - saturate(dot(V, H)), 5.0);
  let sh = sunShadow(p, vec3f(0.0, 1.0, 0.0));
  let spec = F.sunIllum.rgb * min(D * Vis * Fs * nl, 60.0) * sh;
  // 水體顏色：港內混濁偏綠褐，外海較深較藍
  let rho = mix(vec3f(0.020, 0.030, 0.024), vec3f(0.006, 0.020, 0.028), sea);
  let Edown = ambient(vec3f(0.0, 1.0, 0.0)) * PI + F.sunIllum.rgb * max(L.y, 0.0) * sh;
  var body = rho * Edown / PI * 3.0;
  // 淺水：透出一點底色；岸邊泡沫
  let hh = terrainH(p.xz, 0);
  let shallow = smoothstep(-2.5, -0.2, hh);
  body = mix(body, vec3f(0.16, 0.15, 0.11) * Edown / PI, shallow * 0.6);
  let fn_ = textureSample(noise2D, sRep, p.xz / 9.0 + vec2f(0.02, 0.013) * tm).b;
  let foam = smoothstep(-0.9, -0.05, hh + (fn_ - 0.6) * 0.8) * (0.3 + 0.7 * sea);
  var col = mix(body, refl, fres) + spec;
  col = mix(col, vec3f(0.55) * Edown / PI, foam * 0.75);
  return vec4f(col, 1.0);
}
</script>

<script type="text/wgsl" id="mesh_io">
// ── mesh_io：設施網格的頂點格式與 instance 變換（主場景與陰影共用）──
struct MIn {
  @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) me: vec2f,     // me＝(材質代號, 額外參數)
  @location(4) r0: vec4f, @location(5) r1: vec4f, @location(6) r2: vec4f,       // instance：3×4 仿射矩陣的三列
  @location(7) col: vec4f,                                                      // instance：rgb 顏色，a＝材質代號（整數部分）＋亂數種子（小數部分）
};
fn instPos(v: MIn) -> vec3f {
  let p = vec4f(v.pos, 1.0);
  return vec3f(dot(v.r0, p), dot(v.r1, p), dot(v.r2, p));
}
fn instScale(v: MIn) -> vec3f {
  return vec3f(length(vec3f(v.r0.x, v.r1.x, v.r2.x)), length(vec3f(v.r0.y, v.r1.y, v.r2.y)), length(vec3f(v.r0.z, v.r1.z, v.r2.z)));
}
</script>

<script type="text/wgsl" id="shadow">
// ── shadow：陰影 pass（只寫深度）。每個 cascade 一個小 uniform 指定要用哪個矩陣 ──
#include common
#include mesh_io
struct CasU { idx: vec4f };
@group(1) @binding(0) var<uniform> C: CasU;
@vertex fn vs(v: MIn) -> @builtin(position) vec4f {
  return F.shadowVP[u32(C.idx.x)] * vec4f(instPos(v), 1.0);
}
</script>

<script type="text/wgsl" id="mesh">
// ── mesh：工業設施（instancing）。材質全部程序生成：依物件自己的座標（公尺）畫色帶、窗格、焊道、鏽痕 ──
#include common
#include atmo_fn
#include scene_tex
#include atmo_lut_fn
#include sky_lut_map
#include sky_fn
#include terrain_fn
#include lighting
#include mesh_io
struct MOut {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f, @location(1) wn: vec3f, @location(2) lp: vec3f, @location(3) ln: vec3f,
  @location(4) @interpolate(flat) mat: f32, @location(5) @interpolate(flat) col: vec4f, @location(6) ex: f32,
};
@vertex fn vs(v: MIn) -> MOut {
  var o: MOut;
  let sc = instScale(v);
  o.wp = instPos(v);
  let nl = v.nrm / (sc * sc);                    // 法線要用逆轉置矩陣（非等比縮放時才正確）
  o.wn = normalize(vec3f(dot(v.r0.xyz, nl), dot(v.r1.xyz, nl), dot(v.r2.xyz, nl)));
  o.lp = v.pos * sc;
  o.ln = v.nrm;
  o.mat = v.me.x; o.ex = v.me.y; o.col = v.col;
  o.pos = F.viewProj * vec4f(o.wp, 1.0);
  return o;
}
fn palette(h: f32) -> vec3f {                    // 貨櫃常見顏色
  var p = array<vec3f, 8>(vec3f(0.40, 0.07, 0.05), vec3f(0.05, 0.15, 0.34), vec3f(0.07, 0.26, 0.15), vec3f(0.58, 0.21, 0.04),
                          vec3f(0.40, 0.41, 0.42), vec3f(0.68, 0.68, 0.66), vec3f(0.05, 0.28, 0.31), vec3f(0.60, 0.47, 0.06));
  return p[u32(clamp(h, 0.0, 0.999) * 8.0)];
}
@fragment fn fs(in: MOut) -> @location(0) vec4f {
  var mat = i32(in.mat + 0.5);
  let seed = fract(in.col.a);
  if (mat == 255) { mat = i32(floor(in.col.a + 0.001)); }
  let ln = normalize(in.ln);
  var n = normalize(in.wn);
  let top = ln.y > 0.7;
  // 面內座標（公尺）：hu 沿牆面水平方向、hv 高度；圓柱面用弧長
  var hu = in.lp.x;
  if (abs(ln.x) > abs(ln.z)) { hu = in.lp.z; }
  let hv = in.lp.y;
  let arc = atan2(in.lp.z, in.lp.x) * max(length(in.lp.xz), 1.0);
  let so = vec2f(seed * 37.0, seed * 91.0);
  let n1 = textureSample(noise2D, sRep, vec2f(hu, hv) / 23.0 + so);
  let n2 = textureSample(noise2D, sRep, vec2f(hu, hv) / 3.3 + so);
  let stk = textureSample(noise2D, sRep, vec2f(hu / 2.7, hv / 70.0) + so);          // 垂直流痕（平面）
  let stc = textureSample(noise2D, sRep, vec2f(arc / 2.7, hv / 70.0) + so);         // 垂直流痕（圓柱面）
  let nt = textureSample(noise2D, sRep, in.lp.xz / 17.0 + so);                       // 頂面
  let night = F.sunIllum.w;
  var s: Surf;
  s.pos = in.wp; s.rough = 0.85; s.metal = 0.0; s.ao = 1.0; s.emis = vec3f(0.0);
  var alb = vec3f(0.3);
  let rust = mix(vec3f(0.20, 0.085, 0.035), vec3f(0.30, 0.15, 0.06), n2.g);
  if (mat == 0) {                                 // 混凝土
    alb = mix(vec3f(0.27, 0.265, 0.25), vec3f(0.40, 0.39, 0.37), n1.r) * (0.9 + 0.2 * n2.r);
    alb *= mix(1.0, 0.62, smoothstep(0.52, 0.75, stk.r));
  } else if (mat == 1) {                          // 油漆鋼材（顏色由 instance 給）
    alb = in.col.rgb * (0.85 + 0.3 * n1.g);
    alb = mix(alb, rust, smoothstep(0.60, 0.74, n1.r * 0.6 + n2.r * 0.4) * 0.8);
    alb *= mix(1.0, 0.7, smoothstep(0.55, 0.8, stk.g));
    s.rough = 0.55;
  } else if (mat == 2) {                          // 煙囪：上半段紅白相間的航空警示色帶，下半段是混凝土原色
    let t = in.ex;
    let conc = mix(vec3f(0.33, 0.32, 0.30), vec3f(0.45, 0.44, 0.41), nt.r * 0.5 + stc.r * 0.5);
    let bt = (t - 0.37) / 0.63 * 7.0;
    let red = fract(bt * 0.5) < 0.5;
    var band = vec3f(0.74, 0.72, 0.68);
    if (red) { band = vec3f(0.52, 0.065, 0.04); }
    let edge = smoothstep(0.0, 0.006, abs(fract(bt + 0.5) - 0.5));
    alb = mix(conc, band * (0.86 + 0.28 * stc.g), step(0.37, t));
    alb *= mix(0.8, 1.0, edge);
    alb *= mix(1.0, 0.55, smoothstep(0.50, 0.78, stc.r) * 0.8);          // 雨水流痕
    alb *= mix(1.0, 0.35, smoothstep(0.955, 1.0, t));                     // 出口附近的煤灰
    s.rough = 0.8;
  } else if (mat == 3 || mat == 16) {             // 建築外牆＋窗（16＝船艛，白色小窗）
    var fl = 3.6; var bay = 3.3;
    if (mat == 16) { fl = 2.8; bay = 2.2; }
    var wall = in.col.rgb * (0.82 + 0.3 * n1.r);
    if (mat == 16) { wall = vec3f(0.74, 0.73, 0.70) * (0.85 + 0.25 * n1.r); }
    wall *= mix(1.0, 0.68, smoothstep(0.55, 0.8, stk.r));
    alb = wall;
    if (top) { alb = vec3f(0.19, 0.19, 0.185) * (0.8 + 0.4 * nt.r); }
    else {
      let cu = fract(hu / bay); let cv = fract(hv / fl);
      let win = step(0.22, cu) * step(cu, 0.78) * step(0.32, cv) * step(cv, 0.80) * step(1.2, hv);
      let id = floor(vec2f(hu / bay, hv / fl)) + vec2f(seed * 977.0, seed * 131.0);
      let h1 = hash21(id);
      if (win > 0.5) {
        alb = vec3f(0.035, 0.045, 0.055);
        s.rough = 0.15;
        let on = step(0.62, h1) * night;                                  // 入夜後部分窗戶亮燈
        let warm = mix(vec3f(1.0, 0.62, 0.28), vec3f(0.80, 0.90, 1.0), step(0.55, hash21(id + 7.0)));
        s.emis = warm * on * (0.006 + 0.012 * hash21(id + 3.0));
      }
    }
  } else if (mat == 4) {                          // 浪板／貨櫃
    var c = in.col.rgb;
    if (in.ex > 0.001 && in.ex < 0.995) { c = palette(hash21(vec2f(floor(in.ex * 255.0 + 0.5), floor(hv / 2.6)) + seed * 100.0)); }
    let rib = sin(hu * TAU / 0.29);
    alb = c * (0.82 + 0.10 * rib + 0.2 * n1.r);
    alb = mix(alb, rust, smoothstep(0.66, 0.80, n1.g * 0.5 + n2.g * 0.5) * 0.7);
    alb *= mix(1.0, 0.72, smoothstep(0.55, 0.8, stk.r));
    if (top) { alb = c * 0.6 * (0.8 + 0.4 * nt.g); }
    s.rough = 0.6;
  } else if (mat == 5) {                          // 深色鋼構、管線
    alb = mix(vec3f(0.13, 0.13, 0.135), vec3f(0.23, 0.22, 0.21), n1.r);
    alb = mix(alb, rust, smoothstep(0.55, 0.72, n1.g) * 0.6);
    s.rough = 0.6; s.metal = 0.5;
  } else if (mat == 6) {                          // 屋頂、甲板
    alb = vec3f(0.17, 0.175, 0.17) * (0.75 + 0.5 * nt.r);
  } else if (mat == 7) {                          // 船殼：水線以下紅色防污漆，上面是船殼色
    let hull = in.col.rgb * (0.8 + 0.3 * n1.r);
    alb = mix(vec3f(0.30, 0.06, 0.045), hull, smoothstep(1.0, 1.25, hv + (n1.g - 0.5) * 0.3));
    alb = mix(alb, rust, smoothstep(0.50, 0.75, stk.r) * 0.55);
    s.rough = 0.5;
  } else if (mat == 8) {                          // 白色儲槽：每 2.4 m 一圈焊道，往下的鏽痕與底部污漬
    alb = vec3f(0.70, 0.69, 0.66) * (0.86 + 0.22 * n1.r);
    let seam = smoothstep(0.035, 0.0, abs(fract(hv / 2.4) - 0.5) * 2.4 - 1.16);
    alb *= 1.0 - 0.28 * seam;
    alb = mix(alb, rust * 1.3, smoothstep(0.56, 0.80, stc.r) * 0.55);
    alb *= mix(0.62, 1.0, smoothstep(0.0, 2.5, hv + n2.r));
    if (top) { alb = vec3f(0.60, 0.59, 0.57) * (0.8 + 0.3 * nt.r); }
    s.rough = 0.45;
  } else if (mat == 9) {                          // 柏油路＋標線
    alb = vec3f(0.045, 0.045, 0.05) * (0.8 + 0.5 * nt.r);
    let w = abs(in.lp.z);
    let dash = step(fract(in.lp.x / 12.0), 0.4) * smoothstep(0.16, 0.10, w);
    alb = mix(alb, vec3f(0.55), max(dash, smoothstep(0.12, 0.06, abs(w - 3.3))) * 0.8 * step(0.7, ln.y));
  } else if (mat == 11) {                         // 自發光（燈具）
    alb = vec3f(0.02);
    s.emis = in.col.rgb * night * 0.4;
  } else if (mat == 12) {                         // 黑（煙囪內壁）
    alb = vec3f(0.008);
  } else if (mat == 13) {                         // 消波塊、煤堆
    alb = in.col.rgb * (0.6 + 0.8 * nt.r * n2.g);
    s.rough = 0.95;
  } else if (mat == 14) {                         // 碼頭：混凝土＋邊緣黃線＋黑色防舷材
    alb = mix(vec3f(0.24, 0.24, 0.23), vec3f(0.36, 0.355, 0.34), nt.r);
    if (!top) {
      alb *= mix(0.45, 1.0, smoothstep(0.0, 2.2, hv + n2.r * 0.6));         // 潮間帶較黑
      alb = mix(alb, vec3f(0.02), step(abs(fract(hu / 9.0) - 0.5), 0.07) * step(1.0, hv));
    }
  } else if (mat == 15) {                         // 鋁皮保溫層（塔槽、管線）
    alb = vec3f(0.58, 0.59, 0.60) * (0.8 + 0.3 * n1.r);
    alb *= 1.0 - 0.2 * smoothstep(0.03, 0.0, abs(fract(hv / 1.2) - 0.5) * 1.2 - 0.57);
    s.rough = 0.38; s.metal = 0.85;
  }
  // 接近地面的積塵與濺痕
  alb *= mix(0.78, 1.0, smoothstep(0.0, 1.6, in.wp.y - terrainH(in.wp.xz, 1) + n2.b));
  s.n = n; s.albedo = alb;
  return vec4f(shade(s, normalize(F.camPos.xyz - in.wp)), 1.0);
}
</script>

<script type="text/wgsl" id="resolve">
// ── resolve：MSAA 自訂 resolve。用可逆 tone map 的權重平均，避免超亮像素讓邊緣鋸齒 ──
#include common
#include fullscreen
@group(1) @binding(0) var msTex: texture_multisampled_2d<f32>;
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let p = vec2i(in.pos.xy);
  var acc = vec3f(0.0);
  var wsum = 0.0;
  for (var i = 0; i < 4; i++) {
    let c = textureLoad(msTex, p, i).rgb;
    let w = 1.0 / (1.0 + luma(max(c, vec3f(0.0))) * F.camFwd.w);
    acc += c * w;
    wsum += w;
  }
  return vec4f(acc / wsum, 1.0);
}
</script>

<script type="text/wgsl" id="post_final">
// ── post_final：曝光 → AgX → 調色 → dithering → canvas ──
#include common
#include fullscreen
struct PostU {
  p0: vec4f,   // x 曝光倍率，y bloom 強度，z 去飽和（分析模式），w 暗角強度
  p1: vec4f,   // x canvas 寬，y canvas 高，z 幀序號，w 預留
};
@group(1) @binding(0) var<uniform> P: PostU;
@group(1) @binding(1) var hdrTex: texture_2d<f32>;
@group(1) @binding(2) var bloomTex: texture_2d<f32>;

// AgX（Troy Sobotka）；這裡用 Benjamin Wrensch 的精簡近似版
fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x; let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(c: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                  0.0784335999999992, 0.878468636469772, 0.0784336,
                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393; let maxEv = 4.026069;
  var v = m * c;
  v = clamp(log2(max(v, vec3f(1e-10))), vec3f(minEv), vec3f(maxEv));
  v = (v - minEv) / (maxEv - minEv);
  return agxContrast(v);
}
fn agxLook(c: vec3f) -> vec3f {
  // 稍微加對比與飽和（介於預設與 punchy 之間）
  var v = pow(max(c, vec3f(0.0)), vec3f(1.18));
  let l = luma(v);
  return l + 1.22 * (v - l);
}
fn agxEotf(c: vec3f) -> vec3f {
  let m = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                  -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                  -0.0990297440797205, -0.0989611768448433, 1.15107367264116);

    else if (INPUT.dragging) { lookBy(e.clientX - INPUT.lx, e.clientY - INPUT.ly); INPUT.lx = e.clientX; INPUT.ly = e.clientY; userActed(); }
  });
  document.addEventListener('pointerlockchange', () => { INPUT.locked = document.pointerLockElement === canvas; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    S.cam.speed = clamp(S.cam.speed * Math.pow(1.15, -Math.sign(e.deltaY)), 2, 2000);
    userActed();
  }, {passive: false});
}
function updateCamera(dt) {
  const c = S.cam;
  if (!S.userActed && !CFG.shot && !CFG.bench) {
    // 使用者還沒操作：鏡頭緩慢推移
    const f = dirFromAzEl(c.yaw, 0), r = [Math.cos(c.yaw), 0, Math.sin(c.yaw)];
    c.pos = v3.add(c.pos, v3.add(v3.scale(f, 3.0 * dt), v3.scale(r, 1.2 * dt)));
    return;
  }
  let mx = 0, mz = 0, my = 0;
  if (KEYS.has('KeyW') || KEYS.has('ArrowUp')) mz += 1;
  if (KEYS.has('KeyS') || KEYS.has('ArrowDown')) mz -= 1;
  if (KEYS.has('KeyD') || KEYS.has('ArrowRight')) mx += 1;
  if (KEYS.has('KeyA') || KEYS.has('ArrowLeft')) mx -= 1;
  if (KEYS.has('Space')) my += 1;
  if (KEYS.has('ShiftLeft') || KEYS.has('ShiftRight')) my -= 1;
  mx += INPUT.joy[0]; mz += INPUT.joy[1]; my += INPUT.lift;
  const f = dirFromAzEl(c.yaw, c.pitch), r = [Math.cos(c.yaw), 0, Math.sin(c.yaw)];
  const want = v3.scale([f[0] * mz + r[0] * mx, f[1] * mz + my, f[2] * mz + r[2] * mx], c.speed);
  const k = 1 - Math.exp(-dt * 8);
  c.vel = v3.lerp(c.vel, want, k);
  c.pos = v3.add(c.pos, v3.scale(c.vel, dt));
  c.pos[0] = clamp(c.pos[0], -11500, 11500); c.pos[2] = clamp(c.pos[2], -11500, 11500);
  c.pos[1] = clamp(c.pos[1], Math.max(heightAt(c.pos[0], c.pos[2]) + 2, 1.5), 6000);   // 不穿地、不潛水
  c.fov = lerp(c.fov, c.fovTarget, 1 - Math.exp(-dt * 2.2));
}

// ═══ §J9 測試鉤子 ═════════════════════════════════════════════════════
function selftestCPU() {
  const out = [];
  const chk = (id, name, val, ref, tol) => {
    const err = Math.abs(val - ref) / Math.abs(ref), ok = err < tol;
    out.push({id, name, val, ref, err, ok});
    console.log(`SELFTEST ${ok ? 'PASS' : 'FAIL'} ${id} ${name}：計算值=${val.toPrecision(8)}，參考值=${ref}，相對誤差=${(err * 100).toExponential(3)}%（門檻 ${tol * 100}%）`);
  };
  const s = PHYS.sigma('D', false, 1000);
  chk('a1', 'σy（D 級、鄉村、x=1000 m）[m]', s.sy, 76.28, 0.005);
  chk('a2', 'σz（D 級、鄉村、x=1000 m）[m]', s.sz, 37.95, 0.005);
  const c1 = PHYS.gauss(100, 5, s.sy, s.sz, 0, 0, 100);
  chk('b', '地面中心線濃度（Q=100 g/s、u=5 m/s、H=100 m）[μg/m³]', c1 * 1e6, 68.29, 0.005);
  // c 質量守恆：∫∫ u·C dy dz，y 取 ±8σy，z 取 0 到 H+8σz，中點法
  let flux = 0; const ny = 400, nz = 800, y0 = -8 * s.sy, dy = 16 * s.sy / ny, zTop = 100 + 8 * s.sz, dz = zTop / nz;
  for (let j = 0; j < nz; j++) { const z = (j + 0.5) * dz; for (let i = 0; i < ny; i++) flux += 5 * PHYS.gauss(100, 5, s.sy, s.sz, y0 + (i + 0.5) * dy, z, 100) * dy * dz; }
  chk('c', '質量守恆 ∫∫u·C dy dz（應等於 Q=100）[g/s]', flux, 100, 0.01);
  const c2 = PHYS.gauss(100, 10, s.sy, s.sz, 0, 0, 100);
  chk('d', '風速加倍後的濃度比（應為 0.5）', c2 / c1, 0.5, 1e-9);
  return out;
}
async function runSelftest() {
  const res = selftestCPU();
  window.__selftest = {items: res, done: false};
  // e 項（GPU 熱圖回讀）在熱圖 pass 建好後補上
  if (typeof selftestGPU === 'function') { try { res.push(...await selftestGPU()); } catch (e) { reportError('[selftest e] ' + (e.stack || e)); res.push({id: 'e', ok: false, name: 'GPU 熱圖回讀', err: NaN}); } }
  const allOk = res.every(r => r.ok);
  window.__selftest.done = true; window.__selftest.ok = allOk;
  console.log(`SELFTEST ${allOk ? 'PASS' : 'FAIL'} 總結：${res.filter(r => r.ok).length}/${res.length} 項通過`);
}
window.__scene = {
  setCamera(o) {
    const c = S.cam;
    if (o.pos) c.pos = [...o.pos];
    if (o.target) { const d = v3.norm(v3.sub(o.target, c.pos)); c.yaw = (Math.atan2(d[0], -d[2]) + Math.PI * 2) % (Math.PI * 2); c.pitch = Math.asin(clamp(d[1], -1, 1)); }
    if (o.yawDeg !== undefined) c.yaw = o.yawDeg * DEG;
    if (o.pitchDeg !== undefined) c.pitch = o.pitchDeg * DEG;
    if (o.fovDeg !== undefined) { c.fov = c.fovTarget = o.fovDeg * DEG; }
    S.userActed = true; c.vel = [0, 0, 0];
  },
  setTime(min) { S.timeMin = clamp(+min, -90, 75); },
  setParams(o) { Object.assign(S.params, o); S.paramsDirty = true; },
  setMode(m) { S.mode = (m === 1 || m === 'analysis') ? 1 : 0; },
  getState() { return JSON.parse(JSON.stringify({cam: S.cam, timeMin: S.timeMin, params: S.params, mode: S.mode, tier: TIER.name, res: [RT.w, RT.h], canvas: [canvas.width, canvas.height], adapter: GPU.adapterName, gl: GPU.glName, software: GPU.software, features: GPU.features, frame: S.frame, errors: S.errors.length})); },
};

// ═══ §J10 主迴圈與啟動 ════════════════════════════════════════════════
function update(dt) {
  if (!S.frozen) S.simTime += dt;
  S.modeK = lerp(S.modeK, S.mode, 1 - Math.exp(-dt * 3.5));
  if (Math.abs(S.modeK - S.mode) < 0.002) S.modeK = S.mode;
  updateCamera(dt);
}
const LOOP = {lastRaf: 0, lastTick: 0, starved: false, gpuBusy: false, manual: false};
function tick(nowMs) {
  if (!GPU.ready || LOOP.gpuBusy || LOOP.manual) return;
  const now = nowMs * 0.001;
  let dt = Math.min(now - S.lastT, 0.1);
  if (S.resetDt || !(dt > 0)) { dt = 1 / 60; S.resetDt = false; }
  S.lastT = now; LOOP.lastTick = nowMs;
  try {
    update(dt); render();
    LOOP.gpuBusy = true;   // GPU 還沒做完上一幀就不再送，避免工作堆積
    device.queue.onSubmittedWorkDone().then(() => { LOOP.gpuBusy = false; }, () => { LOOP.gpuBusy = false; });
  } catch (e) { reportError('[frame] ' + (e.stack || e)); GPU.ready = false; }
  if (CFG.shot && !window.__shotReady && S.frame >= 90 && !S.errors.length) { window.__shotReady = true; console.log('SHOT_READY'); }
}
function rafLoop() {
  const n = performance.now();
  if (n - LOOP.lastRaf < 200) LOOP.starved = false;
  LOOP.lastRaf = n;
  tick(n);
  requestAnimationFrame(rafLoop);
}
// 視窗被遮住或最小化、但分頁仍算「可見」時，requestAnimationFrame 會被瀏覽器降到每秒 1–2 次（自動化測試常見）。
// 這時改用計時器推動畫面；真的切到背景分頁（document.hidden）就不畫。
setInterval(() => {
  const n = performance.now();
  if (document.hidden) return;
  if (n - LOOP.lastRaf > 400) LOOP.starved = true;
  if (LOOP.starved && n - LOOP.lastTick > 15) tick(n);
}, 8);
document.addEventListener('visibilitychange', () => { S.resetDt = true; });   // 分頁切回來時不用累積的時間差
async function start(isRestart) {
  try {
    if (!(await initGPU())) return;
    for (const k of Object.keys(RT)) delete RT[k];
    for (const k of Object.keys(RES)) delete RES[k];
    GPU.bglCache.clear(); GPU.gen++;
    TIER = pickTier();
    GPU.consts = {SHADOW_TAPS: TIER.pcf};
    timerInit();
    buildStatic();
    await buildTerrain();
    buildSceneGPU();
    buildPipelines();
    allocTargets();
    if (!isRestart && !S.camPlaced) { S.cam.pos[1] = heightAt(S.cam.pos[0], S.cam.pos[2]) + 22; S.camPlaced = true; }
    GPU.ready = true; S.resetDt = true;
    console.log(`[海港夕煙] adapter=${GPU.adapterName} | ${GPU.glName} | 軟體渲染=${GPU.software} | 畫質=${TIER.name} | features=${GPU.features.join(',')}`);
    if (!isRestart) {
      initInput();
      if (CFG.shot) { S.frozen = true; S.simTime = 40; S.userActed = true; }
      if (CFG.selftest) runSelftest();
      requestAnimationFrame(rafLoop);
    }
  } catch (e) {
    reportError('[start] ' + (e.stack || e));
    fail('啟動時發生錯誤，畫面無法顯示。<br>請改用最新版的 Chrome 或 Edge，或 Safari 26 以上的版本。', String(e && e.message || e));
  }
}
new ResizeObserver(() => { S.resizePending = true; }).observe(canvas);
start(false);
</script>
