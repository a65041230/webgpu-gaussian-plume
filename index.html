<script type="text/wgsl" id="resolve">
// ── resolve：MSAA 自訂 resolve。用可逆 tone map 的權重平均，避免超亮像素讓邊緣鋸齒 ──
#include common
#include fullscreen
@group(1) @binding(0) var msTex: texture_multisampled_2d<f32>;
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let p = vec2i(in.pos.xy);
  var acc = vec3f(0.0);
  var wsum = 0.0;
  for (var i = 0; i < 4; i++) {
    let c = textureLoad(msTex, p, i).rgb;
    let w = 1.0 / (1.0 + luma(max(c, vec3f(0.0))) * F.camFwd.w);
    acc += c * w;
    wsum += w;
  }
  return vec4f(acc / wsum, 1.0);
}
</script>

<script type="text/wgsl" id="bloom_down">
// ── bloom_down：逐級降採樣（13 點濾波）。第一級用 Karis 平均壓住單點超亮像素，避免閃爍 ──
#include common
#include fullscreen
@group(1) @binding(0) var srcTex: texture_2d<f32>;
fn tap(uv: vec2f) -> vec3f { return max(textureSampleLevel(srcTex, sLin, uv, 0.0).rgb, vec3f(0.0)); }
fn kw(c: vec3f) -> f32 { return 1.0 / (1.0 + luma(c)); }
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let ts = 1.0 / vec2f(textureDimensions(srcTex));
  let uv = in.uv;
  let a = tap(uv + ts * vec2f(-2.0, -2.0)); let b = tap(uv + ts * vec2f(0.0, -2.0)); let c = tap(uv + ts * vec2f(2.0, -2.0));
  let d = tap(uv + ts * vec2f(-2.0, 0.0));  let e = tap(uv);                          let f = tap(uv + ts * vec2f(2.0, 0.0));
  let g = tap(uv + ts * vec2f(-2.0, 2.0));  let h = tap(uv + ts * vec2f(0.0, 2.0));  let i = tap(uv + ts * vec2f(2.0, 2.0));
  let j = tap(uv + ts * vec2f(-1.0, -1.0)); let k = tap(uv + ts * vec2f(1.0, -1.0));
  let l = tap(uv + ts * vec2f(-1.0, 1.0));  let m = tap(uv + ts * vec2f(1.0, 1.0));
#if KARIS
  let g0 = (a + b + d + e) * 0.25; let g1 = (b + c + e + f) * 0.25; let g2 = (d + e + g + h) * 0.25; let g3 = (e + f + h + i) * 0.25; let g4 = (j + k + l + m) * 0.25;
  let w0 = kw(g0) * 0.125; let w1 = kw(g1) * 0.125; let w2 = kw(g2) * 0.125; let w3 = kw(g3) * 0.125; let w4 = kw(g4) * 0.5;
  return vec4f((g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4), 1.0);
#else
  return vec4f(e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125, 1.0);
#endif
}
</script>

<script type="text/wgsl" id="bloom_up">
// ── bloom_up：逐級升採樣（3×3 tent），用加色混合疊回上一級 ──
#include common
#include fullscreen
@group(1) @binding(0) var srcTex: texture_2d<f32>;
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let ts = 1.0 / vec2f(textureDimensions(srcTex));
  var s = textureSampleLevel(srcTex, sLin, in.uv, 0.0).rgb * 4.0;
  s += (textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(-1.0, 0.0), 0.0).rgb + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(1.0, 0.0), 0.0).rgb
      + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(0.0, -1.0), 0.0).rgb + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(0.0, 1.0), 0.0).rgb) * 2.0;
  s += textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(-1.0, -1.0), 0.0).rgb + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(1.0, -1.0), 0.0).rgb
     + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(-1.0, 1.0), 0.0).rgb + textureSampleLevel(srcTex, sLin, in.uv + ts * vec2f(1.0, 1.0), 0.0).rgb;
  return vec4f(s / 16.0, 1.0);
}
</script>

<script type="text/wgsl" id="fxaa">
// ── fxaa：沒有 MSAA 的畫質等級用的後處理反鋸齒（FXAA，Timothy Lottes 的精簡版）＋ dithering ──
#include common
#include fullscreen
@group(1) @binding(0) var ldrTex: texture_2d<f32>;
fn tp(uv: vec2f) -> vec3f { return textureSampleLevel(ldrTex, sLin, uv, 0.0).rgb; }
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  let ts = 1.0 / vec2f(textureDimensions(ldrTex));
  let uv = in.uv;
  let m = tp(uv);
  let lNW = luma(tp(uv + ts * vec2f(-1.0, -1.0))); let lNE = luma(tp(uv + ts * vec2f(1.0, -1.0)));
  let lSW = luma(tp(uv + ts * vec2f(-1.0, 1.0)));  let lSE = luma(tp(uv + ts * vec2f(1.0, 1.0)));
  let lM = luma(m);
  let lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
  let lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  var dir = vec2f(-((lNW + lNE) - (lSW + lSE)), (lNW + lSW) - (lNE + lSE));
  let red = max((lNW + lNE + lSW + lSE) * 0.03125, 1.0 / 128.0);
  dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + red), vec2f(-8.0), vec2f(8.0)) * ts;
  let a = 0.5 * (tp(uv + dir * (1.0 / 3.0 - 0.5)) + tp(uv + dir * (2.0 / 3.0 - 0.5)));
  let b = a * 0.5 + 0.25 * (tp(uv - dir * 0.5) + tp(uv + dir * 0.5));
  let lB = luma(b);
  var o = b;
  if (lB < lMin || lB > lMax) { o = a; }
  let n1 = hash21(in.pos.xy + vec2f(F.time.y * 13.0, 7.0));
  let n2 = hash21(in.pos.xy + vec2f(91.0, F.time.y * 17.0 + 3.0));
  return vec4f(o + (n1 + n2 - 1.0) / 255.0, 1.0);
}
</script>

<script type="text/wgsl" id="post_final">
// ── post_final：曝光 → AgX → 調色 → dithering → canvas ──
#include common
#include fullscreen
struct PostU {
  p0: vec4f,   // x 曝光倍率，y bloom 強度，z 去飽和（分析模式），w 暗角強度
  p1: vec4f,   // x canvas 寬，y canvas 高，z 幀序號，w＝1/bloom 層數
};
@group(1) @binding(0) var<uniform> P: PostU;
@group(1) @binding(1) var hdrTex: texture_2d<f32>;
@group(1) @binding(2) var bloomTex: texture_2d<f32>;

// AgX（Troy Sobotka）；這裡用 Benjamin Wrensch 的精簡近似版
fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x; let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(c: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                  0.0784335999999992, 0.878468636469772, 0.0784336,
                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393; let maxEv = 4.026069;
  var v = m * c;
  v = clamp(log2(max(v, vec3f(1e-10))), vec3f(minEv), vec3f(maxEv));
  v = (v - minEv) / (maxEv - minEv);
  return agxContrast(v);
}
fn agxLook(c: vec3f) -> vec3f {
  // 稍微加對比與飽和（介於預設與 punchy 之間）
  var v = pow(max(c, vec3f(0.0)), vec3f(1.18));
  let l = luma(v);
  return l + 1.22 * (v - l);
}
fn agxEotf(c: vec3f) -> vec3f {
  let m = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                  -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                  -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  return pow(max(m * c, vec3f(0.0)), vec3f(2.2));
}
fn toSrgb(c: vec3f) -> vec3f {
  let lo = c * 12.92;
  let hi = 1.055 * pow(max(c, vec3f(0.0)), vec3f(1.0 / 2.4)) - 0.055;
  return select(hi, lo, c <= vec3f(0.0031308));
}
@fragment fn fs(in: FSOut) -> @location(0) vec4f {
  var c = max(textureSampleLevel(hdrTex, sLin, in.uv, 0.0).rgb, vec3f(0.0));
  let b = max(textureSampleLevel(bloomTex, sLin, in.uv, 0.0).rgb, vec3f(0.0)) * P.p1.w;   // p1.w＝1/層數（各級是加總起來的）
  c = mix(c, b, P.p0.y) * P.p0.x;
  // 暗角
  let q = in.uv - 0.5;
  c *= 1.0 - P.p0.w * smoothstep(0.25, 0.95, dot(q, q) * 2.0);
  var o = agxEotf(agxLook(agx(c)));
  // 分析模式：去飽和
  o = mix(o, vec3f(luma(o)), P.p0.z);
  o = toSrgb(o);
#if !TO_LDR
  // 三角分佈 dithering，消除 8-bit 色帶（走 FXAA 的等級改在 FXAA 之後做）
  let n1 = hash21(in.pos.xy + vec2f(P.p1.z * 13.0, 7.0));
  let n2 = hash21(in.pos.xy + vec2f(91.0, P.p1.z * 17.0 + 3.0));
  o += (n1 + n2 - 1.0) / 255.0;
#endif
  return vec4f(o, 1.0);
}
</script>

// 每幀：依太陽方向擺放光學深度體積（只包住濃密段，體素才夠細）
function updatePlumeFrame() {
  if (PLUME.dirty || S.paramsDirty) { S.paramsDirty = false; updateStacks(); updatePlumeModel(); }
  const M = PLUME.M;
  PLUME.bake = SUN.el > -1.5 * DEG && PLUME.pts.length > 0 && !S.dbgNoLV;
  if (PLUME.bake) {
    const L = dirFromAzEl(SUN.az, Math.max(SUN.el, 0.6 * DEG)), W = v3.scale(L, -1), wd3 = [M.wd[0], 0, M.wd[1]];
    let Uv = v3.sub(wd3, v3.scale(W, v3.dot(wd3, W)));
    if (v3.len(Uv) < 0.2) Uv = v3.cross(W, [0, 1, 0]);
    Uv = v3.norm(Uv);
    const Vv = v3.cross(W, Uv), lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const p of PLUME.pts) [Uv, Vv, W].forEach((a, k) => { const d = v3.dot(p, a); lo[k] = Math.min(lo[k], d); hi[k] = Math.max(hi[k], d); });
    const len = [0, 1, 2].map(k => (hi[k] - lo[k]) * 1.06 + 4), o0 = [0, 1, 2].map(k => lo[k] - (len[k] - (hi[k] - lo[k])) / 2);
    const org = v3.add(v3.add(v3.scale(Uv, o0[0]), v3.scale(Vv, o0[1])), v3.scale(W, o0[2]));
    ULV.set('o', [...org, 0]).set('u', [...v3.scale(Uv, len[0]), 0]).set('v', [...v3.scale(Vv, len[1]), 0]).set('w', [...v3.scale(W, len[2]), 0]);
    ULV.upload();
    [Uv, Vv, W].forEach((a, k) => UPlume.set('lv' + k, [a[0] / len[k], a[1] / len[k], a[2] / len[k], -o0[k] / len[k]]));
    PLUME.lvLen = len;
    UPlume.set('prm2', [PLUME.M.lid ? PLUME.M.zi : 0, len[2] / TIER.lvol[2], STAB[S.params.cls][3], S.params.d / 2]);   // y＝沿光線方向一格體素的長度
  } else {
    UPlume.set('lv0', [0, 0, 0, -1]).set('lv1', [0, 0, 0, -1]).set('lv2', [0, 0, 0, -1]);   // 沒有太陽：不查體積
  }
  const fl = SCENE.flare || [0, 0, 0];
  const flick = 0.85 + 0.15 * Math.sin(S.simTime * 9.0) * Math.sin(S.simTime * 3.7 + 1.0);
  UPlume.set('flare', [fl[0], fl[1] + 6, fl[2], 500 * flick * (1 - 0.8 * SUN.night)]).set('glow', [0.030 * SUN.night, 0.014 * SUN.night, 0.004 * SUN.night, 0]);

}

// ═══ §J5d 分析模式：GPU 熱圖的參數 ═══════════════════════════════════
// 6 個虛擬測站（名稱是虛構的）
const STATIONS = [{n: '港區站', x: 1300, z: -1300}, {n: '北岸站', x: 1900, z: -2100}, {n: '山麓站', x: 2600, z: -900},
                  {n: '市鎮站', x: 1500, z: -3200}, {n: '廠界站', x: 300, z: -150}, {n: '南區站', x: 1700, z: 600}];
const HEAT = {size: 512, half: 6000, cx: 0, cz: 0, dirty: true, notes: [], lmin: -1, lmax: 2, curtainH: 800, stn: []};
let UHeat = null;
const nice125 = (v) => { const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e; return (m <= 1.0001 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; };
function buildHeatResources() {
  const U = GPUTextureUsage;
  HEAT.tex = device.createTexture({label: 'heatTex', size: [HEAT.size, HEAT.size], format: 'r32float', usage: U.STORAGE_BINDING | U.TEXTURE_BINDING | U.COPY_SRC});
  RES.heatTex = RES.heatOut = HEAT.tex.createView();

}
// 物理模型更新後：把模型參數送給 GPU（熱圖 compute、地面疊圖、剖面都用這份）
function updateHeatModel() {
  const M = PLUME.M, mx = PLUME.max, p = S.params;
  const half = [3000, 4500, 6000, 9000, 12000].find(h => h * 1.5 >= mx.xmax * 2.2) || 12000;    // 熱圖要涵蓋最大落地濃度的位置（留一倍以上餘裕）
  const cx = M.cx + M.wd[0] * half * 0.55, cz = M.cz + M.wd[1] * half * 0.55;                  // 中心往下風偏，多看下風側
  const cmaxU = Math.max(mx.cmax * 1e6, 1e-6), lmax = Math.log10(nice125(cmaxU)), Hmax = Math.max(...M.src.map(s => s.hsE + s.dhF));
  Object.assign(HEAT, {half, cx, cz, lmin: lmax - 3, lmax, curtainH: Math.max(nice125(Hmax * 1.6), M.lid ? M.zi * 1.2 : 0)});
  M.src.forEach((s, i) => { UHeat.set('src', [s.x, s.z, s.hsE, s.us], i); UHeat.set('rise', [s.K, s.e, s.dhF, s.pen ? 0 : M.Q * 1e6], i); });
  UHeat.set('sig', [M.k[0], M.k[1], M.k[2], M.k[3]]).set('prm', [M.k[4], M.lid ? M.zi : 0, M.wd[0], M.wd[1]])
    .set('grid', [half, cx, cz, p.thresh]).set('scale', [HEAT.lmin, lmax, PLUME.xEvap, HEAT.curtainH]).set('mark', [mx.wx, mx.wz, cmaxU, 0]);
  STATIONS.forEach((s, i) => UHeat.set('stn', [s.x, s.z, 0, 0], i));
  UHeat.upload();

  HEAT.stn = STATIONS.map(s => PHYS.concAt(M, s.x, s.z, 0) * 1e6);
  const notes = [];
  if (mx.cmax <= 0) notes.push('煙流穿透逆溫層：依 ISC3 慣例，地面濃度視為 0');
  else {
    if (mx.xmax > half * 1.5) notes.push(`最大落地濃度在下風 ${(mx.xmax / 1000).toFixed(1)} km，超出熱圖範圍`);
    if (mx.xmax > 10000) notes.push('下風距離超過 10 km：Briggs 擴散係數屬外插');
    if (M.src.some(s => s.pen)) notes.push('部分煙流穿透逆溫層（那幾支不計入地面濃度）');
  }
  if (mx.xmax < 100 && mx.cmax > 0) notes.push('下風距離不到 100 m：Briggs 擴散係數屬外插');

// ═══ §J6 各個 pass ════════════════════════════════════════════════════
const SUN = {dir: [0, 1, 0], az: 0, el: 0, illum: [1, 1, 1], night: 0};
function updateSun() {
  // 太陽：日落時（timeMin=0）高度 0°；每分鐘下降約 0.225°，方位每分鐘往北約 0.1°（高雄 9 月中旬的近似）
  SUN.el = -S.timeMin * 0.225 * DEG;
  SUN.az = (267.6 + (S.timeMin + 16) * 0.1) * DEG;
  SUN.dir = dirFromAzEl(SUN.az, SUN.el);
  const elDeg = SUN.el / DEG;
  SUN.illum = transCPU(0.05, Math.sin(SUN.el)).map(t => t * ATMO.E0);   // 地面附近的太陽照度（含大氣消光）
  SUN.night = smooth(2.0, -7.0, elDeg);                                 // 夜間係數：燈光依這個值逐漸亮起
  // 分析模式把場景提亮一些，底圖才看得清楚（熱圖自己的亮度會依曝光反向補償，不受影響）

}
const CAM = {view: null, proj: null, viewProj: m4.ident(), prevViewProj: m4.ident(), right: [1, 0, 0], up: [0, 1, 0], fwd: [0, 0, -1], near: 0.5};
function updateFrameUniforms() {
  const c = S.cam, aspect = RT.w / RT.h;
  CAM.fwd = dirFromAzEl(c.yaw, c.pitch);

  UFrame.set('viewProj', CAM.viewProj).set('prevViewProj', CAM.prevViewProj)
    .set('camPos', [...c.pos, CAM.near]).set('camRight', [...CAM.right, th * aspect]).set('camUp', [...CAM.up, th])
    .set('camFwd', [...CAM.fwd, S.exposure]).set('viewport', [RT.w, RT.h, 1 / RT.w, 1 / RT.h])
    .set('sunDir', [...SUN.dir, SUN.el]).set('sunIllum', [...SUN.illum, SUN.night])
    .set('time', [S.simTime, S.frame, S.modeK, S.dbgVol || 0]);

  UFrameR.f32.set(UFrame.f32);
  const mir = (v) => [v[0], -v[1], v[2]];
  UFrameR.set('viewProj', m4.mul(CAM.proj, m4.mul(CAM.view, m4.S(1, -1, 1)))).set('camPos', [...mir(c.pos), CAM.near])
    .set('camRight', [...CAM.right, th * aspect]).set('camUp', [...mir(CAM.up), th]).set('camFwd', [...mir(CAM.fwd), S.exposure])
    .set('viewport', [RT.rw, RT.rh, 1 / RT.rw, 1 / RT.rh]);
  UFrameR.upload();
  updatePlumeFrame();
  UPost.set('p0', [S.exposure, lerp(0.07, 0.13, SUN.night), S.modeK * 0.7, 0.35]).set('p1', [canvas.width, canvas.height, S.frame % 1024, 1 / TIER.bloomMips]);

}
function fsPass(enc, name, P, view) {
  const pass = RP(enc, name, {colorAttachments: [{view, loadOp: 'clear', storeOp: 'store'}]});
  usePipeline(pass, P); pass.draw(3); pass.end();
}
function render() {
  allocTargets();
  updateSun();
  updateFrameUniforms();
  const P = GPU.pipelines;
  const enc = device.createCommandEncoder();
  TIMER.used = new Set();

  if (PLUME.bake && (CFG.shot || PLUME.lvCount % TIER.lvolEvery === 0)) {
    const cp = CP(enc, 'lightvol');

    cp.end();

    usePipeline(pass, P.shadow, {C: SHADOW.ubo[i].buf}, 'c' + i);
    drawScene(pass);
    pass.end();
  }
  // 水面的平面反射：用鏡射相機把水面以上的東西再畫一次（半解析度）
  {
    const pass = RP(enc, 'reflect', {
      colorAttachments: [{view: RT.refl.view, clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store'}],
      depthStencilAttachment: {view: RT.reflDepth.view, depthClearValue: 0, depthLoadOp: 'clear', depthStoreOp: 'discard'},
    });

    const pass = RP(enc, 'main', {
      colorAttachments: [{view: (RT.msColor || RT.hdr).view, clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'store'}],
      depthStencilAttachment: {view: RT.depth.view, depthClearValue: 0, depthLoadOp: 'clear', depthStoreOp: 'store'},
    });

    pass.setVertexBuffer(0, TERR.vb); pass.setIndexBuffer(TERR.ib, 'uint32');
    pass.drawIndexed(TERR.indexCount, TERR.levels);
    usePipeline(pass, P.mesh); drawScene(pass);
    usePipeline(pass, P.water); pass.draw(4);
    usePipeline(pass, P.sky); pass.draw(3);
    if (S.modeK > 0.003) { usePipeline(pass, P.curtain); pass.draw(4); }   // 分析模式：下風軸線的垂直剖面
    usePipeline(pass, P.flame); pass.draw(4);
    usePipeline(pass, P.lights); pass.setVertexBuffer(0, SCENE.lbuf); pass.draw(4, SCENE.lights.length);
    pass.end();
  }
  if (RT.msColor) {
    const pass = RP(enc, 'resolve', {colorAttachments: [{view: RT.hdr.view, loadOp: 'clear', storeOp: 'store'}]});
    usePipeline(pass, P.resolve); pass.draw(3); pass.end();
  }
  // 體積：raymarch → 時間累積 → 合成回 HDR
  {
    const pass = RP(enc, 'volMarch', {colorAttachments: [{view: RT.volCur.view, loadOp: 'clear', storeOp: 'store'}, {view: RT.volAux.view, loadOp: 'clear', storeOp: 'store'}]});
    usePipeline(pass, P.volMarch); pass.draw(3); pass.end();
    const hi = RT.histIdx, ho = 1 - hi;
    UVol.set('p', [S.volReset ? 1 : 0, 0, 0, 0]); UVol.upload(); S.volReset = false;
    const p2 = RP(enc, 'volTemporal', {colorAttachments: [{view: RT.volHist[ho].view, loadOp: 'clear', storeOp: 'store'}]});
    usePipeline(p2, P.volTemporal, {histTex: RT.volHist[hi].view}, 'h' + hi); p2.draw(3); p2.end();
    const p3 = RP(enc, 'volComposite', {colorAttachments: [{view: RT.hdr.view, loadOp: 'load', storeOp: 'store'}]});
    usePipeline(p3, P.volComposite, {volTex: RT.volHist[ho].view}, 'h' + ho); p3.draw(3); p3.end();

      usePipeline(pass, i === 0 ? P.bloomDownK : P.bloomDown, {srcTex: i === 0 ? RT.hdr.view : B[i - 1].view}, 'd' + i);
      pass.draw(3); pass.end();
    }
    for (let i = n - 1; i >= 1; i--) {
      const pass = RP(enc, 'bloomUp' + i, {colorAttachments: [{view: B[i - 1].view, loadOp: 'load', storeOp: 'store'}]});
      usePipeline(pass, P.bloomUp, {srcTex: B[i].view}, 'u' + i);
      pass.draw(3); pass.end();
    }
  }
  {
    const cv = context.getCurrentTexture().createView();
    const pass = RP(enc, 'final', {colorAttachments: [{view: RT.ldr ? RT.ldr.view : cv, loadOp: 'clear', storeOp: 'store'}]});

}

// 手機：左下虛擬搖桿移動、拖曳畫面轉視角、右下兩顆鍵升降
function initTouch() {
  const joy = $('#joy'), knob = joy.querySelector('i');
  let jid = -1;
  const setJ = (e) => {
    const r = joy.getBoundingClientRect(), x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2), l = Math.max(Math.hypot(x, y), 1);
    INPUT.joy = [x / l, -y / l]; knob.style.transform = `translate(${x / l * 36}px, ${y / l * 36}px)`; userActed();
  };
  joy.addEventListener('pointerdown', (e) => { jid = e.pointerId; joy.setPointerCapture(jid); setJ(e); e.preventDefault(); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === jid) setJ(e); });
  const endJ = (e) => { if (e.pointerId === jid) { jid = -1; INPUT.joy = [0, 0]; knob.style.transform = ''; } };
  joy.addEventListener('pointerup', endJ); joy.addEventListener('pointercancel', endJ);
  for (const [id, v] of [['#bUp', 1], ['#bDown', -1]]) {
    const b = $(id);
    b.addEventListener('pointerdown', (e) => { INPUT.lift = v; userActed(); e.preventDefault(); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { INPUT.lift = 0; });
  }
  let lid = -1, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse' && lid < 0) { lid = e.pointerId; lx = e.clientX; ly = e.clientY; } });
  canvas.addEventListener('pointermove', (e) => { if (e.pointerId === lid) { lookBy((lx - e.clientX) * 1.6, (ly - e.clientY) * 1.6); lx = e.clientX; ly = e.clientY; userActed(); } });
  const endL = (e) => { if (e.pointerId === lid) lid = -1; };
  canvas.addEventListener('pointerup', endL); canvas.addEventListener('pointercancel', endL);
}

// ═══ §J9 測試鉤子 ═════════════════════════════════════════════════════
// ?shot=N 的固定鏡頭。pos 的 y 若是 null，表示用「地形高度＋22 m」
const SHOTS = {
  1: {pos: [2750, null, -150], yaw: 270, pitch: -1.0, fov: 24, time: -16.7, mode: 0},                 // 開場黃昏全景
  2: {pos: [235, 292, 345], target: [70, 292, 70], fov: 34, time: -16.7, mode: 0},                    // 近看煙囪出口與煙流
  3: {pos: [182, 300, -34], target: [-815, 366, 10], fov: 55, time: -16.7, mode: 0},                  // 在煙流裡往太陽看
  4: {pos: [1080, 34, -190], target: [-60, 118, 150], fov: 44, time: 34, mode: 0},                    // 夜晚燈海與倒影
  5: {pos: [1500, 7400, -1500], yaw: 0, pitch: -89.5, fov: 50, time: -16.7, mode: 1},                 // 分析模式俯視（北方朝上）
  6: {pos: [2750, null, -150], yaw: 268.2, pitch: 0.4, fov: 31, time: -16.7, mode: 0},                // 手機直式開場
};
function applyShot(n) {
  const s = SHOTS[n]; if (!s) return;
  const pos = [...s.pos]; if (pos[1] === null) pos[1] = heightAt(pos[0], pos[2]) + 22;
  S.timeMin = s.time; S.mode = s.mode; S.modeK = s.mode;
  window.__scene.setCamera(s.target ? {pos, target: s.target, fovDeg: s.fov} : {pos, yawDeg: s.yaw, pitchDeg: s.pitch, fovDeg: s.fov});
}
function selftestCPU() {
  const out = [];
  const chk = (id, name, val, ref, tol) => {
    const err = Math.abs(val - ref) / Math.abs(ref), ok = err < tol;
    out.push({id, name, val, ref, err, ok});
    console.log(`SELFTEST ${ok ? 'PASS' : 'FAIL'} ${id} ${name}：計算值=${val.toPrecision(8)}，參考值=${ref}，相對誤差=${(err * 100).toExponential(3)}%（門檻 ${tol * 100}%）`);
  };
  const s = PHYS.sigma('D', false, 1000);
  chk('a1', 'σy（D 級、鄉村、x=1000 m）[m]', s.sy, 76.28, 0.005);
  chk('a2', 'σz（D 級、鄉村、x=1000 m）[m]', s.sz, 37.95, 0.005);
  // a3 Briggs 最終浮升（F≥55、浮力主導）。手算：F = g·vs·d²/4·ΔT/Ts = 277.33 m⁴/s³，
  // 煙囪口風速 u = 3.5·(250/10)^0.25 = 7.826 m/s，Δh = 38.71·F^0.6/u = 144.58 m
  const r3 = PHYS.rise({u10: 3.5, cls: 'D', urban: true, Ts: 55, Ta: 26, vs: 20, d: 8}, 250);
  chk('a3', 'Briggs 最終浮升（Ts=55 °C、Ta=26 °C、vs=20 m/s、d=8 m、250 m 煙囪）[m]', r3.dhF, 144.58, 0.005);
  const c1 = PHYS.gauss(100, 5, s.sy, s.sz, 0, 0, 100);
  chk('b', '地面中心線濃度（Q=100 g/s、u=5 m/s、H=100 m）[μg/m³]', c1 * 1e6, 68.29, 0.005);
  // c 質量守恆：∫∫ u·C dy dz，y 取 ±8σy，z 取 0 到 H+8σz，中點法
  let flux = 0; const ny = 400, nz = 800, y0 = -8 * s.sy, dy = 16 * s.sy / ny, zTop = 100 + 8 * s.sz, dz = zTop / nz;
  for (let j = 0; j < nz; j++) { const z = (j + 0.5) * dz; for (let i = 0; i < ny; i++) flux += 5 * PHYS.gauss(100, 5, s.sy, s.sz, y0 + (i + 0.5) * dy, z, 100) * dy * dz; }
  chk('c', '質量守恆 ∫∫u·C dy dz（應等於 Q=100）[g/s]', flux, 100, 0.01);
  const c2 = PHYS.gauss(100, 10, s.sy, s.sz, 0, 0, 100);
  chk('d', '風速加倍後的濃度比（應為 0.5）', c2 / c1, 0.5, 1e-9);
  return out;
}
// selftest e：GPU（WGSL f32）算的熱圖回讀 3 個點，和 JavaScript（double）的參考值比對
async function selftestGPU() {
  if (PLUME.dirty || !PLUME.M) { updateStacks(); updatePlumeModel(); }
  const N = HEAT.size, enc = device.createCommandEncoder(), cp = enc.beginComputePass();
  usePipeline(cp, GPU.pipelines.heat); cp.dispatchWorkgroups(N / 8, N / 8); cp.end();
  const buf = device.createBuffer({size: N * N * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST});
  enc.copyTextureToBuffer({texture: HEAT.tex}, {buffer: buf, bytesPerRow: N * 4}, [N, N]);
  device.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const g = new Float32Array(buf.getMappedRange().slice(0)); buf.unmap();
  const M = PLUME.M, mx = PLUME.max, out = [];
  // 三個點：最大落地濃度附近、上游一半距離偏 60 m、下游 1.7 倍距離偏 −120 m
  [[1, 0, '最大落地濃度附近'], [0.5, 60, '0.5·xmax、橫向 60 m'], [1.7, -120, '1.7·xmax、橫向 −120 m']].forEach(([fx, dy, name], k) => {
    const w = PHYS.relToWorld(M, mx.xmax * fx, mx.ymax + dy);
    const i = clamp(Math.floor(((w[0] - HEAT.cx) / (2 * HEAT.half) + 0.5) * N), 0, N - 1), j = clamp(Math.floor(((w[1] - HEAT.cz) / (2 * HEAT.half) + 0.5) * N), 0, N - 1);
    const tx = HEAT.cx + ((i + 0.5) / N - 0.5) * 2 * HEAT.half, tz = HEAT.cz + ((j + 0.5) / N - 0.5) * 2 * HEAT.half;   // 該 texel 中心的世界座標
    const ref = PHYS.concAt(M, tx, tz, 0) * 1e6, val = g[j * N + i], err = Math.abs(val - ref) / Math.max(Math.abs(ref), 1e-12), ok = err < 0.01;
    out.push({id: 'e' + (k + 1), name: 'GPU 熱圖 vs JS：' + name, val, ref, err, ok});
    console.log(`SELFTEST ${ok ? 'PASS' : 'FAIL'} e${k + 1} GPU 熱圖回讀（${name}，世界座標 x=${tx.toFixed(0)} z=${tz.toFixed(0)}）：GPU=${val.toPrecision(7)} μg/m³，JS=${ref.toPrecision(7)} μg/m³，相對誤差=${(err * 100).toExponential(3)}%（門檻 1%）`);
  });
  HEAT.dirty = true;
  return out;
}
// ?bench=1：20 秒固定路徑。每幀送出後等 GPU 做完再送下一幀，量到的是不受螢幕更新率限制的幀時間
async function runBench() {
  await new Promise(r => setTimeout(r, 1500));
  LOOP.manual = true; TIMER.active = true; TIMER.acc = {}; TIMER.n = 0;
  S.renderScale = 1; S.userActed = true; S.frozen = false; S.tour = null;
  try {
    const y0 = heightAt(2750, -150) + 22, times = [], t0 = performance.now();
    let last = t0;
    while (performance.now() - t0 < 20000 && GPU.ready) {
      const s = (performance.now() - t0) / 20000, k = s * s * (3 - 2 * s);
      S.cam.pos = v3.lerp([2750, y0, -150], [900, 210, -520], k); S.cam.yaw = lerp(270, 248, k) * DEG; S.cam.pitch = lerp(-1, -7, k) * DEG; S.cam.fov = S.cam.fovTarget = lerp(24, 50, k) * DEG;
      S.cam.vel = [0, 0, 0]; S.simTime += 1 / 60; S.modeK = 0;
      render();
      await device.queue.onSubmittedWorkDone();
      const n = performance.now(); times.push(n - last); last = n;
    }
    const t = times.slice(20).sort((a, b) => a - b);
    if (!t.length) {   // 太慢（例如軟體渲染）或中途 device lost：20 秒內不到 21 幀，無法統計
      window.__bench = {error: '幀數不足，無法統計', frames: times.length, tier: TIER.name, adapter: GPU.adapterName, software: GPU.software};
      console.log('BENCH ' + JSON.stringify(window.__bench));
      return;
    }
    const avg = t.reduce((a, b) => a + b, 0) / t.length, p95 = t[Math.floor(t.length * 0.95)], passes = {};
    for (const k in TIMER.acc) passes[k] = +(TIMER.acc[k] / Math.max(TIMER.n, 1)).toFixed(3);
    const gpuTotal = +Object.values(passes).reduce((a, b) => a + b, 0).toFixed(2);
    window.__bench = {frames: t.length, avgMs: +avg.toFixed(2), p95Ms: +p95.toFixed(2), fps: +(1000 / avg).toFixed(1), resolution: [RT.w, RT.h], canvas: [canvas.width, canvas.height],
      tier: TIER.name, adapter: GPU.adapterName, renderer: GPU.glName, software: GPU.software, timestampQuery: TIMER.ok, gpuPassMs: passes, gpuPassTotalMs: gpuTotal, timedFrames: TIMER.n};
    console.log('BENCH ' + JSON.stringify(window.__bench));
  } finally {
    TIMER.active = false; LOOP.manual = false; S.resetDt = true;   // 出錯也要把主迴圈交回去，否則畫面停住
  }
}
async function runSelftest() {
  const res = selftestCPU();
  window.__selftest = {items: res, done: false};
  // e 項（GPU 熱圖回讀）在熱圖 pass 建好後補上
  if (typeof selftestGPU === 'function') { try { res.push(...await selftestGPU()); } catch (e) { reportError('[selftest e] ' + (e.stack || e)); res.push({id: 'e', ok: false, name: 'GPU 熱圖回讀', err: NaN}); } }
  const allOk = res.every(r => r.ok);
  window.__selftest.done = true; window.__selftest.ok = allOk;
  console.log(`SELFTEST ${allOk ? 'PASS' : 'FAIL'} 總結：${res.filter(r => r.ok).length}/${res.length} 項通過`);
}
window.__scene = {
  setCamera(o) {
    const c = S.cam;
    if (o.pos) c.pos = [...o.pos];
    if (o.target) { const d = v3.norm(v3.sub(o.target, c.pos)); c.yaw = (Math.atan2(d[0], -d[2]) + Math.PI * 2) % (Math.PI * 2); c.pitch = Math.asin(clamp(d[1], -1, 1)); }
    if (o.yawDeg !== undefined) c.yaw = o.yawDeg * DEG;
    if (o.pitchDeg !== undefined) c.pitch = o.pitchDeg * DEG;
    if (o.fovDeg !== undefined) { c.fov = c.fovTarget = o.fovDeg * DEG; }
    S.userActed = true; c.vel = [0, 0, 0]; S.volReset = true;
  },
  setTime(min) { S.timeMin = clamp(+min, -90, 75); if ($('#p_time')) syncUI(); },
  setParams(o) { Object.assign(S.params, o); S.paramsDirty = true; if ($('#p_time')) syncUI(); },
  setMode(m) { const v = (m === 1 || m === 'analysis') ? 1 : 0; if ($('#p_time')) setMode(v); else S.mode = v; },
  setQuality(q) { return setQuality(q); },
  getState() { return JSON.parse(JSON.stringify({cam: S.cam, timeMin: S.timeMin, params: S.params, mode: S.mode, tier: TIER.name, res: [RT.w, RT.h], canvas: [canvas.width, canvas.height], adapter: GPU.adapterName, gl: GPU.glName, software: GPU.software, features: GPU.features, frame: S.frame, errors: S.errors.length})); },
};

// ═══ §J10 主迴圈與啟動 ════════════════════════════════════════════════
function update(dt) {
  if (!S.frozen) S.simTime += dt;
  S.modeK = lerp(S.modeK, S.mode, 1 - Math.exp(-dt * 3.5));
  if (Math.abs(S.modeK - S.mode) < 0.002) S.modeK = S.mode;
  updateCamera(dt);
  updateLabels();
}
const LOOP = {lastRaf: 0, lastTick: 0, starved: false, gpuBusy: false, manual: false};
function tick(nowMs) {
  if (!GPU.ready || LOOP.gpuBusy || LOOP.manual) return;
  const now = nowMs * 0.001;
  let dt = Math.min(now - S.lastT, 0.1);
  if (S.resetDt || !(dt > 0)) { dt = 1 / 60; S.resetDt = false; }
  S.lastT = now; LOOP.lastTick = nowMs;
  try {
    update(dt); render();
    LOOP.gpuBusy = true;   // GPU 還沒做完上一幀就不再送，避免工作堆積
    const t0 = performance.now();
    device.queue.onSubmittedWorkDone().then(() => { LOOP.gpuBusy = false; const ms = performance.now() - t0; S.gpuMs = S.gpuMs ? lerp(S.gpuMs, ms, 0.08) : ms; }, () => { LOOP.gpuBusy = false; });
    S.fpsEma = lerp(S.fpsEma || 60, 1 / Math.max(dt, 1e-3), 0.05);
    // 動態解析度：GPU 一幀超過約 18 ms 就降一級，低於 10 ms 再慢慢升回來
    if (!CFG.shot && S.frame % 30 === 0 && S.gpuMs) {
      if (S.gpuMs > 18.5 && S.renderScale > TIER.minScale + 1e-3) { S.renderScale = Math.max(TIER.minScale, S.renderScale - 0.1); S.drsHold = 6; }
      else if (S.gpuMs < 10.5 && S.renderScale < 1) { if (S.drsHold > 0) S.drsHold--; else S.renderScale = Math.min(1, S.renderScale + 0.1); }
      if (CFG.debug) { const st = $('#stat'); st.hidden = false; st.textContent = `${S.fpsEma.toFixed(0)} fps｜GPU ${S.gpuMs.toFixed(1)} ms｜${RT.w}×${RT.h}（×${(S.renderScale * TIER.maxScale).toFixed(2)}）｜${TIER.name}`; }
    }
  } catch (e) { reportError('[frame] ' + (e.stack || e)); GPU.ready = false; }
  if (CFG.shot && !window.__shotReady && S.frame >= 90 && !S.errors.length) { window.__shotReady = true; console.log('SHOT_READY'); }
}
function rafLoop() {
  const n = performance.now();
  if (n - LOOP.lastRaf < 200) LOOP.starved = false;
  LOOP.lastRaf = n;
  tick(n);
  requestAnimationFrame(rafLoop);
}
// 視窗被遮住或最小化、但分頁仍算「可見」時，requestAnimationFrame 會被瀏覽器降到每秒 1–2 次（自動化測試常見）。
// 這時改用計時器推動畫面；真的切到背景分頁（document.hidden）就不畫。
setInterval(() => {
  const n = performance.now();
  if (document.hidden) return;
  if (n - LOOP.lastRaf > 400) LOOP.starved = true;
  if (LOOP.starved && n - LOOP.lastTick > 15) tick(n);
}, 8);
document.addEventListener('visibilitychange', () => { S.resetDt = true; });   // 分頁切回來時不用累積的時間差
// 建立（或重建）所有 GPU 資源：啟動、device lost、切換畫質等級時都走這裡。CPU 端的場景資料會保留重傳
async function buildAll() {
  GPU.ready = false;
  for (const t of GPU.tex) t.destroy();
  for (const b of GPU.buf) b.destroy();
  GPU.tex = []; GPU.buf = [];
  for (const k of Object.keys(RT)) delete RT[k];
  for (const k of Object.keys(RES)) delete RES[k];
  GPU.bglCache.clear(); GPU.gen++;
  TIER = pickTier();
  GPU.consts = {SHADOW_TAPS: TIER.pcf, VOL_STEPS: TIER.volSteps, FOG_STEPS: TIER.fogSteps, VOL_DIV: TIER.volDiv.toFixed(1)};
  timerInit();
  buildStatic();
  await buildTerrain();
  buildSceneGPU();
  buildLightsGPU();
  buildHeatResources();
  buildPlumeResources();
  buildPipelines();
  allocTargets();
  GPU.ready = true; S.resetDt = true;
}
// 重建要排隊：上一次還在等 GPU 回讀時又重建，會把它正在用的 buffer 釋放掉
let rebuildQueue = Promise.resolve();
async function setQuality(name) {
  if (!Object.hasOwn(TIERS, name)) return;
  S.forceTier = name;
  // 排隊期間又被改選就跳過；只重建最後選的、而且和目前不同的等級
  rebuildQueue = rebuildQueue.then(() => S.forceTier === name && name !== TIER.name ? (S.renderScale = 1, buildAll()) : null)
    .catch(e => reportError('[setQuality] ' + (e.stack || e)));
  await rebuildQueue;
  syncUI();
}
async function start(isRestart) {
  try {
    if (!(await initGPU())) return;
    GPU.tex = []; GPU.buf = [];   // 舊 device 的資源已經失效，不用逐一 destroy
    await buildAll();
    if (!isRestart && !S.camPlaced) { S.cam.pos[1] = heightAt(S.cam.pos[0], S.cam.pos[2]) + 22; S.camPlaced = true; }
    console.log(`[海港夕煙] adapter=${GPU.adapterName} | ${GPU.glName} | 軟體渲染=${GPU.software} | 畫質=${TIER.name} | features=${GPU.features.join(',')}`);
    if (!isRestart) {
      initInput();
      if (CFG.shot) { S.frozen = true; S.simTime = 40; applyShot(CFG.shot); }
      else { S.timeMin = SHOTS[1].time; S.cam.yaw = SHOTS[1].yaw * DEG; S.cam.pitch = SHOTS[1].pitch * DEG; }
      buildUI(); setMode(S.mode);
      if (CFG.selftest) runSelftest();
      if (CFG.bench) runBench();
      requestAnimationFrame(rafLoop);
    }
  } catch (e) {
    reportError('[start] ' + (e.stack || e));
    fail('啟動時發生錯誤，畫面無法顯示。<br>請改用最新版的 Chrome 或 Edge，或 Safari 26 以上的版本。', String(e && e.message || e));
  }
}
start(false);
